          }).join("");
          sel.innerHTML = opts;
          showSnapInfo(0);
        }).catch(function(e){ sel.innerHTML = '<option value="">加载失败</option>'; });
      }
      function procTsLabel(ts) {
        try {
          var d = new Date(parseInt(ts));
          return d.toLocaleString('zh-CN', {hour12:false});
        } catch(e) { return ts; }
      }
      function showAutoInfo(idx) {
        var ts = autoList[idx];
        info.innerHTML = '<b>类型：</b>自动备份<br/><b>时间：</b>' + procTsLabel(ts) + '<br/><b>位置：</b>doc/versions/' + ts;
      }
      function showSnapInfo(idx) {
        var parts = snapList[idx].split("|");
        info.innerHTML = '<b>类型：</b>专题备份<br/><b>名称：</b>' + (parts[1]||"") + '<br/><b>说明：</b>' + (parts[2]||"-") + '<br/><b>时间：</b>' + (parts[3]||"");
      }
      function refresh() {
        if (curType === "auto") loadAuto(); else loadSnap();
      }
      typeRadios.forEach(function(r){
        r.addEventListener("change", function(){
          curType = r.value;
          refresh();
        });
      });
      sel.addEventListener("change", function(){
        var val = sel.value;
        if (!val) return;
        var idx = parseInt(val.split("-")[1]);
        if (curType === "auto") showAutoInfo(idx);
        else showSnapInfo(idx);
      });
      // 恢复
      document.getElementById("bkRestoreBtn").addEventListener("click", function(){
        var val = sel.value;
        if (!val) { alert("请选择备份"); return; }
        var idx = parseInt(val.split("-")[1]);
        // 自定义确认（WebView 的 confirm 不可靠，用模态二次确认）
        var doRestore = function(content) {
          var json = null;
          var mm = content.match(/\{[\s\S]*\}/);
          if (mm) { try { json = JSON.parse(mm[0]); } catch(e) {} }
          if (!json || !json.steps) { alert("备份内容无法解析"); return; }
          procApplyRestore(json);
          m.remove();
        };
        var procApplying = false;
        var procApplyRestore = function(json) {
          procFlow = json;
          procExpanded = {};
          for (var i = 0; i < json.steps.length; i++) {
            if ((json.steps[i].children || []).length) { procExpanded[String(i)] = true; break; }
          }
          procRenderFlow();
          procSaveFlowDoc();
          procAddSys("已恢复备份");
        };
        // 先确认（自定义确认模态），确认后再读取恢复
        var cm = document.createElement("div");
        cm.className = "proc-modal";
        cm.innerHTML =
          '<div class="pm-box pm-box-sm">' +
          '<div class="pm-head"><span>确认恢复</span></div>' +
          '<div class="pm-body"><div style="font-size:13px;color:var(--ink900);padding:8px 0">确认恢复该备份？将覆盖当前编辑版本。</div></div>' +
          '<div class="pm-foot"><button class="btn btn-secondary" id="cfNo">取消</button>' +
          '<button class="btn btn-primary" id="cfYes">确认恢复</button></div>' +
          '</div>';
        document.body.appendChild(cm);
        document.getElementById("cfNo").addEventListener("click", function(){ cm.remove(); });
        document.getElementById("cfYes").addEventListener("click", function(){
          cm.remove();
          if (curType === "auto") {
            window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function(v){
              var ws = "";
              try { ws = JSON.parse(v || "{}").path || ""; } catch(e) {}
              if (!ws) { alert("未设工作路径"); return; }
              window.__TAURI__.core.invoke("process_auto_load", {
                prjName: currentProject.prjName,
                workspace: ws,
                ts: autoList[idx]
              }).then(doRestore).catch(function(e){ alert("读取失败：" + e); });
            }).catch(function(e){ alert("读取配置失败：" + e); });
          } else {
            var parts = snapList[idx].split("|");
            window.__TAURI__.core.invoke("flow_backup_load", { id: parseInt(parts[0]) })
              .then(doRestore).catch(function(e){ alert("读取失败：" + e); });
          }
        });
      });
      loadAuto();
    }

    // ===== 节点拖拽移动 =====
    // 返回 {parent: 数组, index: 索引} 定位节点
    function procLocate(root, path) {
      var parts = path.split(".");
      var arr = root.steps;
      for (var i = 0; i < parts.length; i++) {
        var idx = parseInt(parts[i]);
        if (idx >= arr.length) return null;
        if (i === parts.length - 1) return { parent: arr, index: idx };
        var node = arr[idx];
        arr = node.children || [];
      }
      return null;
    }

    function procMoveNode(srcPath, dstKey, mode) {
      if (!procFlow) return;
      // 不能移动到自己内部
      if (dstKey === srcPath) return;
      if (dstKey.indexOf(srcPath + ".") === 0) return; // 目标在自己子树内，禁止
      var srcLoc = procLocate(procFlow, srcPath);
      if (!srcLoc) return;
      // 提取节点（含子树）
      var node = srcLoc.parent[srcLoc.index];
      srcLoc.parent.splice(srcLoc.index, 1);

      var ok = false;
      if (mode === "child") {
        // 拖到节点上：成为该节点子节点
        var dstLoc = procLocate(procFlow, dstKey);
        if (dstLoc) {
          var dnode = dstLoc.parent[dstLoc.index];
          if (!dnode.children) dnode.children = [];
          dnode.children.push(node);
          ok = true;
        }
      } else if (mode === "before") {
        // 拖到槽位：插入到指定节点之前（任意层级，路径定位）
        var dstLoc = procLocate(procFlow, dstKey);
        if (dstLoc) {
          dstLoc.parent.splice(dstLoc.index, 0, node);
          ok = true;
        }
      }
      if (!ok) {
        // 失败回退：放回原位置
        srcLoc.parent.splice(Math.min(srcLoc.index, srcLoc.parent.length), 0, node);
        return;
      }
      // 迁移被移动节点的展开状态到新路径（其他节点展开状态保持不变）
      var newPath = "";
      if (mode === "child") {
        var dl = procLocate(procFlow, dstKey);
        if (dl) newPath = dstKey + "." + (dl.parent[dl.index].children.length - 1);
        if (newPath) procMigrateExpanded(srcPath, newPath);
      } else {
        // before：目标节点及其后兄弟路径 +1，源迁移到目标位置
        var dstLoc2 = procLocate(procFlow, dstKey);
        if (dstLoc2) {
          var parentArr = dstLoc2.parent;
          var isRoot = parentArr === procFlow.steps;
          var prefix = isRoot ? "" : procPathOfParent(procFlow, dstLoc2);
          procShiftExpanded(prefix, dstLoc2.index, 1);
        }
        newPath = dstKey;
        procMigrateExpanded(srcPath, newPath);
      }
      // 重新编号（渲染按路径自动生成）+ 保存
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已移动节点：" + (node.name || srcPath) + " → " + dstKey);
    }

    // ===== 流程节点属性编辑 =====
    var procFormList = [];   // 项目已有的表单名
    var procFieldList = [];  // 项目已有的索引字段

    function procFindNodeByPath(root, path) {
      var parts = path.split(".");
      var cur = root;
      for (var i = 0; i < parts.length; i++) {
        if (!cur) return null;
        var idx = parseInt(parts[i]);
        var kids = cur.children || [];
        if (i === 0) {
          if (idx >= cur.steps.length) return null;
          cur = cur.steps[idx];
        } else {
          if (idx >= kids.length) return null;
          cur = kids[idx];
        }
      }
      return cur;
    }

    function procCollectForms() {
      // 遍历流程所有节点收集表单名/索引字段
      procFormList = [];
      procFieldList = [];
      if (!procFlow) return;
      (function walk(nodes, isRoot) {
        var arr = isRoot ? nodes : (nodes.children || []);
        arr.forEach(function(n){
          if (n.props) {
            if (n.props.formName && procFormList.indexOf(n.props.formName) < 0) procFormList.push(n.props.formName);
            if (n.props.indexField && procFieldList.indexOf(n.props.indexField) < 0) procFieldList.push(n.props.indexField);
          }
          if (n.children) walk(n, false);
        });
      })(procFlow.steps, true);
    }

    function procEditProps(path) {
      if (!procFlow) return;
      var node = procFindNodeByPath(procFlow, path);
      if (!node) { procAddSys("节点不存在"); return; }
      procCollectForms();
      var p = node.props || {};
      var m = document.createElement("div");
      m.className = "proc-modal";
      m.innerHTML =
        '<div class="pm-box">' +
        '<div class="pm-head"><span>节点属性编辑：' + escHtml(node.name) + '（' + path + '）</span>' +
        '<button class="pm-close" onclick="this.parentNode.parentNode.parentNode.remove()">×</button></div>' +
        '<div class="pm-body">' +
          '<div class="pm-row">' +
            '<div class="pm-field pm-hor"><label>节点名称</label><input id="pmNodeName" placeholder="节点名称" /></div>' +
            '<div class="pm-field pm-hor"><label>输入内容</label><textarea id="pmInput" class="pm-ta pm-ta-sm pm-hor-ta" placeholder="输入内容描述"></textarea></div>' +
          '</div>' +
          '<div class="pm-row">' +
            '<div class="pm-field pm-hor"><label>表单名称</label>' +
              '<input id="pmForm" list="pmFormList" placeholder="输入或选择表单名" />' +
              '<datalist id="pmFormList"></datalist></div>' +
            '<div class="pm-field pm-hor"><label>索引字段</label>' +
              '<input id="pmField" list="pmFieldList" placeholder="输入或选择索引字段" />' +
              '<datalist id="pmFieldList"></datalist></div>' +
          '</div>' +
          '<div class="pm-field"><label>业务逻辑描述</label><textarea id="pmLogic" class="pm-ta pm-ta-lg" placeholder="业务逻辑描述"></textarea></div>' +
          '<div class="pm-field"><label>输出内容</label><textarea id="pmOutput" class="pm-ta pm-ta-sm" placeholder="输出内容描述"></textarea></div>' +
        '</div>' +
        '<div class="pm-foot"><span class="pm-hint">保存后自动写入流程文档</span><button class="btn btn-primary" id="pmSaveBtn">保存属性</button></div>' +
        '</div>';
      document.body.appendChild(m);
      // 填充当前值
      document.getElementById("pmNodeName").value = node.name || "";
      document.getElementById("pmForm").value = p.formName || "";
      document.getElementById("pmField").value = p.indexField || "";
      document.getElementById("pmInput").value = p.input || "";
      document.getElementById("pmLogic").value = p.logic || "";
      document.getElementById("pmOutput").value = p.output || "";
      // 填充下拉列表
      var dlF = document.getElementById("pmFormList");
      procFormList.forEach(function(f){ var o = document.createElement("option"); o.value = f; dlF.appendChild(o); });
      var dlI = document.getElementById("pmFieldList");
      procFieldList.forEach(function(f){ var o = document.createElement("option"); o.value = f; dlI.appendChild(o); });
      // 点击窗口外自动关闭
      setTimeout(function(){
        document.addEventListener("mousedown", function(e){
          if (!document.body.contains(m)) return;
          if (!m.contains(e.target)) m.remove();
        });
      }, 50);
      // 保存
      document.getElementById("pmSaveBtn").addEventListener("click", function(){
        var formName = document.getElementById("pmForm").value.trim();
        var indexField = document.getElementById("pmField").value.trim();
        var input = document.getElementById("pmInput").value;
        var logic = document.getElementById("pmLogic").value;
        var output = document.getElementById("pmOutput").value;
        // 新表单/新字段自动加入列表（下次下拉可选）
        if (formName && procFormList.indexOf(formName) < 0) procFormList.push(formName);
        if (indexField && procFieldList.indexOf(indexField) < 0) procFieldList.push(indexField);
        var newName = document.getElementById("pmNodeName").value.trim();
        if (newName) node.name = newName;
        node.props = { formName: formName, indexField: indexField, input: input, logic: logic, output: output };
        // 移除弹窗 + 局部 DOM 更新（不重建流程图，保持展开状态，无刷新感）
        m.remove();
        var row = document.querySelector('[data-path="' + path + '"]');
        if (row) {
          var nameEl = row.querySelector(".proc-node-name");
          if (nameEl) nameEl.textContent = node.name;
          var hasProps2 = node.props && (node.props.formName || node.props.indexField || node.props.input || node.props.logic || node.props.output);
          row.classList.toggle("has-props", hasProps2);
          var flag = row.querySelector(".proc-node-flag");
          if (flag) {
            flag.textContent = hasProps2 ? "●" : "○";
            flag.title = hasProps2 ? "已配置属性" : "";
          }
        }
        procSaveFlowDoc();
        procAddSys("节点属性已保存：" + node.name);
      });
    }

    function procSaveFlowDoc() {
      // 保存当前流程（含属性）到 doc 目录
      if (!procFlow || !currentProject) return;
      if (!window.__TAURI__ || !window.__TAURI__.core) return;
      window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function(v){
        var ws = "";
        try { ws = JSON.parse(v || "{}").path || ""; } catch(e) {}
        if (!ws) return;
        var fileName = currentProject.prjName + "_flow.json";
        window.__TAURI__.core.invoke("process_save", {
          prjName: currentProject.prjName,
          workspace: ws,
          fileName: fileName,
          content: JSON.stringify(procFlow, null, 2)
        }).then(function(){
          // 内部保存：更新监测基线（签名=当前文件状态），避免自身保存触发重载
          window.__TAURI__.core.invoke("process_list", {
            prjName: currentProject.prjName,
            workspace: ws
          }).then(function(files){
            procLastFiles = (files && files.length) ? files.join(",") : null;
          }).catch(function(){});
        }).catch(function(e){ procAddSys("保存失败：" + e); });
      });
    }

    function procSaveRaw(rawText) {
      if (!currentProject) return;
      if (!window.__TAURI__ || !window.__TAURI__.core) return;
      window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function(v){
        var ws = "";
        try { ws = JSON.parse(v || "{}").path || ""; } catch(e) {}
        if (!ws) return;
        window.__TAURI__.core.invoke("process_save", {
          prjName: currentProject.prjName,
          workspace: ws,
          fileName: "流程描述.md",
          content: "# 业务流程描述" + String.fromCharCode(10) + String.fromCharCode(10) + rawText
        }).then(function(r){
          procAddSys("原始描述已保存：" + r);
        }).catch(function(e){
          procAddSys("保存失败：" + e);
        });
      });
    }

    function procSave() {
      if (!procFlow || !currentProject) return;
      if (!window.__TAURI__ || !window.__TAURI__.core) return;
      window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function(v){
        var ws = "";
        try { ws = JSON.parse(v || "{}").path || ""; } catch(e) {}
        if (!ws) return;
        var docName = (procFlow.flow_name || "业务流程") + ".json";
        window.__TAURI__.core.invoke("process_save", {
          prjName: currentProject.prjName,
          workspace: ws,
          fileName: docName,
          content: JSON.stringify(procFlow, null, 2)
        }).then(function(r){
          procAddSys("已保存：" + r);
        }).catch(function(e){
          procAddSys("保存失败：" + e);
        });
      });
    }

    function procRestore() {
      if (!currentProject || !window.__TAURI__ || !window.__TAURI__.core) return;
      window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function(v){
        var ws = "";
        try { ws = JSON.parse(v || "{}").path || ""; } catch(e) {}
        if (!ws) return;
        window.__TAURI__.core.invoke("process_list", {
          prjName: currentProject.prjName,
          workspace: ws
        }).then(function(files){
          if (files && files.length) {
            var fnames = files.map(function(f){ return f.split("|")[0]; });
            procAddSys("发现已有流程文档：" + fnames.join("、") + "（重新生成将覆盖）");
            // 加载第一个流程 JSON 并渲染
            window.__TAURI__.core.invoke("process_load", {
              prjName: currentProject.prjName,
              workspace: ws,
              fileName: fnames[0]
            }).then(function(content){
              var json = null;
              var m = content.match(/\{[\s\S]*\}/);
              if (m) { try { json = JSON.parse(m[0]); } catch(e) {} }
              if (json && json.steps) {
                procFlow = json;
                procExpanded = {};
                for (var i = 0; i < json.steps.length; i++) {
                  if (json.steps[i].children && json.steps[i].children.length) {
                    procExpanded[i] = true;
                    break;
                  }
                }
                procRenderFlow();
                procAddSys("已加载：" + (json.flow_name || (files[0] || "").split("|")[0]));
              }
            }).catch(function(){});
          }
        }).catch(function(){});
      });
    }

    // 动态页分发
    function renderDynamic(idx, kind) {
      if (kind === "workspace") renderWorkspace();
      else if (kind === "models") renderModels();
      else if (kind === "agents") renderAgents();
      else if (kind === "constraints") renderConstraints();
      else if (kind === "theme") renderTheme();
      else if (kind === "process") renderProcess();
      else if (kind === "chat") renderChat();
    }

    function render(idx) {
      // 清理页面级 class（防残留导致布局问题）
      content.classList.remove("chat-page", "theme-page", "constr-page");
      current = idx;
      var m = MODULES[idx];
      var body = m.body.map(function(t){ return "<p>" + t + "</p>"; }).join("");
      var extra = (idx === 5) ? dbBox() : '';
      if (idx === 0) { renderInfoPanel(); items.forEach(function(el){ el.classList.toggle("active", el.dataset.m == idx); }); return; }
      if (m.dynamic) { renderDynamic(idx, m.dynamic); items.forEach(function(el){ el.classList.toggle("active", el.dataset.m == idx); }); return; }
      content.innerHTML =
        '<div class="page-title">' + m.t + '</div>' +
        '<div class="page-sub">' + m.s + '</div>' +
        '<div class="panel"><h4>' + m.t + '</h4>' + body +
        '<div class="ph short"></div><div class="ph"></div><div class="ph xs"></div></div>' + extra;
      items.forEach(function(el){ el.classList.toggle("active", el.dataset.m == idx); });
    }

    // 初始化本地 SQLite：调用 Rust 命令 db_init（后端 rusqlite 建库 + 建表）
    async function initDb() {
      try {
        if (!window.__TAURI__ || !window.__TAURI__.core) { dbState.msg = "Tauri 不可用（未连接）"; render(current); return; }
        dbState.msg = await window.__TAURI__.core.invoke("db_init");
        dbState.ready = true;
      } catch(e) { dbState.msg = "数据库初始化失败：" + e; }
      render(current);
    }

    items.forEach(function(el){
      el.addEventListener("click", function(){ render(+el.dataset.m); });
    });

    // ===== 项目下拉框 + 新增项目 =====
    function loadProjects() {
      if (!window.__TAURI__ || !window.__TAURI__.core) return;
      window.__TAURI__.core.invoke("project_list").then(function(list){
        var sel = document.getElementById("projSel");
        sel.innerHTML = "";
        var opt0 = document.createElement("option");
        opt0.value = ""; opt0.textContent = "未选择项目";
        sel.appendChild(opt0);
        (list || []).forEach(function(p){
          var o = document.createElement("option");
          o.value = p.prjGUID;
          o.textContent = p.prjName + " · " + p.prjType;
          sel.appendChild(o);
        });
      }).catch(function(e){ console.error("loadProjects:", e); });
    }

    function showProjectModal(){ document.getElementById("projModal").classList.add("show"); }
    function hideProjectModal(){ document.getElementById("projModal").classList.remove("show"); }

    // ===== 新增项目：分步进度显示（不阻塞 UI） =====
    function showProgressBox(title) {
      var box = document.getElementById("projProgress");
      if (!box) {
        box = document.createElement("div");
        box.id = "projProgress";
        box.className = "proj-progress";
        document.body.appendChild(box);
      }
      box.innerHTML = '<div class="prog-title">' + title + '</div><div class="prog-list"></div>';
      box.classList.add("show");
      return box;
    }
    function addProgressStep(box, label) {
      var list = box.querySelector(".prog-list");
      var row = document.createElement("div");
      row.className = "prog-step";
      row.innerHTML = '<span class="prog-dot"></span><span class="prog-text">' + label + '</span>';
      list.appendChild(row);
      return row;
    }
    function setStepState(row, ok, msg) {
      row.className = "prog-step " + (ok ? "ok" : "fail");
      row.querySelector(".prog-text").textContent += (msg ? " — " + msg : "");
      if (ok) row.querySelector(".prog-dot").textContent = "✓";
      else row.querySelector(".prog-dot").textContent = "✗";
    }

    async function saveProject() {
      var name = document.getElementById("pjName").value.trim();
      var type = document.getElementById("pjType").value;
      var desc = document.getElementById("pjDesc").value.trim();
      if (!name) { alert("请输入项目名称"); return; }

      // 显示进度框（界面不假死：invoke 是异步 Promise）
      var box = showProgressBox("正在创建项目：<b>" + name + "</b>");
      var stepDb = addProgressStep(box, "写入数据库");
      var stepDir = addProgressStep(box, "创建项目目录");
      var stepTpl = addProgressStep(box, "复制开发模板");
      var stepDoc = addProgressStep(box, "生成项目说明");
      setStepState(stepDb, true, "开始");

      try {
        var res = await window.__TAURI__.core.invoke("project_create", {
          prjName: name, prjType: type, prjDescription: desc
        });
        // 根据返回的 steps 更新进度
        if (res && res.steps) {
          res.steps.forEach(function(s){
            if (s.step === "数据库") setStepState(stepDb, s.ok, s.msg);
            else if (s.step === "目录") setStepState(stepDir, s.ok, s.msg);
            else if (s.step === "模板") setStepState(stepTpl, s.ok, s.msg);
            else if (s.step === "说明") setStepState(stepDoc, s.ok, s.msg);
          });
        }
        if (res && res.error) {
          setTimeout(function(){ alert("部分步骤失败：" + res.error); }, 100);
        }
        var guid = res && res.guid ? res.guid : null;
        // 成功提示 + 关闭弹窗
        setTimeout(function(){
          box.classList.remove("show");
          hideProjectModal();
          loadProjects();
          if (guid) {
            var sel = document.getElementById("projSel");
            sel.value = guid;
          }
          document.getElementById("statusText").textContent = "已保存项目：" + name;
        }, 1200);
      } catch(e) {
        setStepState(stepDb, false, String(e));
        setStepState(stepDir, false, "已跳过");
        setStepState(stepTpl, false, "已跳过");
        setStepState(stepDoc, false, "已跳过");
        setTimeout(function(){ box.classList.remove("show"); alert("保存失败：" + e); }, 100);
      }
    }

    document.getElementById("projAdd").addEventListener("click", showProjectModal);
    document.getElementById("pjCancel").addEventListener("click", hideProjectModal);
    document.getElementById("pjSave").addEventListener("click", saveProject);

    // IPC 状态
    if (window.__TAURI__ && window.__TAURI__.core) {
      document.getElementById("ipcState").textContent = "已连接 Tauri";
      document.getElementById("statusText").textContent = "IPC 就绪";
    }

    bindProjSel();
    render(0);
    initDb();
    loadProjects();
  </script>
