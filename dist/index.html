<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TDev</title>
  <style>
    /* ===== tokens（承接 theme/tokens.json · 北极冰山·深邃蓝） ===== */
    :root {
      --p900:#072B4E; --p700:#0A4D8C; --p500:#1A6CB3; --p300:#5C9FD6; --p100:#C9E2F5; --p050:#E8F3FB;
      --ink900:#102A43; --ink700:#334E68; --ink500:#627D98; --ink300:#9FB3C8; --line300:#D2E0EC;
      --bg:#F4F8FC; --surface:#FFFFFF; --sunken:#EAF2FA;
      --success:#2E9E6B; --warning:#D9822B; --danger:#D64545;
      --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px;
      --sh-sm:0 1px 2px rgba(7,43,78,.08); --sh-md:0 2px 8px rgba(7,43,78,.10); --sh-lg:0 8px 24px rgba(7,43,78,.16);
      --ease:cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
      background:var(--bg); color:var(--ink900);
      display:flex; flex-direction:column; height:100vh; overflow:hidden;
    }
    /* ===== 顶部标题栏 ===== */
    .topbar {
      height:56px; flex:none; background:var(--surface); border-bottom:1px solid var(--line300);
      display:flex; align-items:center; padding:0 20px; gap:12px;
    }
    .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; color:var(--p700); }
    .brand .mark { width:14px; height:14px; border-radius:4px; background:linear-gradient(135deg,var(--p700),var(--p300)); }
    .topbar .right { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:13px; color:var(--ink500); }
    /* ===== 中部主功能区 ===== */
    .main { flex:1; display:flex; min-height:0; }
    /* 左侧功能导航菜单栏 */
    .menu {
      width:240px; flex:none; background:var(--surface); border-right:1px solid var(--line300);
      padding:16px 12px; overflow-y:auto;
    }
    .menu .menu-title { font-size:12px; color:var(--ink500); letter-spacing:.5px; padding:0 8px 10px; }
    .menu .mi {
      display:flex; align-items:center; gap:10px; padding:12px 12px; border-radius:var(--r-md);
      font-size:14px; color:var(--ink700); cursor:pointer; transition:background .15s var(--ease),color .15s var(--ease);
      position:relative; user-select:none;
    }
    .menu .mi:hover { background:var(--p050); }
    .menu .mi.active { background:var(--p050); color:var(--p700); font-weight:600; }
    .menu .mi.active::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:2px; background:var(--p700); }
    .menu .mi svg { width:20px; height:20px; flex:none; stroke-width:1.5; }
    /* 右侧功能展示、操作区 */
    .content { flex:1; overflow-y:auto; padding:24px; }
    .content.chat-page { overflow:hidden; padding-bottom:12px; }
    .content.theme-page { overflow:hidden; padding-bottom:12px; }
    .content.constr-page { overflow:hidden; padding-bottom:12px; }
    .content.process-page { overflow:hidden; padding-bottom:12px; }
    .page-title { font-size:24px; font-weight:600; margin-bottom:4px; }
    .page-sub { font-size:14px; color:var(--ink500); margin-bottom:24px; }
    .panel { background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); box-shadow:var(--sh-sm); padding:24px; }
    .panel h4 { font-size:20px; font-weight:600; margin-bottom:12px; }
    .panel p { font-size:14px; color:var(--ink700); line-height:1.6; margin-bottom:8px; }
    .ph { height:10px; border-radius:var(--r-sm); background:var(--p050); margin-bottom:8px; }
    .ph.short { width:70%; }
    .ph.xs { width:40%; }
    /* ===== 底部标题栏（状态栏） ===== */
    .bottombar {
      height:32px; flex:none; background:var(--surface); border-top:1px solid var(--line300);
      display:flex; align-items:center; padding:0 20px; gap:20px; font-size:12px; color:var(--ink500);
    }
    .bottombar .r { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--success); }
    /* ===== 项目下拉条 ===== */
    .proj-bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    .proj-sel {
      flex:1; height:32px; padding:0 10px; border:1px solid var(--line300); border-radius:var(--r-md);
      font-size:13px; font-family:inherit; color:var(--ink900); background:var(--surface);
    }
    .proj-sel:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.25); }
    .proj-add {
      width:32px; height:32px; flex:none; border:none; border-radius:var(--r-md); background:var(--p700); color:#fff;
      font-size:20px; line-height:1; cursor:pointer; transition:background .15s var(--ease);
    }
    .proj-add:hover { background:var(--p900); }
    /* ===== 模态框 ===== */
    .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(16,42,67,.45); z-index:50; }
    .modal.show { display:flex; }
    .modal-box { width:440px; background:var(--surface); border-radius:var(--r-xl); box-shadow:var(--sh-lg); padding:24px; }
    .modal-box h4 { font-size:20px; font-weight:600; margin-bottom:16px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:13px; color:var(--ink700); margin-bottom:6px; font-weight:600; }
    .field input, .field select, .field textarea {
      width:100%; padding:8px 10px; border:1px solid var(--line300); border-radius:var(--r-md);
      font-size:14px; font-family:inherit; color:var(--ink900); background:var(--surface);
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.25); }
    .field textarea { resize:vertical; min-height:64px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:12px; margin-top:20px; }
    .btn { border:none; border-radius:var(--r-md); font-size:14px; cursor:pointer; padding:0 16px; height:32px; transition:background .15s var(--ease); }
    .btn-primary { background:var(--p700); color:#fff; }
    .btn-primary:hover { background:var(--p900); }
    .btn-secondary { background:var(--surface); color:var(--ink900); border:1px solid var(--line300); }
    .btn-secondary:hover { border-color:var(--p500); color:var(--p500); }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-danger:hover { background:#b93a3a; }
    /* 基础信息面板 */
    .info-grid { display:flex; flex-direction:column; gap:0; border:1px solid var(--line300); border-radius:var(--r-lg); overflow:hidden; }
    .info-row { display:flex; padding:12px 16px; border-bottom:1px solid var(--line300); font-size:14px; }
    .info-row:last-child { border-bottom:none; }
    .info-row:nth-child(even) { background:var(--bg); }
    .info-label { width:140px; flex:none; color:var(--ink500); font-weight:600; }
    .info-value { flex:1; color:var(--ink900); }
    .info-value.mono { font-family:Consolas,monospace; font-size:13px; color:var(--p700); }
    .info-actions { display:flex; justify-content:flex-end; margin-top:20px; }
    /* 项目空间 */
    .ws-row { display:flex; gap:8px; align-items:center; }
    .ws-input { flex:1; height:32px; padding:0 10px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:14px; font-family:inherit; color:var(--ink900); background:var(--surface); }
    .ws-input:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.25); }
    /* 配置网格（模型 / Agent 表单） */
    .cfg-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
    .cfg-grid .field { margin-bottom:14px; }
    /* 已配置条目 */
    .cfg-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line300); border-radius:var(--r-md); margin-bottom:8px; background:var(--surface); }
    .cfg-item-main { flex:1; min-width:0; }
    .cfg-item-name { display:block; font-size:14px; font-weight:600; color:var(--ink900); }
    .cfg-item-sub { display:block; font-size:12px; color:var(--ink500); margin-top:2px; word-break:break-all; }
    .cfg-item-key { display:block; font-size:12px; color:var(--p700); margin-top:2px; font-family:Consolas,monospace; }
    .btn-sm { height:24px; padding:0 12px; font-size:12px; }
    /* 新增项目进度框 */
    .proj-progress {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      width:420px; background:var(--surface); border-radius:var(--r-xl);
      box-shadow:var(--sh-lg); border:1px solid var(--line300);
      padding:20px 24px; z-index:100; display:none;
    }
    .proj-progress.show { display:block; }
    .prog-title { font-size:15px; font-weight:600; color:var(--ink900); margin-bottom:14px; }
    .prog-list { display:flex; flex-direction:column; gap:8px; }
    .prog-step { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bg); border-radius:var(--r-md); font-size:13px; color:var(--ink700); }
    .prog-dot { width:18px; height:18px; flex:none; border-radius:50%; background:var(--p300); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; }
    .prog-step.ok .prog-dot { background:var(--success); }
    .prog-step.fail .prog-dot { background:var(--danger); }
    .prog-step.fail { color:var(--danger); }
    /* ===== 聊天界面（QQ 风格） ===== */
    .chat-panel { display:flex; flex-direction:column; height:calc(100vh - 225px); min-height:380px; background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); overflow:hidden; }
    .chat-head { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--line300); }
    .chat-agent-label { font-size:13px; color:var(--ink700); font-weight:600; }
    .chat-sel { height:28px; padding:0 8px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:12px; color:var(--ink900); background:var(--surface); min-width:160px; max-width:280px; }
    .chat-status { font-size:12px; padding:2px 10px; border-radius:10px; font-weight:600; }
    .chat-status.on { background:rgba(46,158,107,.15); color:#1e7a52; }
    .chat-status.off { background:rgba(214,69,69,.12); color:#b03a3a; }
    .chat-status.pending { background:rgba(217,130,43,.15); color:#a4651a; }
    .chat-msg-list { flex:1; overflow-y:auto; padding:16px; background:var(--bg); display:flex; flex-direction:column; gap:10px; }
    .chat-row { display:flex; }
    .chat-row.me { justify-content:flex-end; }
    .chat-row.agent { justify-content:flex-start; }
    .chat-bubble { max-width:70%; padding:9px 14px; border-radius:12px; font-size:14px; line-height:1.5; word-break:break-word; }
    .chat-row.me .chat-bubble { background:var(--p700); color:#fff; border-bottom-right-radius:4px; }
    .chat-row.agent .chat-bubble { background:var(--surface); color:var(--ink900); border:1px solid var(--line300); border-bottom-left-radius:4px; }
    .chat-sys { text-align:center; font-size:12px; color:var(--ink500); padding:4px 0; }
    .chat-input-row { display:flex; gap:10px; padding:12px 16px; background:var(--surface); border-top:1px solid var(--line300); }
    .chat-input { flex:1; height:36px; padding:0 14px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:14px; font-family:inherit; color:var(--ink900); background:var(--surface); }
    .chat-input:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.25); }
    /* ===== 主题风格页 ===== */
    .theme-panel { display:flex; flex-direction:column; gap:16px; max-width:1204px; height:calc(100vh - 190px); min-height:440px; background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); padding:24px; overflow:hidden; }
    .theme-row { display:flex; align-items:center; gap:12px; }
    .theme-row-preview { flex:1; min-height:0; align-items:stretch; }
    .theme-label { font-size:13px; color:var(--ink700); font-weight:600; min-width:70px; }
    .theme-result { flex:1; min-height:260px; max-height:420px; overflow:auto; background:var(--bg); border:1px solid var(--line300); border-radius:var(--r-md); padding:12px; font-family:"Cascadia Code",Consolas,monospace; font-size:12px; color:var(--ink900); white-space:pre-wrap; word-break:break-all; }
    .theme-color { width:44px; height:32px; border:1px solid var(--line300); border-radius:var(--r-md); padding:2px; background:var(--surface); cursor:pointer; }
    .theme-color-hint { font-size:12px; color:var(--ink500); }
    .theme-tpl-info { font-size:12px; color:var(--ink500); font-family:Consolas,monospace; }
    .theme-preview { flex:1; width:100%; height:100%; min-height:0; border:1px solid var(--line300); border-radius:var(--r-md); background:#fff; }
    .theme-panel .theme-row:last-child { margin-top:auto; }
    /* ===== 项目约束页 ===== */
    .constr-panel { display:flex; flex-direction:column; gap:20px; max-width:960px; background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); padding:24px; overflow-y:auto; max-height:calc(100vh - 190px); }
    .constr-loading, .constr-empty { color:var(--ink500); font-size:14px; padding:20px; text-align:center; }
    .constr-sec { font-size:16px; font-weight:600; color:var(--ink900); margin:8px 0 12px; padding-left:12px; border-left:3px solid var(--p700); }
    .constr-files { display:flex; gap:12px; flex-wrap:wrap; }
    .constr-card { display:flex; align-items:center; gap:12px; flex:1; min-width:240px; padding:14px 16px; background:var(--bg); border:1px solid var(--line300); border-radius:var(--r-lg); cursor:pointer; transition:all .15s; }
    .constr-card:hover { border-color:var(--p500); box-shadow:0 2px 8px rgba(26,108,179,.12); transform:translateY(-1px); }
    .cc-icon { width:40px; height:40px; border-radius:10px; background:var(--p700); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex:none; }
    .cc-body { flex:1; min-width:0; }
    .cc-name { font-size:14px; font-weight:600; color:var(--ink900); }
    .cc-desc { font-size:12px; color:var(--ink500); margin-top:2px; }
    .cc-arrow { font-size:20px; color:var(--ink400); }
    .constr-table { width:100%; border-collapse:collapse; font-size:13px; }
    .constr-table th { background:var(--bg); color:var(--ink700); font-weight:600; text-align:left; padding:10px 12px; border-bottom:2px solid var(--line300); }
    .constr-table td { padding:10px 12px; border-bottom:1px solid var(--line200); color:var(--ink900); vertical-align:top; }
    .constr-forbid { color:var(--danger); }
    .constr-list { display:flex; flex-direction:column; gap:8px; }
    .constr-item { display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--ink900); cursor:default; }
    .constr-item input { margin-top:2px; }
    .constr-steps { display:flex; gap:8px; flex-wrap:wrap; }
    .constr-step { display:flex; align-items:center; gap:10px; flex:1; min-width:200px; padding:12px; background:var(--bg); border:1px solid var(--line300); border-radius:var(--r-lg); }
    .cs-num { width:28px; height:28px; border-radius:50%; background:var(--p700); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex:none; }
    .cs-text { font-size:13px; color:var(--ink900); }
    .constr-details { border:1px solid var(--line300); border-radius:var(--r-md); padding:12px 16px; }
    .constr-details summary { cursor:pointer; font-size:13px; font-weight:600; color:var(--ink700); }
    .constr-modal { position:fixed; inset:0; background:rgba(16,42,67,.5); z-index:999; display:flex; align-items:center; justify-content:center; }
    .cm-box { width:80%; max-width:900px; height:80%; background:var(--surface); border-radius:var(--r-lg); display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--sh-lg); }
    .cm-head { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--bg); border-bottom:1px solid var(--line300); font-weight:600; color:var(--ink900); }
    .cm-close { background:none; border:none; font-size:24px; color:var(--ink500); cursor:pointer; }
    .cm-body { flex:1; overflow:auto; padding:20px; font-family:"Cascadia Code",Consolas,monospace; font-size:12px; color:var(--ink900); white-space:pre-wrap; }
    /* ===== 业务流程页 ===== */
    .proc-layout { display:flex; gap:16px; height:calc(100vh - 190px); min-height:440px; }
    .proc-chat { flex:1 1 37.5%; min-width:0; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); overflow:hidden; }
    .proc-chat-head { padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--line300); font-weight:600; color:var(--ink900); font-size:14px; }
    .proc-chat-list { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--bg); }
    .proc-chat-input { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line300); background:var(--surface); align-items:flex-end; }
    .proc-ta { flex:1; min-height:56px; max-height:140px; resize:vertical; font-family:inherit; line-height:1.5; }
    .proc-canvas { flex:1 1 62.5%; min-width:0; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); overflow:hidden; }
    .proc-canvas-head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--line300); }
    .proc-canvas-head span { font-weight:600; color:var(--ink900); font-size:14px; }
    .proc-hint { font-size:12px; color:var(--ink500); font-weight:400; display:flex; align-items:center; gap:6px; }
    .btn-xs { padding:3px 10px; font-size:12px; border:1px solid var(--line300); border-radius:6px; background:var(--surface); color:var(--ink700); cursor:pointer; }
    .btn-xs:hover { border-color:var(--p500); color:var(--p700); }
    .proc-sep { width:1px; height:16px; background:var(--line300); display:inline-block; vertical-align:middle; margin:0 6px; }
    .btn-acc { border-color:var(--p500); color:var(--p700); font-weight:600; }
    .btn-acc:hover { background:rgba(26,108,179,.1); }
    .proc-canvas-body { flex:1; overflow-y:auto; padding:24px; }
    .proc-empty { text-align:center; color:var(--ink400); font-size:14px; padding:60px 0; }
    .proc-flow { display:flex; flex-direction:column; align-items:stretch; }
    .proc-row { display:flex; align-items:flex-start; gap:0; min-height:56px; }
    .proc-main-col { flex:none; width:270px; }
    .proc-node-col { flex:none; width:250px; }
    .proc-node-col.main { width:200px; }
    .proc-sub-node { position:relative; display:flex; align-items:center; gap:6px; padding:7px 12px; min-width:220px; background:var(--bg); border:1px solid var(--line300); border-radius:var(--r-md); cursor:pointer; font-weight:500; color:var(--ink900); transition:all .15s; font-size:13px; }
    .proc-sub-node:hover { border-color:var(--p500); background:var(--bg); }
    .proc-sub-node.expanded { border-color:var(--p500); background:rgba(26,108,179,.08); }
    .proc-main-node { position:relative; display:flex; align-items:center; gap:8px; padding:10px 14px; min-width:240px; background:var(--p700); color:#fff; border-radius:var(--r-lg); cursor:pointer; font-weight:600; transition:all .15s; box-shadow:0 2px 6px rgba(26,108,179,.2); }
    .proc-main-node:hover { transform:translateY(-1px); box-shadow:0 4px 10px rgba(26,108,179,.3); }
    .proc-main-node.expanded { background:var(--p500); }
    .proc-node-num { width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:12px; flex:none; }
    .proc-node-name { font-size:14px; flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .proc-node-more { margin-left:8px; font-size:16px; opacity:.9; }
    .proc-node-flag { margin-left:8px; width:22px; height:22px; font-size:14px; line-height:22px; text-align:center; cursor:pointer; color:var(--ink400); flex:none; border-radius:50%; background:var(--bg); border:1px solid var(--line300); }
    .proc-main-node .proc-node-flag { background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.4); color:#fff; }
    .proc-node-flag:hover { border-color:var(--p500); }
    .proc-main-node.has-props .proc-node-flag, .proc-sub-node.has-props .proc-node-flag { color:#2e9e6b; border-color:#2e9e6b; background:rgba(46,158,107,.15); }
    .proc-node-ops { position:absolute; top:-16px; right:0; display:flex; gap:4px; opacity:0; transition:opacity .15s; z-index:30; background:var(--surface); border:1px solid var(--line300); border-radius:8px; padding:2px 4px; box-shadow:0 2px 8px rgba(16,42,67,.15); }
    .proc-main-node:hover .proc-node-ops, .proc-sub-node:hover .proc-node-ops { opacity:1; }
    .proc-op { padding:1px 5px; font-size:10px; border:1px solid var(--line300); border-radius:5px; background:var(--surface); color:var(--ink700); cursor:pointer; line-height:1.5; white-space:nowrap; flex:none; }
    .proc-op:hover { border-color:var(--p500); color:var(--p700); }
    .proc-main-node .proc-op { background:var(--surface); border-color:var(--line300); color:var(--ink700); }
    .proc-main-node .proc-op:hover { border-color:var(--p500); color:var(--p700); }
    .proc-op-del { color:#b03a3a; }
    .proc-op-del:hover { border-color:#b03a3a; color:#b03a3a; }
    .proc-main-node .proc-node-flag { color:rgba(255,255,255,.6); }
    .proc-main-node.has-props, .proc-sub-node.has-props { box-shadow:0 0 0 2px var(--p400); }

    .proc-sub-node.has-props { border-color:var(--p500); }
    /* 属性编辑弹窗 */
    .proc-modal { position:fixed; inset:0; background:rgba(16,42,67,.5); z-index:999; display:flex; align-items:center; justify-content:center; }
    .pm-box { width:784px; max-height:90%; background:var(--surface); border-radius:var(--r-lg); display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--sh-lg); }
    .pm-head { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--bg); border-bottom:1px solid var(--line300); font-weight:600; color:var(--ink900); }
    .pm-close { background:none; border:none; font-size:22px; color:var(--ink500); cursor:pointer; }
    .pm-body { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
    .pm-field { display:flex; flex-direction:column; gap:4px; }
    .pm-row { display:flex; gap:16px; align-items:stretch; }
    .pm-row .pm-field { flex:1; min-width:0; }
    .pm-hor { flex-direction:row; align-items:center; gap:8px; }
    .pm-hor label { flex:none; width:64px; text-align:right; }
    .pm-hor input { flex:1; min-width:0; }
    .pm-hor-ta { flex:1; min-width:0; }
    .pm-field label { font-size:12px; font-weight:600; color:var(--ink700); }
    .pm-field input { padding:8px 12px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:13px; color:var(--ink900); background:var(--bg); }
    .pm-field select#bkSel { width:100%; min-height:96px; padding:10px 12px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:16px; color:var(--ink900); background:var(--bg); cursor:pointer; }
    .pm-field select#bkSel:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.15); }
    .pm-field select#bkSel option { font-size:15px; padding:6px 4px; }
    .pm-field input:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.15); }
    .pm-ta { min-height:100px; max-height:200px; padding:8px 12px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:13px; color:var(--ink900); background:var(--bg); resize:vertical; font-family:inherit; line-height:1.5; }
    .pm-ta-sm { min-height:52px; max-height:80px; }   /* 输入/输出：2 行文字高 */
    .pm-ta-lg { min-height:220px; max-height:320px; } /* 业务逻辑：吸收省出的高度 */
    .pm-ta:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.15); }
    .pm-foot { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--bg); border-top:1px solid var(--line300); }
    .pm-hint { font-size:12px; color:var(--ink500); }
    .pm-box-sm { width:520px; }
    .pm-radio-row { display:flex; gap:16px; font-size:13px; color:var(--ink900); }
    .pm-radio-row label { display:flex; align-items:center; gap:4px; cursor:pointer; }
    .pm-info { font-size:13px; color:var(--ink900); background:var(--bg); border:1px solid var(--line300); border-radius:var(--r-md); padding:10px 12px; line-height:1.7; min-height:60px; }
    .proc-main-arrow { color:var(--p500); font-size:18px; padding:4px 0 4px 16px; margin-left:0; }
    .proc-drop-slot { padding:4px 0; border-radius:8px; transition:background .15s; }
    .proc-child-slot { padding:2px 0; width:100%; }
    .proc-child-slot .proc-child-arrow { text-align:left; padding-left:6px; color:var(--ink400); font-size:11px; }
    .proc-drop-slot.drag-over { background:rgba(26,108,179,.12); box-shadow:inset 0 0 0 2px var(--p400); }
    .proc-main-node.drag-target, .proc-sub-node.drag-target { box-shadow:0 0 0 3px #ffd700; outline:2px dashed #ffd700; }
    .proc-main-node[draggable="true"], .proc-sub-node[draggable="true"] { cursor:grab; }
    .proc-main-node[draggable="true"]:active, .proc-sub-node[draggable="true"]:active { cursor:grabbing; }
    /* 右列分支：连接线 + 子流程列 */
    .proc-branch { display:flex; align-items:center; flex:1; min-width:0; }
    .proc-branch-link { width:36px; flex:none; height:0; border-top:2px solid var(--p400); position:relative; margin-top:0; }
    .proc-branch-link::after { content:''; position:absolute; right:-5px; top:-5px; width:8px; height:8px; border-radius:50%; background:var(--p400); }
    .proc-branch-col { display:flex; flex-direction:column; align-items:flex-start; padding:4px 0 4px 10px; border-left:2px dashed var(--line300); }
    .proc-child-node { display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--bg); border:1px solid var(--line300); border-radius:var(--r-md); font-size:13px; color:var(--ink900); }
    .proc-child-num { font-size:11px; color:var(--ink400); min-width:32px; }
    .proc-child-name { font-size:13px; }
    .proc-child-arrow { color:var(--ink400); font-size:12px; padding-left:14px; }
    .cm-edit { border:none; resize:none; outline:none; background:var(--surface); line-height:1.6; }
    .cm-edit:focus { box-shadow:inset 0 0 0 1px var(--p500); }
    .cm-foot { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background:var(--bg); border-top:1px solid var(--line300); }
    .cm-hint { font-size:12px; color:var(--ink500); }
    .cm-save-status { font-size:12px; padding:2px 10px; border-radius:10px; margin-right:8px; }
    .cm-save-status.ok { background:rgba(46,158,107,.15); color:#1e7a52; }
    .cm-save-status.dirty { background:rgba(217,130,43,.15); color:#a4651a; }
    .cm-save-status.err { background:rgba(214,69,69,.12); color:#b03a3a; }
  </style>
</head>
<body>
  <!-- 顶部标题栏 -->
  <header class="topbar">
    <div class="brand"><span class="mark"></span>TDev</div>
    <div class="right">
      <span id="envTag">北极冰山 · 深邃蓝</span>
      <span id="ipcState">未连接</span>
    </div>
  </header>

  <!-- 中部主功能区 -->
  <div class="main">
    <!-- 左侧功能导航菜单栏 -->
    <aside class="menu">
      <div class="proj-bar">
        <select id="projSel" class="proj-sel"><option value="">未选择项目</option></select>
        <button id="projAdd" class="proj-add" title="新增项目">＋</button>
      </div>
      <div class="menu-title">项目工作</div>
      <div class="mi active" data-m="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg>基础信息</div>
      <div class="mi" data-m="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 0 0 18h1.5a2 2 0 0 0 1.6-3.2A2 2 0 0 1 14 15.6H19a2 2 0 0 0 2-2A9 9 0 0 0 12 3z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16.5" cy="10.5" r="1"/></svg>主题风格</div>
      <div class="mi" data-m="2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/><path d="M9.5 12l2 2 3.5-3.5"/></svg>项目约束</div>
      <div class="mi" data-m="3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="5" rx="1"/><rect x="14" y="15" width="7" height="5" rx="1"/><path d="M6.5 9v3a3 3 0 0 0 3 3h4.5"/></svg>业务流程</div>
      <div class="mi" data-m="4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg>部署发布</div>
      <div class="menu-title" style="margin-top:24px">工具设置</div>
      <div class="mi" data-m="5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 12h18"/></svg>项目空间</div>
      <div class="mi" data-m="6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M6 6l1.8 1.8M16.2 16.2L18 18M18 6l-1.8 1.8M7.8 16.2L6 18"/></svg>模型配置</div>
      <div class="mi" data-m="7"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 3v5"/><circle cx="9" cy="13" r="0.6"/><circle cx="15" cy="13" r="0.6"/></svg>Agent配置</div>
      <div class="menu-title" style="margin-top:24px">测试模块</div>
      <div class="mi" data-m="8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Agent连接测试</div>
    </aside>

    <!-- 右侧功能展示、操作区 -->
    <section class="content" id="content"></section>
  </div>

  <!-- 底部标题栏（状态栏） -->
  <footer class="bottombar">
    <span>TDev v0.1.0</span>
    <span class="r"><span class="status-dot"></span><span id="statusText">就绪</span></span>
  </footer>

  <!-- 新增项目模态框 -->
  <div class="modal" id="projModal">
    <div class="modal-box">
      <h4>新增项目</h4>
      <div class="field"><label>项目名称</label><input id="pjName" type="text" placeholder="请输入项目名称" /></div>
      <div class="field"><label>项目类型</label>
        <select id="pjType">
          <option value="web">web</option>
          <option value="windows program">windows program</option>
          <option value="Tauri">Tauri</option>
        </select>
      </div>
      <div class="field"><label>项目说明</label><textarea id="pjDesc" placeholder="请输入项目说明"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="pjCancel">取消</button>
        <button class="btn btn-primary" id="pjSave">保存</button>
      </div>
    </div>
  </div>

  <script>
    // ===== 五大菜单面板内容 =====
    var MODULES = {
      0: { t: "基础信息", s: "所选项目的基础信息", body: [] },
      1: { t: "主题风格", s: "AI 生成主题交互定义（基于模板）", body: [], dynamic: "theme" },
      2: { t: "项目约束", s: "开发规范与红线约束（模板：devStandard）", body: [], dynamic: "constraints" },
      3: { t: "业务流程", s: "AI 梳理业务流程，生成可交互流程图", body: [], dynamic: "process" },
      4: { t: "部署发布", s: "构建、打包与发布", body: [
            "构建：cargo build --manifest-path src-tauri/Cargo.toml",
            "发布：cargo build --release（无黑窗），产物 target/release/tdev.exe",
            "打包安装器：cargo tauri build（NSIS/MSI）。"
          ]},
      5: { t: "项目空间", s: "设定 TDev 工具的工作路径", body: [], dynamic: "workspace" },
      6: { t: "模型配置", s: "大模型接入参数配置（URL / API Key / 模型名）", body: [], dynamic: "models" },
      7: { t: "Agent配置", s: "OpenClaw / Hermes 等 Agent 接入参数", body: [], dynamic: "agents" },
      8: { t: "Agent连接测试", s: "在线与 Agent 沟通聊天（对接 Hermes Dashboard）", body: [], dynamic: "chat" }
    };

    var content = document.getElementById("content");
    var items = document.querySelectorAll(".mi");
    var current = 0;
    var dbState = { ready:false, msg:"初始化中…", meta:null };

    function dbBox() {
      return '<div class="panel" style="margin-top:16px"><h4>本地数据库（SQLite）</h4>' +
        '<p>' + dbState.msg + '</p>' +
        (dbState.meta ? '<p style="font-family:Consolas,monospace;font-size:12px;color:var(--ink700)">app_meta = ' + JSON.stringify(dbState.meta) + '</p>' : '') +
        '</div>';
    }

    // ===== 基础信息页：渲染所选项目信息 + 删除项目 =====
    var currentProject = null; // 当前选中项目对象

    function escHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function infoRow(label, value, mono) {
      return '<div class="info-row"><span class="info-label">' + escHtml(label) + '</span>' +
        '<span class="info-value' + (mono ? ' mono' : '') + '">' + escHtml(value == null ? "-" : value) + '</span></div>';
    }

    function renderInfoPanel() {
      var panel = '<div class="panel info-panel">' +
        '<h4>项目基础信息</h4>' +
        '<div class="info-grid">' +
        infoRow("项目名称", currentProject ? currentProject.prjName : "-") +
        infoRow("项目类型", currentProject ? currentProject.prjType : "-") +
        infoRow("项目说明", currentProject ? currentProject.prjDescription : "-") +
        infoRow("项目标识 (prjGUID)", currentProject ? currentProject.prjGUID : "-", true) +
        infoRow("创建时间", currentProject ? currentProject.created_at : "-") +
        '</div>' +
        (currentProject ? '<div class="info-actions"><button class="btn btn-danger" id="delProjBtn">删除项目</button></div>' : '') +
        '</div>';
      content.innerHTML = '<div class="page-title">基础信息</div>' +
        '<div class="page-sub">所选项目的基础信息</div>' + panel;
      var delBtn = document.getElementById("delProjBtn");
      if (delBtn) delBtn.addEventListener("click", deleteCurrentProject);
    }

    function deleteCurrentProject() {
      if (!currentProject) return;
      if (!window.confirm("确定删除项目「" + currentProject.prjName + "」？此操作不可撤销。")) return;
      window.__TAURI__.core.invoke("project_delete", { prjGuid: currentProject.prjGUID })
        .then(function(ok) {
          if (ok) {
            document.getElementById("statusText").textContent = "已删除项目：" + currentProject.prjName;
            currentProject = null;
            document.getElementById("projSel").value = "";
            loadProjects();
            renderInfoPanel();
          } else {
            alert("删除失败：未找到该项目");
          }
        })
        .catch(function(e) { alert("删除失败：" + e); });
    }

    // 项目下拉框选中联动：记录 currentProject 并在基础信息页刷新
    function bindProjSel() {
      var sel = document.getElementById("projSel");
      if (!sel) return;
      sel.addEventListener("change", function() {
        var guid = sel.value;
        if (!guid) {
          currentProject = null;
          if (current === 0) renderInfoPanel();
          if (current === 1) { thUpdateStatus(); thRestore(); }  // 主题页：刷新状态 + 加载该项目主题
          if (current === 2) renderConstraints();  // 约束页：加载该项目 devStandard
          if (current === 3) renderProcess();  // 流程页：加载该项目业务流程
          if (current === 8) renderChat();  // 聊天页：切到默认会话（无项目）
          return;
        }
        window.__TAURI__.core.invoke("project_list").then(function(list) {
          var found = null;
          (list || []).forEach(function(p){ if (p.prjGUID === guid) found = p; });
          currentProject = found;
          if (current === 0) renderInfoPanel();
          if (current === 1) { thUpdateStatus(); thRestore(); }  // 主题页：刷新状态 + 加载该项目主题
          if (current === 2) renderConstraints();  // 约束页：加载该项目 devStandard
          if (current === 3) renderProcess();  // 流程页：加载该项目业务流程
          if (current === 8) renderChat();  // 聊天页：切换会话 + 加载该项目历史
        });
      });
    }


    // ================= 工具设置：动态页面渲染 =================
    var cfgCache = { workspace: null, models: [], agents: [] };

    function escHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 通用: 读取配置（category: workspace/models/agents）
    function cfgLoad(category) {
      if (!window.__TAURI__ || !window.__TAURI__.core) return Promise.resolve(null);
      return window.__TAURI__.core.invoke("cfg_load", { category: category }).then(function(v){
        try { return v ? JSON.parse(v) : null; } catch(e) { return null; }
      }).catch(function(){ return null; });
    }
    // 通用: 保存配置
    function cfgSave(category, payload) {
      if (!window.__TAURI__ || !window.__TAURI__.core) return Promise.reject("Tauri 不可用");
      return window.__TAURI__.core.invoke("cfg_save", { category: category, payload: JSON.stringify(payload) });
    }

    // ---------- 项目空间 ----------
    function renderWorkspace() {
      cfgLoad("workspace").then(function(cfg){
        var path = cfg && cfg.path ? cfg.path : "";
        content.innerHTML =
          '<div class="page-title">项目空间</div>' +
          '<div class="page-sub">设定 TDev 工具的主要工作路径</div>' +
          '<div class="panel">' +
            '<h4>工作路径</h4>' +
            '<p style="margin-bottom:12px;color:var(--ink700)">选择一个系统硬盘路径作为 TDev 的主要工作目录，项目文件、配置与产出将存放于此。</p>' +
            '<div class="ws-row">' +
              '<input id="wsPath" class="ws-input" type="text" value="' + escHtml(path) + '" placeholder="例如 D:\Work\TDev" />' +
              '<button class="btn btn-secondary" id="wsBrowse" style="flex:none">浏览…</button>' +
              '<button class="btn btn-primary" id="wsSave" style="flex:none">保存</button>' +
            '</div>' +
            '<p id="wsStatus" style="margin-top:10px;font-size:13px;color:var(--ink500)">' + (path ? "当前：" + escHtml(path) : "尚未设置工作路径") + '</p>' +
          '</div>';
        document.getElementById("wsSave").addEventListener("click", function(){
          var v = document.getElementById("wsPath").value.trim();
          if (!v) { document.getElementById("wsStatus").textContent = "请输入路径"; return; }
          cfgSave("workspace", { path: v }).then(function(){
            document.getElementById("wsStatus").textContent = "已保存：" + v;
            document.getElementById("statusText").textContent = "工作路径已保存";
          }).catch(function(e){ document.getElementById("wsStatus").textContent = "保存失败：" + e; });
        });
        document.getElementById("wsBrowse").addEventListener("click", function(){
          if (window.__TAURI__ && window.__TAURI__.dialog) {
            window.__TAURI__.dialog.open({ directory: true, multiple: false }).then(function(sel){
              if (sel) document.getElementById("wsPath").value = sel;
            }).catch(function(){});
          } else {
            document.getElementById("wsStatus").textContent = "文件对话框不可用（非 Tauri 环境）";
          }
        });
      });
    }

    // ---------- 模型配置 ----------
    function renderModels() {
      cfgLoad("models").then(function(cfg){
        var list = (cfg && cfg.list) ? cfg.list : [];
        content.innerHTML =
          '<div class="page-title">模型配置</div>' +
          '<div class="page-sub">配置大模型接入参数（支持 OpenAI / DeepSeek / 通义 / 方舟 / Anthropic / Gemini 等）</div>' +
          '<div class="panel">' +
            '<h4>新增模型</h4>' +
            '<div class="cfg-grid">' +
              '<div class="field"><label>配置名称</label><input id="mName" placeholder="例如 DeepSeek 主模型" /></div>' +
              '<div class="field"><label>提供商</label><select id="mProvider">' +
                '<option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option>' +
                '<option value="ark">火山方舟 (Volcengine Ark)</option><option value="dashscope">阿里通义 (DashScope)</option>' +
                '<option value="anthropic">Anthropic</option><option value="gemini">Google Gemini</option>' +
                '<option value="ollama">Ollama (本地)</option><option value="custom">自定义 (OpenAI 兼容)</option>' +
              '</select></div>' +

    // ANSI 转义剥离
    function stripAnsi(s) {
      s = s.replace(/\x1b\][^]*/g, "");
      s = s.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "");
      s = s.replace(/\x1b\[[0-9;?']*[A-Za-z'{}]/g, "");
      s = s.replace(/\x1b\[[<>][0-9;?]*[A-Za-z]/g, "");
      s = s.replace(/\x1b[()=><][0-9A-Z?]*/g, "");
      s = s.replace(/\x1b\[[0-9;?<>]*/g, "");
      // 过滤 TUI 装饰边框线
      s = s.replace(/[─-╿]+/g, " ").replace(/[─-╿]/g, "");
      return s;
    }

    function escHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

function doConnect(baseUrl, token) {
      if (!baseUrl) { chatSetStatus("无地址", "off"); return; }
      // 从 baseUrl 解析 ws 地址
      // session_id = 当前项目 prjGUID（无则 default）；fresh=1 强制新会话避免串线
      var wsUrl = baseUrl.replace(/^http/, "ws").replace(/\/$/, "") +
        "/api/pty?token=" + encodeURIComponent(token || "") +
        "&fresh=1";
      try {
        chatWs = new WebSocket(wsUrl);
        chatSetStatus("连接中…", "pending");
        chatWs.onopen = function() {
          chatConnected = true;
          chatSetStatus("在线", "on");
          chatAddSystem("已连接 Agent（" + baseUrl + "）");
          // 发送初始命令触发欢迎输出
          chatWs.send("\r");
        };
        chatWs.onmessage = function(ev) {
          var text = "";
          if (ev.data instanceof Blob) {
            var reader = new FileReader();
            reader.onload = function(){ handleChatChunk(String(reader.result)); };
            reader.readAsText(ev.data);
            return;
          } else {
            text = String(ev.data);
          }
          handleChatChunk(text);
        };
        chatWs.onclose = function() {
          chatConnected = false;
          chatSetStatus("已断开", "off");
          chatAddSystem("连接已断开");
        };
        chatWs.onerror = function() {
          chatConnected = false;
          chatSetStatus("连接失败", "off");
          chatAddSystem("连接失败，请确认 Dashboard 已启动（dashboard.bat）");
        };
      } catch(e) {
        chatSetStatus("无法连接", "off");
        chatAddSystem("WebSocket 创建失败：" + e);
      }
    }

    var chatShownMsgs = [];  // 去重
    var chatThinking = false;

    function handleChatChunk(chunk) {
      chatBuf += chunk;
      var lines2 = chatBuf.split(String.fromCharCode(10));
      chatBuf = lines2.pop();
      lines2.forEach(function(ln){
        var clean = stripAnsi(ln).replace(/\s+/g, " ").trim();
        if (!clean) return;
        // 过滤 TUI 装饰行
        if (isTuiDeco(clean)) return;
        // 去重
        if (chatShownMsgs.indexOf(clean) >= 0) return;
        chatShownMsgs.push(clean);
        // 用户输入回显（提示符后）判为用户消息，否则 Agent 回复
        var isUser = ln.indexOf("❯") >= 0;
        chatAddMsg(clean, isUser);
      });
      // 有内容时清除思考中状态
      var list = document.getElementById("chatMsgList");
      if (list && list.querySelectorAll(".chat-row").length > 0) {
        var think = document.getElementById("chatThinking");
        if (think) think.remove();
      }
    }

    function isTuiDeco(t) {
      var deco = ["HermesAgent","NousResearch","session","Session:","Available","skills","help","starting agent","ready","deepseek","E:\\","❯","ask me anything","summoning","resuming"];
      for (var i = 0; i < deco.length; i++) {
        if (t.indexOf(deco[i]) >= 0) return true;
      }
      return false;
    }
    function chatSend() {
      var input = document.getElementById("chatInput");
      if (!input) return;
      var text = input.value.trim();
      if (!text) return;
      if (!window.__TAURI__ || !window.__TAURI__.core) { chatAddSystem("Tauri 不可用"); return; }
      chatAddMsg(text, true);
      input.value = "";
      chatSetPending(true);
      chatShowThinking();
      var sid = (currentProject && currentProject.prjGUID) ? currentProject.prjGUID : "tdev-chat";
      window.__TAURI__.core.invoke("agent_ask", { question: text, sessionId: sid })
        .then(function(reply) {
          chatSetPending(false);
          var think2 = document.getElementById("chatThinking");
          if (think2) think2.remove();
          if (reply && reply.trim()) chatAddMsg(reply.trim(), false);
          else chatAddSystem("Agent 无回复");
        })
        .catch(function(e) {
          chatSetPending(false);
          var think3 = document.getElementById("chatThinking");
          if (think3) think3.remove();
          chatAddSystem("调用失败：" + e);
        });
    }

    // 提取 Markdown 表格（## 标题后的第一个 | 表格）
    function extractTable(md, sectionHint) {
      var rows = [];
      var lines = md.split(String.fromCharCode(10));
      var inTable = false;
      var started = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf("|") === 0) {
          var cells = line.split("|").slice(1, -1).map(function(c){ return c.trim(); });
          if (!started) { started = true; continue; }  // 跳过表头
          if (/^[\-: ]+$/.test(cells.join(""))) continue;  // 跳过分隔行
          if (cells.length >= 2) rows.push(cells);
          inTable = true;
        } else if (inTable) {
          break;
        }
      }
      return rows;
    }

    // 提取无序列表（## 标题后的 - 项）
    function extractList(md, sectionHint) {
      var items = [];
      var lines = md.split(String.fromCharCode(10));
      var capture = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf("##") === 0) {
          capture = line.indexOf(sectionHint) >= 0;
          continue;
        }
        if (capture && line.indexOf("- ") === 0) {
          items.push(line.slice(2).trim());
        } else if (capture && line.indexOf("1.") === 0) {
          items.push(line.slice(3).trim());
        } else if (capture && line.trim() === "") {
          continue;
        } else if (capture && line.indexOf("-") !== 0 && line.indexOf("1.") !== 0 && line.trim() !== "") {
          break;  // 遇到非列表内容结束
        }
      }
      return items;
    }

    function procStartWatch() {
      // 监测 doc 目录 JSON 文件变化：每 2 秒检查一次，有新文件/变更自动加载
      if (procWatchTimer) clearInterval(procWatchTimer);
      if (!currentProject || !window.__TAURI__ || !window.__TAURI__.core) return;
      window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function(v){
        var ws = "";

          window.__TAURI__.core.invoke("process_list", {

            workspace: ws
          }).then(function(files){
            if (!files || !files.length) { procLastFiles = []; return; }
            var sig = files.join(",");
            if (procLastFiles !== null && sig !== procLastFiles) {
              // 文件列表变化 → 自动加载最新 JSON
              procLastFiles = sig;
              procAddSys("检测到流程文档更新，自动加载：" + (files[0] || "").split("|")[0]);
              procLoadLatest(ws, files);
            }
            if (procLastFiles === null) procLastFiles = sig;

          procExpanded = {};
          for (var i = 0; i < json.steps.length; i++) {
            var kids = json.steps[i].children || [];
            if (kids.length) {
              procExpanded[String(i)] = true;

            }

            })
            .catch(function(e) {
              procAddSys("梳理失败：" + e);
            });
        });
      });
    }

    function procSaveFlowJson(reply) {
      // 解析 JSON 并保存到项目 doc 目录
      var json = null;
      var m = reply.match(/\{[\s\S]*\}/);
      if (m) {
        try { json = JSON.parse(m[0]); } catch(e) {}
      }
      if (!json || !json.steps) {
        procAddSys("无法解析为结构化流程，已保存原始描述");
        procSaveRaw(reply);
        return;
      }
      procFlow = json;
      procExpanded = {};
      // 默认展开第一个有子流程的节点（递归第一层）
      for (var i = 0; i < json.steps.length; i++) {
        var kids = json.steps[i].children || [];
        if (kids.length) {
          procExpanded[String(i)] = true;
          break;
        }
      }
      procRenderFlow();
      procSave();
    }

    function procParseFlow(reply) {
      var json = null;
      var m = reply.match(/\{[\s\S]*\}/);
      if (m) {
        try { json = JSON.parse(m[0]); } catch(e) {}
      }
      if (!json || !json.steps) {
        procAddSys("无法解析为结构化流程，已保存原始描述到 doc 目录");
        procSaveRaw(reply);
        return;
      }
      procFlow = json;
      procExpanded = {};
      for (var i = 0; i < json.steps.length; i++) {
        if (json.steps[i].children && json.steps[i].children.length) {
          procExpanded[i] = true;
          break;
        }
      }
      procRenderFlow();
      procSave();
    }

    // ===== 节点增删操作 =====
    function procNewNode(name) {
      return { name: name || "新节点", children: [] };
    }

    function procAddBefore(path) {
      if (!procFlow) return;
      var loc = procLocate(procFlow, path);
      if (!loc) return;
      var node = procNewNode("新前置节点");
      loc.parent.splice(loc.index, 0, node);
      // 同级插入后，后续兄弟展开状态 +1，源节点展开迁移到新位置
      var isRoot = loc.parent === procFlow.steps;
      var prefix = isRoot ? "" : procPathOfParent(procFlow, loc);
      procShiftExpanded(prefix, loc.index, 1);
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已增加前置节点（" + path + " 前）");
    }

    function procAddAfter(path) {
      if (!procFlow) return;
      var loc = procLocate(procFlow, path);
      if (!loc) return;
      var node = procNewNode("新后置节点");
      loc.parent.splice(loc.index + 1, 0, node);
      var isRoot = loc.parent === procFlow.steps;
      var prefix = isRoot ? "" : procPathOfParent(procFlow, loc);
      procShiftExpanded(prefix, loc.index + 1, 1);
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已增加后置节点（" + path + " 后）");
    }

    function procAddChild(path) {
      if (!procFlow) return;
      var loc = procLocate(procFlow, path);
      if (!loc) return;
      var pnode = loc.parent[loc.index];
      if (!pnode.children) pnode.children = [];
      var node = procNewNode("新子节点");
      pnode.children.push(node);
      // 展开父节点让新子节点可见
      procExpanded[path] = true;
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已增加子节点（" + path + " 末尾）");
    }

    function procDeleteNode(path) {
      if (!procFlow) return;
      var loc = procLocate(procFlow, path);
      if (!loc) return;
      var node = loc.parent[loc.index];
      if (!window.confirm("确定删除节点「" + (node.name || path) + "」及其所有子节点？")) return;
      loc.parent.splice(loc.index, 1);
      // 删除后续兄弟展开状态 -1
      var isRoot = loc.parent === procFlow.steps;
      var prefix = isRoot ? "" : procPathOfParent(procFlow, loc);
      procShiftExpanded(prefix, loc.index, -1);
      // 删除该节点及其子树的展开状态
      Object.keys(procExpanded).forEach(function(k){
        if (k === path || k.indexOf(path + ".") === 0) delete procExpanded[k];
      });
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已删除节点：" + (node.name || path));
    }

    // 找父数组对应的路径前缀（用于兄弟迁移）；根 steps 返回 ""
    function procPathOfParent(root, loc) {
      if (loc.parent === root.steps) return "";
      var found = null;
      (function walk(nodes, prefix){
        nodes.forEach(function(n, i){
          if (n.children === loc.parent) { found = prefix + "." + i; return; }
          if (n.children) walk(n.children, prefix + "." + i);
        });
      })(root.steps, "");
      return found || "";
    }

    // 把 prefix 下 index >= fromIndex 的展开状态路径整体平移 delta
    function procShiftExpanded(prefix, fromIndex, delta) {
      var updates = [];
      Object.keys(procExpanded).forEach(function(k){
        var rest = prefix ? (k.indexOf(prefix + ".") === 0 ? k.slice(prefix.length + 1) : null) : k;
        if (rest === null) return;
        var parts = rest.split(".");
        var idx = parseInt(parts[0]);
        if (!isNaN(idx) && idx >= fromIndex) {
          parts[0] = String(idx + delta);
          updates.push([k, prefix ? prefix + "." + parts.join(".") : parts.join(".")]);
        }
      });
      updates.forEach(function(u){
        procExpanded[u[1]] = procExpanded[u[0]];
        delete procExpanded[u[0]];
      });
    }

    // 迁移展开状态：srcPath 及其子树 -> newPath 及其子树
    function procMigrateExpanded(srcPath, newPath) {
      var keys = Object.keys(procExpanded);
      keys.forEach(function(k){
        if (k === srcPath || k.indexOf(srcPath + ".") === 0) {
          var suffix = k === srcPath ? "" : k.slice(srcPath.length);
          procExpanded[newPath + suffix] = procExpanded[k];
          delete procExpanded[k];
        }
      });
    }

    function procRenderFlow() {
      var body = document.getElementById("procCanvasBody");
      var name = document.getElementById("procFlowName");
      if (!body || !procFlow) return;
      name.textContent = procFlow.flow_name || "业务流程图";
      var html = '<div class="proc-flow">';
      procFlow.steps.forEach(function(step, i) {
        html += procRenderNode(step, String(i), true);
        if (i < procFlow.steps.length - 1) {
          html += '<div class="proc-drop-slot" data-before="' + (i + 1) + '"><div class="proc-main-arrow">↓</div></div>';
        }
      });
      html += '</div>';
      body.innerHTML = html;
      // 事件委托：点击节点切换展开/收起
      Array.prototype.forEach.call(body.querySelectorAll(".proc-main-node, .proc-sub-node"), function(el){
        el.addEventListener("click", function(e){
          if (e.target.closest(".proc-node-flag")) return; // 点属性图标不展开
          var p = el.getAttribute("data-path");
          if (p) procToggle(p);
        });
      });
      // 属性图标点击：弹属性编辑窗口
      Array.prototype.forEach.call(body.querySelectorAll(".proc-node-flag"), function(el){
        el.addEventListener("click", function(e){
          e.stopPropagation();
          var p = el.getAttribute("data-prop");
          if (p) procEditProps(p);
        });
      });
      // 鼠标事件自定义拖拽（WebView2 中 HTML5 DnD 不可靠）
      var dragState = null;
      var procDragJustMoved = false;
      function clearDragHighlights(){
        var b2 = document.getElementById("procCanvasBody");
        if (!b2) return;
        b2.querySelectorAll(".drag-target").forEach(function(x){ x.classList.remove("drag-target"); });
        b2.querySelectorAll(".proc-drop-slot.drag-over").forEach(function(x){ x.classList.remove("drag-over"); });
      }
      Array.prototype.forEach.call(body.querySelectorAll(".proc-main-node, .proc-sub-node"), function(el){
        el.addEventListener("mousedown", function(e){
          if (e.button !== 0) return;
          if (e.target.closest(".proc-node-flag")) return; // 属性图标不拖拽
          var path = el.getAttribute("data-path");
          dragState = { srcPath: path, startX: e.clientX, startY: e.clientY, moved: false };
          el.style.opacity = "0.6";
          // 创建拖拽虚影（接近透明的节点副本，跟随鼠标）
          var ghost = el.cloneNode(true);
          ghost.id = "procDragGhost";
          ghost.style.position = "fixed";
          ghost.style.left = (e.clientX - 40) + "px";
          ghost.style.top = (e.clientY - 20) + "px";
          ghost.style.opacity = "0.55";
          ghost.style.pointerEvents = "none";
          ghost.style.zIndex = "999";
          ghost.style.boxShadow = "0 8px 24px rgba(16,42,67,.3)";
          // 虚影内按钮不显示
          var gops = ghost.querySelector(".proc-node-ops");
          if (gops) gops.style.opacity = "0";
          document.body.appendChild(ghost);
          dragState.ghost = ghost;
          e.preventDefault();
        });
      });
      document.addEventListener("mousemove", function(e){
        if (!dragState) return;
        if (!dragState.moved && Math.abs(e.clientX - dragState.startX) + Math.abs(e.clientY - dragState.startY) > 6) {
          dragState.moved = true;
        }
        if (!dragState.moved) return;
        // 虚影跟随鼠标
        if (dragState.ghost) {
          dragState.ghost.style.left = (e.clientX - 40) + "px";
          dragState.ghost.style.top = (e.clientY - 20) + "px";
        }
        var el = document.elementFromPoint(e.clientX, e.clientY);
        clearDragHighlights();
        if (!el) return;
        var nodeEl = el.closest(".proc-main-node, .proc-sub-node");
        var slotEl = el.closest(".proc-drop-slot");
        if (nodeEl) nodeEl.classList.add("drag-target");
        else if (slotEl) slotEl.classList.add("drag-over");
      });
      document.addEventListener("mouseup", function(e){
        if (!dragState) return;
        var src = dragState.srcPath;
        var moved = dragState.moved;
        var el = document.elementFromPoint(e.clientX, e.clientY);
        // 移除虚影
        if (dragState.ghost && dragState.ghost.parentNode) {
          dragState.ghost.parentNode.removeChild(dragState.ghost);
        }
        dragState = null;
        clearDragHighlights();
        var srcEl = document.querySelector('[data-path="' + src + '"]');
        if (srcEl) srcEl.style.opacity = "";
        if (!moved || !el) return;
        var nodeEl = el.closest(".proc-main-node, .proc-sub-node");
        var slotEl = el.closest(".proc-drop-slot");
        if (nodeEl) {
          var dst = nodeEl.getAttribute("data-path");
          if (src !== dst) {
            procDragJustMoved = true;
            procMoveNode(src, dst, "child");
          }
        } else if (slotEl) {
          var before = slotEl.getAttribute("data-before");
          procDragJustMoved = true;
          procMoveNode(src, before, "before");
        }
      });
      // 拖拽后不触发展开
      Array.prototype.forEach.call(body.querySelectorAll(".proc-main-node, .proc-sub-node"), function(el){
        el.addEventListener("click", function(e){
          if (procDragJustMoved) { procDragJustMoved = false; return; }
        });
      });
      // 节点操作按钮（前置/后置/子节点/删除）
      Array.prototype.forEach.call(body.querySelectorAll(".proc-op"), function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          var op = btn.getAttribute("data-op");
          var target = btn.getAttribute("data-opath");
          if (op === "before") procAddBefore(target);
          else if (op === "after") procAddAfter(target);
          else if (op === "child") procAddChild(target);
          else if (op === "delete") procDeleteNode(target);
        });
      });
    }

    // 递归渲染节点（支持无限层级）：path 如 "0" / "0.1" / "0.1.2"
    function procRenderNode(node, path, isMain) {
      var expanded = !!procExpanded[path];
      var kids = node.children || [];
      var hasKids = kids.length > 0;
      var numLabel = isMain ? (parseInt(path) + 1) : path.split(".").map(function(n){ return parseInt(n) + 1; }).join(".");
      var hasProps = node.props && (node.props.formName || node.props.indexField || node.props.input || node.props.logic || node.props.output);
      var html = '<div class="proc-row">';
      html += '<div class="proc-node-col' + (isMain ? ' main' : '') + '">';
      html += '<div class="' + (isMain ? 'proc-main-node' : 'proc-sub-node') + (expanded ? ' expanded' : '') + (hasProps ? ' has-props' : '') + '" draggable="true" data-path=' + String.fromCharCode(34) + path + String.fromCharCode(34) + '>' +
        '<div class="proc-node-num">' + numLabel + '</div>' +
        '<div class="proc-node-name">' + escHtml(node.name) + '</div>' +
        (hasKids ? '<div class="proc-node-more">' + (expanded ? "-" : "+") + '</div>' : '') +
        (hasProps ? '<div class="proc-node-flag" title="已配置属性" data-prop="' + path + '">●</div>' : '<div class="proc-node-flag" data-prop="' + path + '">○</div>') +
        '<div class="proc-node-ops">' +
          '<button class="proc-op" data-op="before" data-opath="' + path + '" title="增加前置节点（同级）">前+</button>' +
          '<button class="proc-op" data-op="after" data-opath="' + path + '" title="增加后置节点（同级）">后+</button>' +
          '<button class="proc-op" data-op="child" data-opath="' + path + '" title="增加子节点（下一级，追加末尾）">子+</button>' +
          '<button class="proc-op proc-op-del" data-op="delete" data-opath="' + path + '" title="删除该节点及所有子节点">✕</button>' +
        '</div>' +
        '</div>';
      html += '</div>';
      if (expanded && hasKids) {
        html += '<div class="proc-branch">';
        html += '<div class="proc-branch-link"></div>';
        html += '<div class="proc-branch-col">';
        kids.forEach(function(kid, j) {
          // 每个子节点前放插入槽位（拖到此 = 插入到该子节点之前）
          html += '<div class="proc-drop-slot proc-child-slot" data-before="' + path + "." + j + '"><div class="proc-child-arrow">↕</div></div>';
          // 兼容旧格式：字符串子节点转为对象
          if (typeof kid === "string") kid = { name: kid, children: [] };
          html += procRenderNode(kid, path + "." + j, false);
        });
        html += '</div>';
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function procToggle(path) {
      procExpanded[path] = !procExpanded[path];
      procRenderFlow();
    }

    // 展开全部：遍历树，所有有 children 的节点都展开
    function procExpandAll() {
      if (!procFlow) return;
      procExpanded = {};
      (function walk(nodes, prefix){
        nodes.forEach(function(n, i){
          var p = prefix ? (prefix + "." + i) : String(i);
          if (n.children && n.children.length) {
            procExpanded[p] = true;
            walk(n.children, p);
          }
        });
      })(procFlow.steps, "");
      procRenderFlow();
    }

    // 折叠全部
    function procCollapseAll() {
      procExpanded = {};
      procRenderFlow();
    }

    // ===== 载入备份弹窗 =====
    function procLoadModal() {
      if (!currentProject) { procAddSys("请先选择项目"); return; }
      var m = document.createElement("div");
      m.className = "proc-modal";
      m.innerHTML =
        '<div class="pm-box">' +
        '<div class="pm-head"><span>载入备份</span>' +
        '<button class="pm-close" onclick="this.parentNode.parentNode.parentNode.remove()">×</button></div>' +
        '<div class="pm-body">' +
          '<div class="pm-field"><label>备份类型（二选一）</label>' +
            '<div class="pm-radio-row">' +
              '<label><input type="radio" name="bkType" value="auto" checked /> 自动备份（versions 目录）</label>' +
              '<label><input type="radio" name="bkType" value="snap" /> 专题备份（数据库）</label>' +
            '</div></div>' +
          '<div class="pm-field"><label>选择备份</label><select id="bkSel"><option value="">加载中...</option></select></div>' +
          '<div class="pm-field"><label>备份信息</label><div class="pm-info" id="bkInfo">请选择备份</div></div>' +
        '</div>' +
        '<div class="pm-foot"><span class="pm-hint">恢复将覆盖当前编辑版本</span><button class="btn btn-primary" id="bkRestoreBtn">恢复备份</button></div>' +
        '</div>';
      document.body.appendChild(m);
      setTimeout(function(){
        document.addEventListener("mousedown", function(e){
          if (!document.body.contains(m)) return;
          if (!m.contains(e.target)) m.remove();
        });
      }, 50);

      var sel = document.getElementById("bkSel");
      var info = document.getElementById("bkInfo");
      var typeRadios = m.querySelectorAll("input[name=bkType]");
      var curType = "auto";
      var autoList = [];    // [{id/name, label, info}]
      var snapList = [];
      var snapIdMap = {};

      function loadAuto() {
        window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function(v){
          var ws = "";
          try { ws = JSON.parse(v || "{}").path || ""; } catch(e) {}
          if (!ws) { sel.innerHTML = '<option value="">未设工作路径</option>'; return; }
          window.__TAURI__.core.invoke("process_versions", {
            prjName: currentProject.prjName,

          }).then(function(vers){
            autoList = (vers || []);
            if (!autoList.length) { sel.innerHTML = '<option value="">无自动备份</option>'; return; }

              return '<option value="auto-' + i + '">' + procTsLabel(ts) + '</option>';
            }).join("");
            sel.innerHTML = opts;
            showAutoInfo(0);
          }).catch(function(e){ sel.innerHTML = '<option value="">加载失败</option>'; });
        });
      }
      function loadSnap() {
        window.__TAURI__.core.invoke("flow_backup_list", {
          prjGuid: currentProject.prjGUID
        }).then(function(items){
          snapList = (items || []);
          if (!snapList.length) { sel.innerHTML = '<option value="">无专题备份</option>'; info.textContent = "暂无专题备份"; return; }
          var opts = snapList.map(function(item, i){
