        "去「" + escHtml(miss ? miss.name : "前序") + "」",
        function () { if (miss) render(miss.m); },
        "先不去了");
    }

    // ---- 生成计划（用户点击才调用模型）----
    function aiGenPlan(retry, gated) {
      if (gated !== true) {
        aiGateCheck(function (miss) {
          if (miss) { aiGateBlock(miss); return; }
          aiGenPlan(retry, true);
        });
        return;
      }
      if (!currentProject) { aiAddMsg("请先在「基础信息」选择项目", false); return; }
      // 正在执行时不允许重新生成：新计划会立刻被正在跑的 Agent 打乱，而且那一轮还在烧 token
      if (aiPlan && aiPlan.status === "running") {
        aiAddMsg("现在正在执行第 " + (aiPlan.cur || "?") + " 步，等它结束或点「暂停全部」后再重新生成。", false);
        return;
      }
      if (!window.__TAURI__ || !window.__TAURI__.core) { aiAddMsg("Tauri 不可用", false); return; }
      if (!AGENT_CONST && !retry) {
        // 地基 6 步的文案来自项目技术栈（AGENTS.md 第 2 章），先读出来再生成
        agentConstEnsure().then(function () { aiGenPlan(true); }).catch(function () { aiGenPlan(true); });
        return;
      }
      aiAddMsg("帮我生成开发计划", true);
      aiSetCanvas('<div class="ui-plan-empty">正在读业务流程，稍等…</div>');
      aiFlowFull(function (f) {
        var L = [];
        L.push("请为当前项目生成一份开发计划。");
        L.push("");
        L.push("【项目】" + currentProject.prjName);
        L.push("");
        if (f && f.text) {
          L.push("【完整业务流程】共 " + f.nodes + " 个节点、" + f.mains + " 个主阶段" + (f.cut ? "（流程过长已截断）" : ""));
          L.push(f.text);
        } else {
          L.push("【业务流程】（还没有流程文档，请按项目名称合理推断一个最小可用的业务闭环）");
        }
        L.push("");
        L.push("【只要业务步骤 —— 前面的地基和骨架已经定好，不用你生成】");
        var _B = aiBuildBaseSteps();   // 必须先声明再使用：放到 push 后面会因 _B 未定义抛 TypeError，
                                       // 回调中断，界面永远停在「正在读业务流程」，请求根本发不出去
        L.push("这份计划的第 1 到 " + _B.length + " 步是固定的：");
        for (var _bi = 0; _bi < _B.length; _bi++) {
          L.push("  " + (_bi + 1) + " " + _B[_bi].name + " —— " + _B[_bi].desc);
        }
        L.push("");
        L.push("你只负责从第 " + (_B.length + 1) + " 步开始的业务步骤：按上面【完整业务流程】的主阶段排。");
        L.push("");
        L.push("【怎么拆步骤 —— 这段最重要】");
        L.push("按每个主阶段下面的【二级节点】拆，一个二级节点 = 一步。不要按主阶段拆，主阶段只是分组名。");
        L.push("例：主阶段「客户询盘」下面有「需求承接 / 制作产品目录册 / 交付目录册」3 个二级节点，这就是 3 步，不是 1 步。");
        L.push("为什么这么拆：一步要做的事必须能在一两个小时内做完、做完能在界面上点开看到东西。");
        L.push("按主阶段一步，等于把 3 个功能塞进一步，做半天看不到结果，用户会以为程序卡死了。");
        L.push("");
        L.push("【硬性要求】");
        L.push("1. 业务步骤 6 到 20 步：绝大多数情况一个二级节点一步");
        L.push("2. 同一主阶段下内容几乎一样的二级节点可以合并，但一步最多合并 2 个");
        L.push("3. 某个主阶段下面没写二级节点，就按这个主阶段的核心功能给 1 到 2 步，不要漏掉这个主阶段");
        L.push("4. phase 字段填这一步所属的主阶段原名，一个字都别改，用来分组");
        L.push("5. name 不超过 12 个字，用业务人员的话说清这一步做什么");
        L.push("6. desc 说清做完之后界面上能点什么、能看到什么，让人一听就知道能用了什么");
        L.push("7. 不要写装数据库、装服务、搭骨架、登录、权限这类内容，前面已经做过了");
        L.push("8. 不准出现这些词：编译、依赖、构建、接口、仓库、端口、部署、安装包");
        L.push("9. 每一步必须带 node 字段：填这一步对应的二级节点，写成「主阶段名/二级节点名」，从上面的业务流程里原样抄，一个字都别改，也不许自己编。");
        L.push("10. 严格只输出下面这个格式，前后不要加任何解释文字：");
        L.push("[[PLAN]]");
        L.push('[{"phase":"主阶段原名","name":"说清做什么","desc":"说清做完能看到什么","node":"主阶段名/二级节点名"}]');
        L.push("[[/PLAN]]");
        agentRun("aiCode", L.join(aiNL()), {
          fresh: true,  // 一次性会话：流程全文只进这一次上下文，用完即弃，不撑大日常开发会话
          onDone: function (full) { aiParsePlan(full); },
          onError: function (msg) { aiSetCanvas('<div class="ui-plan-empty">生成计划失败：' + escHtml(String(msg).slice(0, 200)) + '</div>'); }
        }).catch(function () {});
      });
    }

    // ---- 解析计划 ----
    // 重新生成计划时，把旧计划里已完成的步骤继承过来。
    // 病根：aiParsePlan 直接把 aiPlan 换成一个全新的、所有步骤都是 todo 的对象，
    // 而界面上还写着「已完成的进度不会清零」—— 承诺和实现不符，用户重新生成一次进度全没了。
    // 匹配方式：步骤名归一化后精确比对（地基 6 步是固定文案，必然命中；
    // 业务步骤名称没变就命中，变了就退回未开始，并在消息里说清楚）。
    function aiPlanNormName(s) {
      return String(s || "").replace(/[\s\u3000]/g, "").replace(/[，。、：:；;（）()【】\[\]·—\-]/g, "");
    }
    function aiPlanInheritDone(newSteps, oldSteps) {
      var res = { kept: 0, total: 0 };
      if (!newSteps || !newSteps.length || !oldSteps || !oldSteps.length) return res;
      var oldDone = [];
      for (var i = 0; i < oldSteps.length; i++) { if (oldSteps[i].state === "done") oldDone.push(oldSteps[i]); }
      res.total = oldDone.length;
      if (!oldDone.length) return res;

      // 第一轮：精确匹配（归一化后完全相等）。地基 6 步文案固定，必然命中。
      var leftover = [];
      for (var a = 0; a < newSteps.length; a++) {
        var nn = aiPlanNormName(newSteps[a].name);
        var hit = -1;
        if (nn) {
          for (var b = 0; b < oldDone.length; b++) {
            if (aiPlanNormName(oldDone[b].name) === nn) { hit = b; break; }
          }
        }
        if (hit >= 0) {
          newSteps[a].state = "done";
          newSteps[a].note = oldDone[hit].note || "已完成";
          res.kept++;
          oldDone.splice(hit, 1);
        } else {
          leftover.push(newSteps[a]);
        }
      }

      // 第二轮：包含匹配。模型重新生成时步骤名常微调（「建询盘单」→「建询盘单与状态流转」），
      // 精确匹配就漏了。约束三条防误配：短名至少 4 字、长度差 ≤ 6、取差最小的那个。
      for (var c = 0; c < leftover.length && oldDone.length; c++) {
        var nc = aiPlanNormName(leftover[c].name);
        if (nc.length < 4) continue;
        var best = -1, bestDiff = 99;
        for (var d = 0; d < oldDone.length; d++) {
          var od = aiPlanNormName(oldDone[d].name);
          if (od.length < 4) continue;
          if (nc.indexOf(od) < 0 && od.indexOf(nc) < 0) continue;
          var diff = Math.abs(nc.length - od.length);
          if (diff <= 6 && diff < bestDiff) { best = d; bestDiff = diff; }
        }
        if (best >= 0) {
          leftover[c].state = "done";
          leftover[c].note = oldDone[best].note || "已完成";
          res.kept++;
          oldDone.splice(best, 1);
        }
      }
      return res;
    }

    function aiParsePlan(full) {
      var t = String(full || "");
      var a = t.indexOf("[[PLAN]]");
      var b = t.indexOf("[[/PLAN]]");
      var body = "";
      if (a >= 0) {
        body = (b > a) ? t.slice(a + 8, b) : t.slice(a + 8);
      } else {
        var s1 = t.indexOf("[");
        var s2 = t.lastIndexOf("]");
        if (s1 >= 0 && s2 > s1) body = t.slice(s1, s2 + 1);
      }
      var arr = null;
      try { arr = JSON.parse(body.trim()); } catch (e) { arr = null; }
      if (!arr) {
        aiSetCanvas('<div class="ui-plan-empty">计划格式没能看懂，请再点一次「生成开发计划」</div>');
        return;
      }
      // 前 6 步固定（地基 + 骨架），模型只负责后面的业务步骤
      var steps = [];
      var BASE = aiBuildBaseSteps();
      for (var i = 0; i < BASE.length; i++) {
        steps.push({
          n: i + 1,
          name: BASE[i].name,
          desc: BASE[i].desc,
          phase: "准备",
          state: "todo",
          note: "",
          base: true
        });
      }
      var bizCount = 0;
      var bizRefs = [];   // A1：留引用，稍后把该步对应的流程细节异步挂上去
      // 业务步骤 = 流程里的二级节点，一个节点一步：一步一两个小时、做完界面上能看到东西。
      // 上限 20：TestProject 这种 7 主阶段 / 20 二级节点的流程刚好放得下，再多就要模型合并。
      for (var k = 0; k < arr.length && k < 20; k++) {
        var o = arr[k] || {};
        var _sp = {
          n: steps.length + 1,
          phase: String(o.phase || o.stage || "").trim() || "业务功能",
          name: String(o.name || o.title || ("第 " + (k + 1) + " 个业务功能")),
          desc: String(o.desc || o.description || ""),
          node: String(o.node || o.flowNode || "").trim(),
          detail: "",
          state: "todo",
          note: ""
        };
        steps.push(_sp);
        bizRefs.push(_sp);
        bizCount++;
      }
      // A1：按 node 从流程文件取出该步的业务细节，执行时随提示词下发，Agent 不用自己翻文件
      if (bizRefs.length) {
        aiFlowNodes(function (trees) {
          var filled = 0;
          for (var q = 0; q < bizRefs.length; q++) {
            var sp = bizRefs[q];
            if (!sp.node) continue;
            var d = aiStepDetail(trees, sp.node);
            if (d) { sp.detail = d; filled++; }
          }
          console.log("[A1] 业务细节挂载 " + filled + "/" + bizRefs.length + " 步");
          if (filled && aiPlan) { aiPlanSave(); aiRenderPlan(); }
        });
      }
      // 覆盖之前先把旧计划的完成状态继承过来（不继承的话重新生成 = 进度清零）
      var _oldSteps = (aiPlan && aiPlan.steps) ? aiPlan.steps : [];

      // 用户选了「保留已完成」：前 N 步直接沿用旧对象，名称/说明/进度一个字节都不改。
      // 为什么按序号而不是按名称：计划是顺序执行的，做完的必然是前 N 步；
      // 模型重排时步骤名常微调（「建询盘单」→「询盘单登记与状态流转」），按名称匹配会漏掉一半。
      var _keptByUser = 0;
      if (aiPlanKeepDone > 0) {
        // 逐位判断，不找连续前缀。
        // 卢Sir 的实际场景：1-6 已完成、7 没做、8/9/10 手工标了完成 ——
        // 如果按「连续前缀」保留，第 7 步一断，8/9/10 就被丢掉了。
        // 规则：该位置旧计划是 done 就用旧的（原样不动），否则用新生成的。
        var _out = [];
        var _maxN = Math.max(steps.length, _oldSteps.length);
        for (var _k = 0; _k < _maxN; _k++) {
          var _o = _oldSteps[_k];
          var _nw = steps[_k];
          if (_o && _o.state === "done") {
            _out.push({
              n: _out.length + 1, name: _o.name, desc: _o.desc || "",
              phase: _o.phase || (_nw && _nw.phase) || "",
              node: _o.node || "", detail: _o.detail || "",
              state: "done", note: _o.note || "已完成", base: !!_o.base
            });
            _keptByUser++;
          } else if (_nw) {
            _out.push(_nw);
          }
        }
        steps = _out;
        for (var _ri = 0; _ri < steps.length; _ri++) steps[_ri].n = _ri + 1;
      }
      aiPlanKeepDone = 0;   // 用完即清，下一次重新生成默认不保留

      var _inh = aiPlanInheritDone(steps, _oldSteps);
      aiPlan = {
        title: "项目开发计划",
        steps: steps,
        status: "ready",
        ts: Date.now(),
        flowSig: aiDetect.sig || "",
        prj: currentProject.prjGUID
      };
      aiPlanSave();
      aiRenderPlan();
      if (_keptByUser > 0) {
        aiAddMsg("重新生成好了。" + _keptByUser + " 步已完成的原样保留（不重做），其余 " +
                 (steps.length - _keptByUser) + " 步是新生成的。", false);
      } else if (_inh.total) {
        aiAddMsg("重新生成好了。原有 " + _inh.total + " 个已完成步骤，保留了 " + _inh.kept + " 个（按步骤名匹配）。" +
          (_inh.kept < _inh.total
            ? "有 " + (_inh.total - _inh.kept) + " 个步骤名称变了，已回到未开始，需要重做。"
            : "做过的不会重做。"), false);
      } else if (!bizCount) {
        aiAddMsg("业务部分没生成出来，先把地基和骨架这几步给你。可以再点一次「生成开发计划」。", false);
      } else {
        aiAddMsg("计划列好了：前 6 步是地基和骨架，后面 " + bizCount + " 步是业务功能。没问题就点「开始吧」。", false);
      }
    }

    // 当前项目在磁盘上的绝对路径（执行指令和真实请求必须用同一个，避免两处算法漂移）
    function aiProjectDir() {
      var ws = (aiDetect && aiDetect.ws) || "";
      var pj = (typeof currentProject !== "undefined" && currentProject && currentProject.prjName)
        ? String(currentProject.prjName) : "";
      if (!ws || !pj) return "";
      var root = ws;
      while (root.length > 1 && (root.charAt(root.length - 1) === "/" || root.charAt(root.length - 1) === "\\")) {
        root = root.slice(0, -1);
      }
      var sep = (root.indexOf("\\") >= 0) ? "\\" : "/";
      return root + sep + pj;
    }

    // 盘符路径转 WSL 路径：E:\a\b  ->  /mnt/e/a/b
    // 本机 terminal 工具跑在 WSL 里，直接把 E:\ 丢进去会「文件不存在」，
    // 这是 Agent 反复重试同一条命令、最后 180 秒超时的根源。
    // Git Bash / MSYS 的盘符写法：E:\x -> /e/x（WSL 是 /mnt/e/x，两者不通用）
    function toMsysPath(p) {
      var s = String(p || "").replace(/\\/g, "/");
      var m = s.match(/^([A-Za-z]):\/(.*)$/);
      if (m) return "/" + m[1].toLowerCase() + "/" + m[2];
      return s;
    }

    function toWslPath(p) {
      var s = String(p || "");
      var m = /^([A-Za-z]):[\\\/]/.exec(s);
      if (!m) return s;
      return "/mnt/" + m[1].toLowerCase() + "/" + s.slice(3).replace(/\\/g, "/");
    }

    // ---- 开始执行 ----
    // ---- 计划执行：一次 run 只做一步，进度由程序掌握 ----
    // 以前靠 Agent 自己输出 [[STEP_START:n]] 上报进度，模型跑长了就漏标、错标，
    // 结果聊天说第 9 步做完了、卡片还停在第 6 步。现在程序自己知道在第几步，
    // Agent 只负责「做好这一步」，状态再也不会对不上。
    function aiPlanStart(gated) {
      if (!aiPlan || !aiPlan.steps || !aiPlan.steps.length) return;
      if (gated !== true) {
        aiGateCheck(function (miss) {
          if (miss) { aiGateBlock(miss); return; }
          aiPlanStart(true);
        });
        return;
      }
      if (aiPlan.status === "running") return;   // 防重入：连点也只跑一份
      // 清掉上次中断残留的 doing：以前靠 Agent 上报，会出现第 6 步和第 8 步同时「正在处理」。
      // 现在同一时间只允许一步在做，由 aiPlanStepNext 自己设置。
      aiPlan.steps.forEach(function (s) { if (s.state === "doing") s.state = "todo"; });
      aiPlan.stepMode = 0;      // 一键跑完 = 连续模式
      aiPlan.target = 0;
      aiPlan.paused = 0;
      aiPlan.status = "running";
      aiPlanSave(); aiRenderPlan();
      aiToolClear();
      aiToolState("准备开始…", "on");
      aiWatchStart();
      aiAddMsg("开始吧", true);
      aiPlanStepNext();
    }

    // 单独执行某一步（按钮下沉到步骤上）：只跑这一步，跑完停住不往下走。
    // 已完成的步骤点「重做」也走这里 —— 先把状态退回未完成再跑。
    function aiPlanRunStep(n, gated) {
      if (!aiPlan || !aiPlan.steps || !aiPlan.steps.length) return;
      if (gated !== true) {
        aiGateCheck(function (miss) {
          if (miss) { aiGateBlock(miss); return; }
          aiPlanRunStep(n, true);
        });
        return;
      }
      if (aiPlan.status === "running") {
        aiAddMsg("现在有一步正在跑（第 " + (aiPlan.cur || "?") + " 步），等它结束，或先点那一步的「暂停」。", false);
        return;
      }
      var st = aiPlan.steps[n - 1];
      if (!st) return;
      if (AGENT_BUSY) { agentBusyCheck("aiCode"); return; }
      if (st.state === "done") { st.state = "todo"; st.note = ""; }
      st.fix = 0;
      st.fixViols = null;
      aiPlan.stepMode = 1;
      aiPlan.target = n;
      aiPlan.cur = n;
      aiPlan.paused = 0;
      aiPlan.interrupted = 0;
      aiPlan.status = "running";
      aiPlanLiveId = aiPlanId(aiPlan);
      aiPlanSave(); aiRenderPlan();
      aiToolClear();
      aiToolState("单步执行：第 " + n + " 步", "on");
      aiToolLog("", "▶ 单步执行第 " + n + " 步：" + st.name);
      aiWatchStart();
      aiAddMsg("单步执行第 " + n + " 步：" + st.name, true);
      aiPlanStepNext();
    }

    // 手动把某一步标为已完成（状态被写坏时的人工校正入口）
    function aiPlanMarkDone(n) {
      if (!aiPlan) return;
      var st = aiPlan.steps[n - 1];
      if (!st) return;
      if (st.state === "done") return;
      st.state = "done";
      st.note = st.note || "手动确认完成";
      st.fix = 0;
      st.fixViols = null;
      aiPlanSave(); aiRenderPlan();
      aiToolLog("ok", "✓ 第 " + n + " 步手动标为完成");
      aiAddMsg("第 " + n + " 步已手动标为完成（" + aiPlanDoneCount() + "/" + aiPlan.steps.length + "）。", false);
    }

    function aiPlanDoneCount() {
      var c = 0;
      (aiPlan.steps || []).forEach(function (s) { if (s.state === "done") c++; });
      return c;
    }

    function aiPlanCur() {
      if (!aiPlan || !aiPlan.steps) return null;
      // 单步模式：只认指定那一步（卢Sir：按钮下沉到步骤上，能单独执行某一步）
      if (aiPlan.stepMode && aiPlan.target) {
        var t = aiPlan.steps[aiPlan.target - 1];
        if (t && t.state !== "done") return t;
        return null;
      }
      for (var i = 0; i < aiPlan.steps.length; i++) {
        if (aiPlan.steps[i].state !== "done") return aiPlan.steps[i];
      }
      return null;
    }

    function aiPlanStepPrompt(st) {
      var L = [];
      var total = aiPlan.steps.length;
      L.push("现在只做开发计划的第 " + st.n + " 步（共 " + total + " 步），不要做后面任何一步。");
      L.push("");
      L.push("【本步】" + st.name);
      if (st.desc) L.push("说明：" + st.desc);
      if (st.detail) {
        L.push("业务细节（照这个做，不要自行发挥）：");
        String(st.detail).split(String.fromCharCode(10)).forEach(function (dl) { L.push("  " + dl); });
      }
      // 「设计数据结构」已从计划里抽出，做成独立的「业务表单」模块（doc/forms.json + doc/data-model.md）。

    // 返工提示词：把校验器抓到的「文件 + 规则」原样喂回去。
    // 只报「没过」不报「哪儿没过」，Agent 就只能瞎猜 —— 这正是之前死循环的原因。
    function aiPlanStepFixPrompt(st) {
      var v = (st && st.fixViols) || [];
      if (!v.length) return "";
      var L = [];
      L.push("【返工：上一轮没过自动校验，必须先把这些改掉，再继续本步】");
      v.forEach(function (x, i) { L.push("  " + (i + 1) + ". " + x); });
      L.push("只改上面这些点；清单里若有不属于本步的历史问题，只在回复里说明，不要动它。");

    // 一步收尾的统一入口：ASK 感知 + 校验 + 返工 + 推进。
    // 之前这段逻辑只写在 aiPlanStepNext 的 onDone 里，aiSendText（ASK 回答）没有它 ——
    // Agent 输出 [[ASK]] 等回答时 run 已结束，onDone 照样标 done 推进下一步，
    // 用户的回答反而发进下一个无关的 run。这里把收尾逻辑抽出来共用。
    function aiStepSettle(myPlan, st, full) {
      aiBeatStop();
      if (!aiPlan || aiPlanId(aiPlan) !== aiPlanId(myPlan)) return;
      var st2 = aiPlan.steps[st.n - 1] || st;
      // 1) Agent 在等用户回答：这一轮只是把问题抛出来了，活没干完，不能算完成。
      //    等待期间没有新事件，看门狗会误判中断 —— 关掉它，回答的 run 里再重新开。
      var askPending = aiAskScan(full);
      if (askPending) {
        aiWatchStop();
        st2.state = "doing";
        st2.note = "等待你的回答";
        aiPlanSave(); aiRenderPlan();
        aiToolState("等待你回答弹窗里的问题…", "");
        return;
      }
      aiScanMarks(full);
      aiCodeGuard(function (ok, viols) {
        viols = viols || [];
        if (!aiPlan || aiPlanId(aiPlan) !== aiPlanId(myPlan)) return;
        if (!ok) {
          // 用户刚点了暂停：就算有违规也别把暂停解开（返工不能凌驾在暂停之上）
          if (aiPlan.paused) {
            st2.state = "todo";
            st2.note = "有违规，已暂停";
            aiPlanSave(); aiRenderPlan();
            aiToolState("已暂停（这步还有 " + viols.length + " 处违规）", "");
            return;

          var nFix = (st2.fix || 0) + 1;
          if (nFix <= 2) {
            st2.fix = nFix;
            st2.fixViols = viols;
            st2.state = "todo";
            st2.note = "第 " + nFix + " 次返工";
            aiPlan.paused = 0;
            aiPlanSave(); aiRenderPlan();
            aiToolState("第 " + st2.n + " 步第 " + nFix + " 次返工：" + viols.length + " 处违规", "bad");
            aiToolLog("err", "✗ 校验没过（" + viols.length + " 处），清单已发回 Agent 自己改");
            aiAddMsg("第 " + st2.n + " 步没过校验，" + viols.length + " 处。清单已经发回给 Agent 自己改（第 " + nFix + "/2 次），不用你动手：\n- " + viols.join("\n- "), false);
            setTimeout(function () { aiPlanStepNext(); }, 800);
            return;
          }
          st2.state = "todo";
          st2.note = "返工 2 次仍未通过";
          st2.fix = 0;
          aiPlan.status = "paused";
          aiPlan.paused = 1;
          aiPlanLiveId = null;
          aiWatchStop();
          aiPlanSave(); aiRenderPlan();
          aiToolState("已停止：第 " + st2.n + " 步返工 2 次仍没过", "bad");
          aiToolLog("err", "✗ 返工 2 次仍未过，停下等卢Sir 定夺");
          aiAddMsg("第 " + st2.n + " 步返工 2 次还是没过，浩克不再空转。剩下的：\n- " + viols.join("\n- ") + "\n\n可以：① 点「继续执行」再试一次 ② 直接说怎么改 ③ 说这步跳过。", false);
          return;

        st2.fixViols = null;

        aiToolLog("ok", "✓ 第 " + st2.n + " 步完成" + (st2.fix ? "（返工后通过）" : ""));
        if (aiPlan.paused) {
          aiPlan.status = "paused";
          aiPlanLiveId = null;
          aiWatchStop();
          aiPlanSave(); aiRenderPlan();
          aiToolState("已暂停：做完第 " + st2.n + " 步", "");

    function aiPlanStepNext() {
      if (!aiPlan) return;
      if (aiPlan.paused) {
        aiPlan.status = "paused";
        aiPlanLiveId = null;
        aiWatchStop();
        aiPlanSave(); aiRenderPlan();
        aiToolState("已暂停，点「继续执行」接着做", "");
        return;
      }
      var st = aiPlanCur();
      if (!st && aiPlan.stepMode) {
        // 单步模式：这一步处理完就停，绝不自动往下走
        var _tnStep = aiPlan.target || 0;
        aiPlan.stepMode = 0;
        aiPlan.target = 0;
        aiPlan.paused = 1;
        aiPlan.status = "paused";
        aiPlanLiveId = null;
        aiWatchStop();
        aiPlanSave(); aiRenderPlan();
        aiToolState("第 " + _tnStep + " 步已处理完（单步模式，没往下走）", "on");
        aiToolLog("ok", "✓ 单步完成：" + _tnStep);
        aiAddMsg("第 " + _tnStep + " 步做完了。单步模式只跑这一步 —— 要继续就点下一步的「执行」，或点底部的「跑完剩下的」。", false);
        return;
      }
      if (!st) {
        aiPlan.status = "done";
        aiPlan.paused = 0;
        aiPlanLiveId = null;
        aiWatchStop();
        aiPlanSave(); aiRenderPlan();
        aiToolState("全部完成 " + aiPlanDoneCount() + "/" + aiPlan.steps.length, "");
        aiAddMsg("计划里的 " + aiPlan.steps.length + " 步全部做完了 🎉", false);
        return;
      }
      var myPlan = aiPlan;
      st.state = "doing";
      aiPlan.cur = st.n;
      aiPlanLiveId = aiPlanId(myPlan);
      aiPlanSave(); aiRenderPlan();
      aiToolState("正在做第 " + st.n + "/" + aiPlan.steps.length + " 步：" + st.name, "on");
      aiToolLog("", "▶ 第 " + st.n + " 步：" + st.name);
      aiBeatStart();
      agentRun("aiCode", aiPlanStepPrompt(st), {
        onDone: function (full) {
          // 收尾逻辑已抽到 aiStepSettle：ASK 感知 + 校验 + 返工 + 推进。
          // 千万别按对象身份判断：界面一重绘 aiPlan 就被重建，引用变了，
          // 正常完成也会被这句直接挡回去（上一版就是卡在这）。
          aiStepSettle(myPlan, st, full);

        onError: function (msg) {

          if (!aiPlan || aiPlanId(aiPlan) !== aiPlanId(myPlan)) return;
          var st3 = aiPlan.steps[st.n - 1] || st;
          st3.state = "todo";
          aiPlan.status = "paused";
          aiPlan.paused = 1;
          aiPlanLiveId = null;
          aiWatchStop();
          aiPlanSave(); aiRenderPlan();
          aiToolState("已停止：第 " + st3.n + " 步出错", "bad");
          aiToolLog("err", "✗ 第 " + st3.n + " 步出错：" + String(msg).slice(0, 200));
          aiChoices(msg);
        }
      }).catch(function (e) {
        // agentRun 在发请求前就失败（Tauri 不可用 / 场景不存在）时，它内部的
        // onError 不会触发，步骤会永远卡在 doing。这里兜底：计划还在 running 才处理
        // （invoke 失败已由 agentRun 内部 catch 调过 onError、status 变 paused，不会双处理）。
        if (!aiPlan || aiPlan.status !== "running") return;
        aiBeatStop();
        if (!aiPlan || aiPlanId(aiPlan) !== aiPlanId(myPlan)) return;
        var st5 = aiPlan.steps[st.n - 1] || st;
        st5.state = "todo";
        aiPlan.status = "paused";
        aiPlan.paused = 1;
        aiPlanLiveId = null;
        aiWatchStop();
        aiPlanSave(); aiRenderPlan();
        aiToolState("已停止：第 " + st5.n + " 步启动失败", "bad");
        aiToolLog("err", "✗ 启动失败：" + String(e).slice(0, 160));
        aiChoices(String(e));
      });
    }

    function aiPlanPause() {
      if (!aiPlan) return;
      aiPlan.paused = 1;
      // 立刻解锁，不等这一轮回调。真卡死时那个回调永远不会来，等它就是死等。
      aiPlan.status = "paused";
      aiPlanLiveId = null;
      (aiPlan.steps || []).forEach(function (s) { if (s.state === "doing") s.state = "todo"; });
      aiWatchStop();
      aiPlanSave(); aiRenderPlan();
      aiToolState("已暂停", "");
      aiToolLog("", "⏸ 已暂停");
      aiAddMsg("已暂停。点「继续执行」从下一个没做完的步骤接着做。", false);
    }

    // ---- 看门狗：一轮到底是真在跑，还是早就断了没人告诉界面 ----
    // 判定依据只有一个：还有没有新事件进来。90 秒没动静就亮黄灯，300 秒就自动解锁，
    // 免得界面永远停在「处理中」、按钮永远点不动（卢Sir 就是这么被坑的）。
    var _aiWatch = null;
    function aiWatchStop() {
      if (_aiWatch) { clearInterval(_aiWatch); _aiWatch = null; }
    }
    function aiWatchStart() {
      aiWatchStop();
      window.__aiLastEvt = Date.now();
      window.__aiRunT0 = Date.now();
      _aiWatch = setInterval(function () {
        if (!aiPlan || aiPlan.status !== "running") { aiWatchStop(); return; }
        var idle = Math.round((Date.now() - (window.__aiLastEvt || Date.now())) / 1000);
        var runS = Math.round((Date.now() - (window.__aiRunT0 || Date.now())) / 1000);
        if (idle >= 300) {
          aiPlan.status = "paused";
          aiPlan.paused = 1;
          aiPlanLiveId = null;
          (aiPlan.steps || []).forEach(function (s) { if (s.state === "doing") s.state = "todo"; });
          aiPlanSave(); aiRenderPlan();
          aiToolState("已判定中断：" + idle + " 秒零响应，已自动解锁", "warn");
          aiToolLog("warn", "⚠ " + idle + " 秒没有任何响应，判定这一轮已经断了。点「继续执行」接着做。");

        } else if (idle >= 90) {
          aiToolState("⚠ 已 " + idle + " 秒无响应（本轮已跑 " + Math.floor(runS / 60) + " 分 " + (runS % 60) + " 秒），可能卡住了", "warn");

      }, 5000);
    }

    // ---- 扫描进度标记 ----
    // B2：技术栈硬校验 —— 扫项目里的依赖清单，命中「禁止」列关键词就红牌。
    // B2：硬校验 —— 依赖清单（技术栈）+ 代码铁律，两条都过才算这步完成。
    // 原理：违规一定留痕（用 Spring → pom 里有 spring-boot-starter；绕过 api.js → 直接 new XMLHttpRequest），比任何提示词都硬。
    function aiCodeGuard(fin) {
      // 违规清单必须交出去：只报「过/不过」的话，Agent 永远不知道自己错在哪，
      // 人点一次继续它就照原样再犯一次 —— 那才是真死循环。
      var done = function (ok, viols) { if (typeof fin === "function") fin(ok, viols || []); };
      var ws = (aiDetect && aiDetect.ws) || "";
      if (!currentProject || !ws || !AGENT_CONST) { done(true, []); return; }
      var viols = [];
      // 取词：只把「禁止」列里、且「规定」列没出现过的英文技术名当禁止词（否则 Redis/Tomcat 会误伤）
      var FB = AGENT_CONST.forbids || {}, ST = AGENT_CONST.stack || {};
      var allowTxt = " ";
      for (var ak in ST) { if (Object.prototype.hasOwnProperty.call(ST, ak) && ST[ak]) allowTxt += String(ST[ak]).toLowerCase() + " "; }
      var words = [];
      for (var k in FB) {
        if (!Object.prototype.hasOwnProperty.call(FB, k) || !FB[k]) continue;
        var parts = String(FB[k]).split(/[,\/，、]/);
        for (var pi = 0; pi < parts.length; pi++) {
          var w = parts[pi].trim();
          if (w.length < 4) continue;
          if (!/^[A-Za-z][A-Za-z0-9\-\.]*$/.test(w)) continue;
          if (allowTxt.indexOf(w.toLowerCase()) >= 0) continue;
          words.push(w);
        }
      }
      var p1 = words.length
        ? window.__TAURI__.core.invoke("stack_check", { prjName: currentProject.prjName, workspace: ws, forbid: words.join(",") })
        : Promise.resolve("{\"ok\":true,\"violations\":[]}");
      p1.then(function (res) {
        var o = null;
        try { o = JSON.parse(String(res || "{}")); } catch (e) { o = null; }
        if (o && o.violations) { for (var i = 0; i < o.violations.length; i++) viols.push(o.violations[i]); }
        return window.__TAURI__.core.invoke("ironlaw_check", { prjName: currentProject.prjName, workspace: ws });
      }).then(function (res2) {
        var o2 = null;
        try { o2 = JSON.parse(String(res2 || "{}")); } catch (e) { o2 = null; }
        if (o2 && o2.violations) { for (var i = 0; i < o2.violations.length; i++) viols.push(o2.violations[i]); }
        if (!viols.length) { done(true, []); return; }
        done(false, viols);
      }).catch(function () { done(true, []); });
    }

    function aiScanMarks(full) {
      if (!aiPlan || !aiPlan.steps || !aiPlan.steps.length) return;
      var t = String(full || "");
      var KS = "[[STEP_START:";
      var KD = "[[STEP_DONE:";
      var NLc = String.fromCharCode(10);
      var pos = 0;
      var changed = false;
      while (true) {
        var i1 = t.indexOf(KS, pos);
        var i2 = t.indexOf(KD, pos);
        var i = -1;
        var kind = "";
        if (i1 >= 0 && (i2 < 0 || i1 < i2)) { i = i1; kind = "start"; }
        else if (i2 >= 0) { i = i2; kind = "done"; }
        if (i < 0) break;
        var keyLen = (kind === "start") ? KS.length : KD.length;
        var j = t.indexOf("]]", i);
        if (j < 0) break;
        var n = parseInt(t.slice(i + keyLen, j), 10);
        var tailEnd = t.indexOf(NLc, j);
        var note = t.slice(j + 2, tailEnd < 0 ? t.length : tailEnd).trim();
        if (n > 0) {
          var st = aiPlan.steps[n - 1];
          if (st) {
            // 单步模式：只认当前这一步的标记。Agent 把编号写歪（说做完第 9 步其实在第 3 步）
            // 时一律忽略，否则卡片会被它带偏，和实际进度对不上。
            var isCur = aiPlan.cur ? (n === aiPlan.cur) : true;
            if (isCur) {
              if (kind === "start" && st.state !== "done") { st.state = "doing"; changed = true; }
              if (kind === "done" && note) { st.note = note; changed = true; }
            }
          }
        }
        pos = j + 2;
      }
      if (changed) { aiPlanSave(); aiRenderPlan(); }
    }

    // ---- 心跳 ----
    function aiBeatStart() {
      aiBeatStop();
      aiBeatIdx = 0;
      aiBeatTimer = setInterval(function () {
        if (!aiPlan || aiPlan.status !== "running") return;
        var doing = null;
        aiPlan.steps.forEach(function (s) { if (!doing && s.state === "doing") doing = s; });
        if (!doing) return;
        aiBeatIdx = (aiBeatIdx + 1) % AI_BEATS.length;
        var row = document.querySelector('.ui-plan-step[data-n="' + doing.n + '"]');
        if (row) {
          var el = row.querySelector('[data-role="status"]');
          if (el) el.textContent = AI_BEATS[aiBeatIdx];
        }
      }, 18000);
    }
    function aiBeatStop() {
      if (aiBeatTimer) { clearInterval(aiBeatTimer); aiBeatTimer = null; }
    }

    // ---- 出错给选择题 ----
    function aiChoices(msg) {
      var list = document.getElementById("aiMsgList");
      if (!list) return;
      var row = document.createElement("div");
      row.className = "chat-msg bot";
      var L = [];
      L.push('<div class="chat-bubble">');
      L.push('这一步没做成：' + escHtml(String(msg).slice(0, 260)) + '<br>你想怎么办？');
      L.push('<div class="ui-choices">');
      L.push('<button class="btn btn-xs" data-ch="retry">重新试一次</button>');
      L.push('<button class="btn btn-xs" data-ch="skip">跳过这一步</button>');
      L.push('<button class="btn btn-xs" data-ch="stop">先停下来</button>');
      L.push('</div></div>');
      row.innerHTML = L.join("");
      list.appendChild(row);
      list.scrollTop = list.scrollHeight;
      Array.prototype.forEach.call(row.querySelectorAll("[data-ch]"), function (b) {
        b.onclick = function () {
          var ch = b.getAttribute("data-ch");
          row.remove();
          if (ch === "retry") { aiAddMsg("重新试一次这一步", true); aiPlanStart(); }
          else if (ch === "skip") {
            if (aiPlan) {
              // onError 已把出错步的 doing 清成 todo，按 doing 找永远找不到 → 跳过的其实是下一步。
              // 正确语义：跳过「第一个没做完的步骤」。
              var doing = null;
              aiPlan.steps.forEach(function (s) { if (!doing && s.state !== "done") doing = s; });
              if (doing) { doing.state = "done"; doing.note = "这一步跳过了"; aiPlanSave(); aiRenderPlan(); }
            }
            aiAddMsg("跳过这一步，接着往下做", true);
            aiPlanStart();
          } else { aiAddMsg("先停下，我自己看看", true); }
        };
      });
    }

    // ---- 执行过程日志：工具调用 / 思考 / 耗时，独立面板，永远滚到最新一条 ----
    // 2026-11-13 卢Sir 要求「微调模式和 AI开发 共享执行输出」：
    //   DOM 只是投影，真源是 localStorage 的 ai_log_<prjGUID>（微调浮窗读写同一份）。
    //   以前切页面日志就没了，现在持久化，两个窗口看到的是同一条流水。
    function aiLogKey() {
      var guid = (currentProject && currentProject.prjGUID) ? currentProject.prjGUID : "tdev-ai";
      return "ai_log_" + guid;
    }
    function aiLogRead() {
      try { var a = JSON.parse(localStorage.getItem(aiLogKey()) || "[]"); return Array.isArray(a) ? a : []; }
      catch (e) { return []; }
    }
    function aiLogWrite(arr) {
      try { localStorage.setItem(aiLogKey(), JSON.stringify(arr.slice(-300))); } catch (e) {}
    }
    function aiLogPush(cls, text) {
      var arr = aiLogRead();
      arr.push({ c: cls || "", m: String(text), t: Date.now() });
      aiLogWrite(arr);
    }
    function aiLogRowHtml(row) {
      var n = new Date(row.t || Date.now());
      var hm = ("0" + n.getHours()).slice(-2) + ":" + ("0" + n.getMinutes()).slice(-2) + ":" + ("0" + n.getSeconds()).slice(-2);
      return '<div class="ai-tool-row' + (row.c ? " " + row.c : "") + '">' + escHtml(hm + "  " + String(row.m || "")) + '</div>';
    }
    // 从共享日志重建面板（切页面 / 切回窗口时调用；执行中不调用，免得打断流式行）
    function aiLogRender() {
      var b = document.getElementById("aiToolBody");
      if (!b) return;
      var arr = aiLogRead().slice(-300);
      b.innerHTML = arr.map(aiLogRowHtml).join("");
      b.scrollTop = b.scrollHeight;
    }
    function aiToolLog(cls, text) {
      aiLogPush(cls, text);
      var b = document.getElementById("aiToolBody");
      if (!b) return null;
      var d = document.createElement("div");
      d.className = "ai-tool-row" + (cls ? " " + cls : "");
      var n = new Date();
      var hm = ("0" + n.getHours()).slice(-2) + ":" + ("0" + n.getMinutes()).slice(-2) + ":" + ("0" + n.getSeconds()).slice(-2);
      d.textContent = hm + "  " + text;
      while (b.childElementCount > 300) { b.removeChild(b.firstChild); }
      b.appendChild(d);
      b.scrollTop = b.scrollHeight;
      return d;
    }
    function aiToolState(text, cls) {
      var el = document.getElementById("aiToolState");
      if (el) {
        el.textContent = text;
        el.className = "ai-tool-state" + (cls ? " " + cls : "");
      }
      // 只有真有 Agent 在跑（或有活跃计划）时才露出「强制解锁」逃生口
      var ub = document.getElementById("aiToolUnlock");
      if (ub) ub.className = "ai-tool-unlock" + ((AGENT_BUSY || (aiPlan && aiPlan.status === "running")) ? " on" : "");
    }

    // 通用确认框。WebView2 里 window.confirm 点「否」仍会执行（实测），必须用自己的。

    // 通用多按钮弹窗：buttons = [{text, primary, cb}]
    function aiChoiceBox(title, bodyHtml, buttons) {

    // 「重新生成」前的确认：把「会保留几步、哪些可能丢」讲清楚再让用户点
    function aiAskRegen() {
      // 立即给可见反馈：按钮点下去到弹窗出现之间不能有静默期，
      // 否则用户会以为界面卡死（这就是"点了重新生成没反应"的观感来源）。
      aiToolLog("run", "点了「重新生成」，正在检查当前进度…");
      if (!aiPlan || !aiPlan.steps || !aiPlan.steps.length) { aiGenPlan(); return; }
      if (aiPlan.status === "running") {
        aiAddMsg("现在正在执行第 " + (aiPlan.cur || "?") + " 步，等它结束或点「暂停全部」后再重新生成。", false);
        return;
      }
      var dn = 0, samples = [];
      aiPlan.steps.forEach(function (s) {
        if (s.state === "done") { dn++; if (samples.length < 3) samples.push(s.name); }
      });
      if (!dn) { aiGenPlan(); return; }   // 一步都没完成，没什么可丢的，不打扰
      // 已完成的步骤不一定连续（用户可能手工标了 8/9/10，而 7 还没做）。
      // 这里绝对不能找「连续前缀」：一旦中间有一步没做，后面做完的全都会丢。
      // 改成把所有 done 的序号都记下来，逐位保留。
      var doneIdx = [];
      for (var i = 0; i < aiPlan.steps.length; i++) {
        if (aiPlan.steps[i].state === "done") doneIdx.push(i + 1);
      }
      var rangeTxt = (function (arr) {
        if (!arr.length) return "";
        var out = [], s = arr[0], p = arr[0];
        for (var k = 1; k < arr.length; k++) {
          if (arr[k] === p + 1) { p = arr[k]; continue; }
          out.push(s === p ? ("" + s) : (s + "-" + p)); s = p = arr[k];
        }
        out.push(s === p ? ("" + s) : (s + "-" + p));
        return out.join("、");
      })(doneIdx);
      var B = [];
      B.push("当前计划 <b>" + aiPlan.steps.length + "</b> 步，其中 <b>" + dn + "</b> 步已完成。");
      B.push("<br><br><b>保留已完成</b>：已做完的 <b>" + dn + "</b> 步（第 " + escHtml(rangeTxt) + " 步）原样不动，" +
             "只重新生成剩下的 " + (aiPlan.steps.length - dn) + " 步。做过的一步都不会重做。");
      B.push("<br><b>全部重新生成</b>：整份重排，已完成的按名称尽量保留（名称变了的要重做）。");
      aiChoiceBox("重新生成开发计划", B.join(""), [
        { text: "保留已完成（" + dn + " 步不动）", primary: true, cb: function () { aiRegenKeep(1); } },
        { text: "全部重新生成", cb: function () { aiRegenKeep(0); } },
        { text: "取消", cb: function () { aiToolLog("dim", "已取消重新生成"); } }
      ]);
    }

    // 重新生成时保留前 N 步（N=0 表示整份重排，仅按名称继承）
    var aiPlanKeepDone = 0;   // 1 = 保留所有已完成的步骤（不管是否连续）；0 = 全部重生成
    function aiRegenKeep(mode) {
      aiPlanKeepDone = (parseInt(mode, 10) === 1) ? 1 : 0;
      if (aiPlanKeepDone) aiToolLog("dim", "保留已完成的步骤，只重新生成没做的部分");
      aiGenPlan();
    }

    // 强制解锁：前后端两把锁一起放。只在真卡死时用 —— 真在跑的任务结果可能丢。
    function aiForceUnlock() {
      if (!window.__TAURI__ || !window.__TAURI__.core) return;
      window.__TAURI__.core.invoke("agent_force_unlock").then(function (r) {
        agentBusyClear();
        if (aiPlan && aiPlan.status === "running") {
          aiPlan.status = "paused";
          aiPlan.paused = 1;
          aiPlanLiveId = null;
          (aiPlan.steps || []).forEach(function (s) { if (s.state === "doing") s.state = "todo"; });
          aiPlanSave(); aiRenderPlan();
        }
        aiToolState("已强制解锁", "");
        aiToolLog("err", "✗ 已强制解锁（前后端两把锁一起放）");
        aiAddMsg("已强制解锁。如果刚才确实有任务在跑，它的结果可能没写完 —— 做之前先看一眼代码状态。", false);
      }).catch(function (e) { aiAddMsg("解锁失败：" + e, false); });
    }
    function aiToolClear() {
      var b = document.getElementById("aiToolBody");
      if (b) b.innerHTML = "";
      aiLogWrite([]);
    }

    // ---- 阻塞式询问：Agent 需要密码 / 方案选择时必须弹窗，不能只在聊天里问 ----
    var aiAskShown = "";
    function aiAskScan(full) {
      var t = String(full || "");
      var i = t.indexOf("[[ASK:");
      if (i < 0) return false;
      var j = t.indexOf("]]", i);
      if (j < 0) return false;
      var raw = t.slice(i + 6, j);
      if (aiAskShown === raw) return true;
      var spec = null;
      try { spec = JSON.parse(raw); } catch (e) { return false; }
      if (!spec) return false;
      aiAskShown = raw;
      aiAskShow(spec);
      return true;
    }
    function aiAskShow(spec) {
      var old = document.getElementById("aiAskMask");
      if (old) old.remove();
      var mask = document.createElement("div");
      mask.id = "aiAskMask";
      mask.className = "ai-ask-mask";
      var H = [];
      H.push('<div class="ai-ask-card">');
      H.push('<div class="ai-ask-title">' + escHtml(spec.title || "需要你确认一下") + '</div>');
      if (spec.body) H.push('<div class="ai-ask-body">' + escHtml(spec.body) + '</div>');
      if (spec.options && spec.options.length) {
        H.push('<div class="ai-ask-opts">');
        spec.options.forEach(function (o, k) {
          H.push('<label class="ai-ask-opt"><input type="radio" name="aiAskOpt" value="' +
            escHtml(String(o.v || o.label || "")) + '"' + (k === 0 ? " checked" : "") + '> ' +
            escHtml(o.label || o.v || "") + '</label>');
        });
        H.push('</div>');
      }
      var secret = !!(spec.field && spec.field.secret);
      if (spec.field) {
        H.push('<div class="ai-ask-field"><label>' + escHtml(spec.field.label || "请输入") + '</label>');
        H.push('<input id="aiAskVal" type="' + (secret ? "password" : "text") + '" autocomplete="off" spellcheck="false" placeholder="' +
          escHtml(spec.field.placeholder || "") + '"></div>');
      }
      H.push('<div class="ai-ask-actions"><button class="btn btn-primary" id="aiAskOk">确定并继续</button>');
      H.push('<button class="btn" id="aiAskCancel">先不做</button></div>');
      if (spec.hint) H.push('<div class="ai-ask-hint">' + escHtml(spec.hint) + '</div>');
      H.push('</div>');
      mask.innerHTML = H.join("");
      document.body.appendChild(mask);
      var valEl = document.getElementById("aiAskVal");
      if (valEl) setTimeout(function () { valEl.focus(); }, 60);
      document.getElementById("aiAskCancel").onclick = function () {
        mask.remove();
        aiAskShown = "";
        // 用户拒绝了：先把计划真正暂停（否则这轮 run 结束后 onDone 会把它当完成推进），
        // 再告诉 Agent 别傻等。回复 run 里 status 已不是 running，不会被误收尾。
        if (aiPlan) {
          aiPlan.status = "paused";
          aiPlan.paused = 1;
          aiPlanLiveId = null;
          (aiPlan.steps || []).forEach(function (s) { if (s.state === "doing") s.state = "todo"; });
          aiPlanSave(); aiRenderPlan();
        }
        aiWatchStart();
        aiSendText("用户选择「先不做」，这一步暂停。请说明当前项目的状态和下一步建议，不要继续做这一步。", "已选择「先不做」，等我安排。");
        aiToolState("已取消：这一步等你安排", "");
      };
      document.getElementById("aiAskOk").onclick = function () {
        var opt = "";
        var r = mask.querySelector('input[name="aiAskOpt"]:checked');
        if (r) opt = r.value;
        var val = valEl ? valEl.value : "";
        if (spec.field && !String(val).trim()) {
          if (valEl) { valEl.style.borderColor = "#D93025"; valEl.focus(); }
          return;
        }
        mask.remove();
        var parts = [];
        if (opt) parts.push(opt);
        if (val) parts.push(val);
        var ans = parts.join(" | ");
        // 密钥类答案：只发给 Agent，聊天记录里显示遮蔽值
        aiSendText(ans, secret ? ("已填写 " + (spec.field.label || "密钥") + "：[已遮蔽]") : ans);
      };
    }

    function aiAddMsg(text, mine) {
      var list = document.getElementById("aiMsgList");
      if (!list) return;
      var empty = document.getElementById("aiEmpty");
      if (empty) empty.remove();
      var row = document.createElement("div");
      row.className = "chat-msg " + (mine ? "me" : "bot");
      row.innerHTML = '<div class="chat-bubble">' + escHtml(text) + '</div>';
      list.appendChild(row);
      list.scrollTop = list.scrollHeight;
    }

    // text = 真正发给 Agent 的内容；display = 聊天窗口里显示的内容（密钥要遮蔽）
    function aiSendText(text, display) {
      if (!text) return;
      if (!window.__TAURI__ || !window.__TAURI__.core) { aiAddMsg("Tauri 不可用", false); return; }
      if (!currentProject) { aiAddMsg("请先在「基础信息」选择或新建项目", false); return; }
      aiAddMsg(display || text, true);
      agentHistPush("aiCode", display || text, true);
      var ctx = text;
      if (aiPlan && aiPlan.steps && aiPlan.steps.length) {
        var pl = ["【当前开发计划】"];
        aiPlan.steps.forEach(function (st2) {
          var tag = st2.state === "done" ? "（已完成）" : (st2.state === "doing" ? "（正在做）" : "（还没做）");
          pl.push(st2.n + ". " + st2.name + (st2.desc ? " —— " + st2.desc : "") + tag);
        });
        pl.push("");
        pl.push("【我的回答】");
        pl.push(text);
        ctx = pl.join(aiNL());
      }
      agentRun("aiCode", ctx, {
        // 这是 ASK 弹窗的回答通道：回答完 Agent 会在这个 run 里把活干完，
        // 所以 onDone 要像正常步骤一样收尾（校验 → 打勾 → 下一步）。
        // 普通提问走 aiSend，不走这里。
        beforeSend: function () { aiWatchStart(); },
        onDone: function (full) {
          modSet("ai_code", true);
          if (aiAskScan(full)) return;          // 连环 ASK，继续等
          if (!aiPlan || aiPlan.status !== "running") return;   // 没有在跑的计划，只是普通回答
          var _cur = aiPlanCur();
          if (!_cur) return;
          var _cur2 = aiPlan.steps[_cur.n - 1] || _cur;
          if (_cur2.state !== "doing" && _cur2.note !== "等待你的回答") return;  // 计划没在等回答，别误收尾
          aiStepSettle(aiPlan, _cur, full);
        },
        onError: function (msg) { aiAddMsg("编码失败：" + msg, false); }
      }).catch(function () {});    }

    function aiSend() {
      var input = document.getElementById("aiInput");
      if (!input) return;
      var text = input.value.trim();
      if (!text) return;
      if (!window.__TAURI__ || !window.__TAURI__.core) { aiAddMsg("Tauri 不可用", false); return; }
      if (!currentProject) { aiAddMsg("请先在「基础信息」选择或新建项目", false); return; }
      aiAddMsg(text, true);
      agentHistPush("aiCode", text, true);
      input.value = "";
      draftClear("aiCode");
      taGrow(input);
      // 生成计划走的是一次性会话，主会话里没有流程全文；用户追问时把当前计划带上即可回答
      // （计划只有几百字符，比重新灌整份流程省得多）
      var ctx = text;
      if (aiPlan && aiPlan.steps && aiPlan.steps.length) {
        var pl = ["【当前开发计划】"];
        aiPlan.steps.forEach(function (st2) {
          var tag = st2.state === "done" ? "（已完成）" : (st2.state === "doing" ? "（正在做）" : "（还没做）");
          pl.push(st2.n + ". " + st2.name + (st2.desc ? " —— " + st2.desc : "") + tag);
        });
        pl.push("");
        pl.push("【我的问题】");
        pl.push(text);
        ctx = pl.join(aiNL());
      }
      // 统一组件：场景 aiCode（禁止改流程 JSON / 主题）
      agentRun("aiCode", ctx, {
        onDone: function (full) { modSet("ai_code", true); aiAskScan(full); },
        onError: function (msg) { aiAddMsg("编码失败：" + msg, false); }
      }).catch(function () {});
    }

      content.innerHTML =

    // ==================== 业务表单（原「设计数据结构」第 7 步，2026-11-13 抽成独立模块）====================
    // 真源 doc/forms.json（界面直接编辑它）；派生 doc/data-model.md（前端生成，AI 编码每一步第 0 条都读它）。
    // 命名按业务视角：表单 = 业务对象，界面上不叫「表结构」。
    var fmData = null;       // {version, project, flow, generatedAt, forms:[], decisions:[]}
    var fmDirty = false;
    var fmBusy = false;
    var fmWs = "";
    var fmFlowText = "";
    var fmFlowNodes = 0;
    var fmFlowMains = 0;
    var fmProjGuid = "__init__";
    var fmOpen = {};

    function fmNow() {
      var d = new Date();
      function p(n) { return ("0" + n).slice(-2); }
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
        p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    function fmNum(v) { var n = parseInt(v, 10); return isNaN(n) ? null : n; }

    function fmEnsureWs(cb) {
      if (fmWs) { cb(fmWs); return; }
      if (aiDetect && aiDetect.ws) { fmWs = aiDetect.ws; cb(fmWs); return; }
      window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function (v) {
        var ws = "";
        try { ws = JSON.parse(v || "{}").path || ""; } catch (e) {}
        fmWs = ws;
        if (ws && aiDetect) aiDetect.ws = ws;
        cb(ws);
      }).catch(function () { cb(""); });
    }

    // 业务流程是否存在 —— 需求 4：表单生成的前提
    function fmLoadFlow(cb) {
      fmEnsureWs(function (ws) {
        if (!ws || !currentProject) { fmFlowText = ""; fmFlowNodes = 0; fmFlowMains = 0; cb(false); return; }
        aiDetect.ws = ws;
        aiFlowFull(function (f) {
          if (f && f.text) {
            fmFlowText = f.text; fmFlowNodes = f.nodes || 0; fmFlowMains = f.mains || 0; cb(true);
          } else {
            fmFlowText = ""; fmFlowNodes = 0; fmFlowMains = 0; cb(false);
          }
        });
      });
    }

    function fmLoadJson(cb) {
      if (!currentProject || !fmWs) { fmData = null; cb(); return; }
      window.__TAURI__.core.invoke("process_load", {
        prjName: currentProject.prjName, workspace: fmWs, fileName: "forms.json"
      }).then(function (raw) {
        var d = null;
        try { d = JSON.parse(String(raw || "")); } catch (e) { d = null; }
        fmData = (d && Array.isArray(d.forms)) ? fmNormalize(d) : null;
        if (fmData && fmData.forms.length) modSet("forms", true);   // 已有表单 → 补亮灯（老项目也认）
        cb();
      }).catch(function () { fmData = null; cb(); });
    }

    function fmNormalize(d) {
      d.forms = d.forms || [];
      d.decisions = Array.isArray(d.decisions) ? d.decisions : [];
      d.forms.forEach(function (f) {
        f.fields = Array.isArray(f.fields) ? f.fields : [];
        f.relations = Array.isArray(f.relations) ? f.relations : [];
        f.name = f.name || f.table || "未命名表单";
        f.table = f.table || f.key || "";
        f.key = f.key || String(f.table || "").replace(/^t_/, "");
        f.module = f.module || "";
        f.desc = f.desc || "";
        f.fields.forEach(function (fd) {
          fd.name = fd.name || "";
          fd.label = fd.label || "";
          fd.type = fd.type || "varchar";
          fd.len = (fd.len === "" || fd.len === undefined) ? null : fd.len;
          fd.required = !!fd.required;
          fd.unique = !!fd.unique;
          fd.note = fd.note || "";
        });
        f.relations.forEach(function (r) {
          r.type = r.type || "1:N";
          r.target = r.target || "";
          r.via = r.via || "";
          r.label = r.label || "";
        });
      });
      return d;
    }

    // ---------- 页面 ----------
    function renderForms() {
      var g = (currentProject && currentProject.prjGUID) ? currentProject.prjGUID : "";
      if (fmProjGuid !== g) { fmProjGuid = g; fmData = null; fmDirty = false; fmOpen = {}; fmWs = ""; }

      content.classList.remove("chat-page", "theme-page", "constr-page");
      content.innerHTML =
        '<div class="page-title">业务表单</div>' +
        '<div class="page-sub">按业务流程生成业务表单（字段 / 关系），AI 开发时按需调用</div>' +
        '<div class="ui-layout">' +
          '<div class="ui-chat">' +
            '<div class="ui-chat-head"><span>💬 业务表单对话</span><span class="ui-badge">已接入</span></div>' +
            '<div class="ui-chat-body" id="fmMsgList" style="display:flex;flex-direction:column;gap:10px;align-items:stretch;justify-content:flex-start">' +
              '<div class="ui-empty" id="fmEmpty">' +
                '<div class="ui-empty-icon">🧾</div>' +
                '<p>业务表单对话</p>' +
                '<p class="ui-empty-sub">右侧点「生成业务表单」，或直接说「客户表再加手机号」</p>' +

              '<textarea id="fmInput" rows="1" placeholder="例如：客户表再加手机号和税号；加一张询盘跟进记录（Enter 发送，Shift+Enter 换行）"></textarea>' +
              '<button id="fmSendBtn">发送</button>' +
            '</div>' +
          '</div>' +
          '<div class="ui-canvas">' +
            '<div class="ui-canvas-head"><span id="fmTitle">📋 业务表单</span><span class="fm-stats" id="fmStats">—</span></div>' +
            '<div class="ui-canvas-body ui-canvas-pad" id="fmBody"><div class="fm-empty">正在读取…</div></div>' +

              '<span class="fm-hint" id="fmHint"></span>' +

    function fmRefresh() {
      fmRenderPanel(true);
      fmLoadFlow(function () {
        fmLoadJson(function () { fmRenderPanel(); });
      });
    }

    function fmStats() {
      var d = fmData;
      if (!d || !d.forms.length) return "0 张表单 · 0 个字段 · 0 条关系";
      var f = 0, r = 0;
      d.forms.forEach(function (x) { f += (x.fields || []).length; r += (x.relations || []).length; });
      return d.forms.length + " 张表单 · " + f + " 个字段 · " + r + " 条关系";
    }

    function fmHint(text, dirty) {
      var el = document.getElementById("fmHint");
      if (!el) return;
      el.textContent = text || "";
      el.className = "fm-hint" + (dirty ? " dirty" : "");
    }

    function fmRenderPanel(loading) {
      var body = document.getElementById("fmBody");
      if (!body) return;
      var st = document.getElementById("fmStats");
      if (st) st.textContent = fmStats();
      var genBtn = document.getElementById("fmGenBtn");
      var saveBtn = document.getElementById("fmSaveBtn");
      var hasFlow = !!fmFlowText;

      if (genBtn) {
        genBtn.disabled = fmBusy || !hasFlow || !currentProject;
        genBtn.textContent = fmBusy ? "生成中…" : "生成业务表单";
      }
      if (saveBtn) saveBtn.disabled = fmBusy || !fmData;
      if (fmBusy) fmHint("Agent 正在按业务流程设计表单，完成后自动保存…");
      else if (fmDirty) fmHint("有未保存的修改", true);
      else if (fmData) fmHint("已保存：doc/forms.json + doc/data-model.md（供 AI 开发读取）");
      else fmHint("");

      if (loading) { body.innerHTML = '<div class="fm-empty">正在读取业务流程与表单…</div>'; return; }
      if (!currentProject) {
        body.innerHTML = '<div class="fm-empty"><b>还没有选择项目</b>先在左上角选择项目，再回来生成业务表单。</div>';
        return;
      }
      if (!hasFlow) {
        body.innerHTML = '<div class="fm-empty"><b>还没有业务流程</b>' +
          '业务表单是按业务流程推出来的，先到「业务流程」把流程梳理完，再回来生成。<br>' +
          '<button class="btn" id="fmGoFlow">去业务流程</button></div>';
        var go = document.getElementById("fmGoFlow");
        if (go) go.addEventListener("click", function () { render(3); });
        return;
      }
      if (!fmData || !fmData.forms.length) {
        body.innerHTML = '<div class="fm-empty"><b>流程已就绪（' + fmFlowNodes + ' 个节点 / ' + fmFlowMains + ' 个主阶段）</b>' +
          '点右上「生成业务表单」，Agent 会按业务流程把业务对象、字段和关系一次列出来。<br>' +
          '生成后每个字段都能直接改。</div>';
        return;
      }

      var H = [];
      fmData.forms.forEach(function (f, i) {
        H.push(fmCardHtml(f, i));
      });
      body.innerHTML = H.join("");
    }

    function fmCardHtml(f, i) {
      var open = !!fmOpen[i];
      var H = [];
      H.push('<div class="fm-card" data-i="' + i + '">');
      H.push('<div class="fm-card-head" data-act="toggle" data-i="' + i + '">' +
        '<span class="fm-caret">' + (open ? "▾" : "▸") + '</span>' +
        '<span class="fm-name">' + escHtml(f.name || "未命名表单") + '</span>' +
        '<span class="fm-table">' + escHtml(f.table || "") + '</span>' +
        '<span class="fm-badge">字段 ' + (f.fields || []).length + '</span>' +
        '<span class="fm-badge">关系 ' + (f.relations || []).length + '</span>' +
        '<span class="fm-mod">' + escHtml(f.module || "未归模块") + '</span>' +
        '<button class="btn btn-xs" data-act="delForm" data-i="' + i + '">删除</button>' +
        '</div>');
      if (!open) { H.push('</div>'); return H.join(""); }

      H.push('<div class="fm-card-body">');
      if (f.desc) H.push('<div style="font-size:12px;color:var(--ink500);margin-bottom:10px">' + escHtml(f.desc) + '</div>');
      // 字段表
      H.push('<div class="fm-tr fm-th"><span>字段名</span><span>中文名</span><span>类型</span><span>长度</span>' +
        '<span style="text-align:center">必填</span><span style="text-align:center">唯一</span><span>说明</span><span></span></div>');
      (f.fields || []).forEach(function (fd, k) {
        H.push('<div class="fm-tr">' +
          '<input type="text" data-f="name" data-i="' + i + '" data-k="' + k + '" value="' + escHtml(fd.name) + '" placeholder="customer_name">' +
          '<input type="text" data-f="label" data-i="' + i + '" data-k="' + k + '" value="' + escHtml(fd.label) + '" placeholder="客户名称">' +
          '<select data-f="type" data-i="' + i + '" data-k="' + k + '">' + fmTypeOptions(fd.type) + '</select>' +
          '<input type="number" data-f="len" data-i="' + i + '" data-k="' + k + '" value="' + (fd.len == null ? "" : fd.len) + '" placeholder="64">' +
          '<input type="checkbox" data-f="required" data-i="' + i + '" data-k="' + k + '"' + (fd.required ? " checked" : "") + '>' +
          '<input type="checkbox" data-f="unique" data-i="' + i + '" data-k="' + k + '"' + (fd.unique ? " checked" : "") + '>' +
          '<input type="text" data-f="note" data-i="' + i + '" data-k="' + k + '" value="' + escHtml(fd.note) + '" placeholder="说明">' +
          '<button class="fm-x" data-act="delField" data-i="' + i + '" data-k="' + k + '" title="删除字段">✕</button>' +
          '</div>');
      });
      H.push('<button class="fm-add" data-act="addField" data-i="' + i + '">＋ 添加字段</button>');

      // 关系
      H.push('<div class="fm-rel-head">表单之间的关系<span class="fm-badge">' + (f.relations || []).length + ' 条</span></div>');
      (f.relations || []).forEach(function (r, k) {
        H.push('<div class="fm-rel">' +
          '<select data-f="type" data-i="' + i + '" data-k="' + k + '">' +
            fmRelOptions(r.type) + '</select>' +
          '<input type="text" data-f="target" data-i="' + i + '" data-k="' + k + '" value="' + escHtml(r.target) + '" placeholder="目标表单 key / 表名">' +
          '<input type="text" data-f="via" data-i="' + i + '" data-k="' + k + '" value="' + escHtml(r.via) + '" placeholder="外键字段">' +
          '<input type="text" data-f="label" data-i="' + i + '" data-k="' + k + '" value="' + escHtml(r.label) + '" placeholder="业务含义">' +
          '<button class="fm-x" data-act="delRel" data-i="' + i + '" data-k="' + k + '" title="删除关系">✕</button>' +
          '</div>');
      });
      H.push('<button class="fm-add" data-act="addRel" data-i="' + i + '">＋ 添加关系</button>');
      H.push('</div></div>');
      return H.join("");
    }

    function fmTypeOptions(cur) {
      var types = ["bigint", "int", "varchar", "char", "text", "decimal", "datetime", "date", "tinyint", "json"];
      return types.map(function (t) {
        return '<option value="' + t + '"' + (t === cur ? " selected" : "") + '>' + t + '</option>';
      }).join("");
    }
    function fmRelOptions(cur) {
      var types = ["1:1", "1:N", "N:M"];
      return types.map(function (t) {
        return '<option value="' + t + '"' + (t === cur ? " selected" : "") + '>' + t + '</option>';
      }).join("");
    }

    // 编辑：只改内存 + 标记 dirty，绝不重建面板（否则输入框失焦）
    function fmOnEdit(e) {
      var t = e.target;
      if (!t || !t.getAttribute) return;
      var fname = t.getAttribute("data-f");
      if (!fname) return;
      var i = +t.getAttribute("data-i"), k = +t.getAttribute("data-k");
      if (!fmData || !fmData.forms[i]) return;
      var form = fmData.forms[i];
      var isField = t.closest(".fm-tr") && !t.closest(".fm-rel");
      var obj = isField ? (form.fields || [])[k] : (form.relations || [])[k];
      if (!obj) return;
      var val = (t.type === "checkbox") ? !!t.checked : t.value;
      if (fname === "len") val = fmNum(val);
      obj[fname] = val;
      fmDirty = true;
      fmHint("有未保存的修改", true);
      var st = document.getElementById("fmStats");
      if (st) st.textContent = fmStats();
    }

    function fmNeedConfirm(btn) {
      if (btn.getAttribute("data-confirm") === "1") return true;
      btn.setAttribute("data-confirm", "1");
      var old = btn.textContent;
      btn.textContent = "再点一次";
      setTimeout(function () { btn.removeAttribute("data-confirm"); btn.textContent = old; }, 4000);
      return false;
    }

    function fmOnClick(e) {
      var t = e.target;
      var actEl = t && t.closest ? t.closest("[data-act]") : null;
      if (!actEl) return;
      var act = actEl.getAttribute("data-act");
      var i = +actEl.getAttribute("data-i");
      var k = +actEl.getAttribute("data-k");

      if (act === "toggle") {
        fmOpen[i] = !fmOpen[i];
        fmRenderPanel();
        return;
      }
      if (!fmData) return;
      var form = fmData.forms[i];
      if (!form) return;

      if (act === "delForm") {
        if (!fmNeedConfirm(actEl)) return;
        fmData.forms.splice(i, 1);
        fmOpen = {};
        fmDirty = true;
        fmRenderPanel();
        fmHint("已删除 1 张表单，记得保存", true);
      } else if (act === "addField") {
        form.fields = form.fields || [];
        form.fields.push({ name: "", label: "", type: "varchar", len: 64, required: false, unique: false, note: "" });
        fmDirty = true;
        fmRenderPanel();
      } else if (act === "delField") {
        if (!fmNeedConfirm(actEl)) return;
        form.fields.splice(k, 1);
        fmDirty = true;
        fmRenderPanel();
      } else if (act === "addRel") {
        form.relations = form.relations || [];
        form.relations.push({ type: "1:N", target: "", via: "", label: "" });
        fmDirty = true;
        fmRenderPanel();
      } else if (act === "delRel") {
        if (!fmNeedConfirm(actEl)) return;
        form.relations.splice(k, 1);
        fmDirty = true;
        fmRenderPanel();
      }
    }

    function fmRun(prompt) {
      fmBusy = true;

        onDone: function (full) {

      L.push("  不许按 id 实时查 —— 否则改一次价格，历史单据全跟着变。在 note 或 decisions 里写明。");

    function fmParse(full) {
      var t = String(full || "");
      var a = t.indexOf("[[FORMS]]"), b = t.indexOf("[[/FORMS]]");
      var raw = (a >= 0 && b > a) ? t.slice(a + 9, b) : t;
      var i = raw.indexOf("{"), j = raw.lastIndexOf("}");
      if (i < 0 || j <= i) return null;
      var d = null;
      try { d = JSON.parse(raw.slice(i, j + 1)); } catch (e) { return null; }
      if (!d || !Array.isArray(d.forms) || !d.forms.length) return null;
      d.generatedAt = fmNow();
      d.project = currentProject ? currentProject.prjName : "";
      d.flow = currentProject ? (currentProject.prjName + "_flow.json") : "";
      d.version = 1;
      return fmNormalize(d);
    }

    // ---------- 派生 data-model.md（AI 编码每一步第 0 条读它）----------
    function fmToMarkdown() {
      var d = fmData;
      if (!d || !d.forms) return "";
      var L = [];
      var pn = currentProject ? currentProject.prjName : "";
      L.push("# " + pn + " 业务表单（数据模型 · 唯一依据）");
      L.push("");
      L.push("> 本文件由「业务表单」模块从 doc/forms.json 自动生成，不要手改；要改请回 TDev 的「业务表单」页面改。");
      L.push("> 生成时间：" + (d.generatedAt || "") + "；依据流程：" + (d.flow || "") + "。");
      L.push("");
      L.push("## ① 业务对象清单");
      L.push("");
      L.push("| 表单 | 表名 | 所属模块 | 说明 | 字段数 |");
      L.push("|---|---|---|---|---|");
      d.forms.forEach(function (f) {
        L.push("| " + (f.name || "") + " | `" + (f.table || "") + "` | " + (f.module || "-") + " | " +
          String(f.desc || "").replace(/\|/g, "/") + " | " + (f.fields || []).length + " |");
      });
      L.push("");
      L.push("## ② 关系说明");
      L.push("");
      var anyRel = false;
      d.forms.forEach(function (f) {
        (f.relations || []).forEach(function (r) {
          anyRel = true;
          L.push("- `" + (f.table || f.key) + "` " + r.type + " `" + (r.target || "") + "`（外键：" +
            (r.via || "-") + "）—— " + (r.label || ""));
        });
      });
      if (!anyRel) L.push("- （暂无跨表单关系）");
      L.push("");
      L.push("## ③ 每张表的字段");
      d.forms.forEach(function (f) {
        L.push("");
        L.push("### " + (f.name || "") + "（`" + (f.table || "") + "`）" + (f.module ? " · " + f.module : ""));
        L.push("");
        L.push("| 字段名 | 中文名 | 类型 | 必填 | 唯一 | 说明 |");
        L.push("|---|---|---|---|---|---|");
        (f.fields || []).forEach(function (fd) {
          var ty = fd.type || "";
          if (fd.len != null && fd.len !== "") ty += "(" + fd.len + ")";
          L.push("| `" + (fd.name || "") + "` | " + (fd.label || "") + " | " + ty + " | " +
            (fd.required ? "是" : "") + " | " + (fd.unique ? "是" : "") + " | " +
            String(fd.note || "").replace(/\|/g, "/") + " |");
        });
      });
      L.push("");
      L.push("## ④ 关键设计决策");
      L.push("");
      if ((d.decisions || []).length) {
        d.decisions.forEach(function (x, i) {
          L.push((i + 1) + ". **" + (x.q || "") + "** → " + (x.choice || "") + "（" + (x.why || "") + "）");
        });
      } else {
        L.push("（暂无）");
      }
      L.push("");
      L.push("---");
      L.push("四条铁律：每张表含 `id / created_at / created_by / org_id`；跨表关系必须写外键落点；");
      L.push("对外单据（目录册/报价单/订单）用复制快照而不是按 id 实时查；字段命名与上表逐字一致。");
      return L.join("\n") + "\n";
    }

    function procStartWatch() {
      // 监测 doc 目录 JSON 文件变化：每 2 秒检查一次，有新文件/变更自动加载
      if (procWatchTimer) clearInterval(procWatchTimer);
      if (!currentProject || !window.__TAURI__ || !window.__TAURI__.core) return;
      window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function(v){
        var ws = "";
        try { ws = JSON.parse(v || "{}").path || ""; } catch(e) {}
        if (!ws) return;
        procWatchTimer = setInterval(function(){
          window.__TAURI__.core.invoke("process_list", {
            prjName: currentProject.prjName,
            workspace: ws
          }).then(function(files){
            if (!files || !files.length) { procLastFiles = []; return; }
            var sig = files.join(",");
            if (procLastFiles !== null && sig !== procLastFiles) {
              // 文件列表变化 → 自动加载最新 JSON
              procLastFiles = sig;
              procAddSys("检测到流程文档更新，自动加载：" + (files[0] || "").split("|")[0]);
              procLoadLatest(ws, files);
            }
            if (procLastFiles === null) procLastFiles = sig;
          }).catch(function(){});
        }, 2000);
      });

        prjName: currentProject.prjName,

          "JSON 格式严格为：{" + q + "flow_name" + q + ":流程名称," + q + "steps" + q + ":[{" + q + "name" + q + ":主流程节点1," + q + "children" + q + ":[{" + q + "name" + q + ":子流程节点a," + q + "children" + q + ":[{" + q + "name" + q + ":三级节点," + q + "children" + q + ":[]}]}]}]}。" +
          "主流程节点从上到下排列（steps 数组顺序即主流程顺序）；children 数组每个元素是对象 {name, children}，无下级则 children 为空数组；支持无限层级嵌套。" +
          "当前已有流程文件内容（未修改的节点必须原样保留，只按用户要求增删改指定节点，禁止丢失或改写其他节点）：" +
          (currentJson ? currentJson : "（无）") +
          "。用户要求：" + text + "。写完文件后回复：已生成";
          // 统一组件：场景 process（业务流程梳理，禁止改源码/主题）
          agentRun("process", prompt, {
            onDone: function () { modSet("process", true); },
            onError: function (msg) { procAddSys("梳理失败：" + msg); }
          }).catch(function () {});
        });
      });
    }

    function procSaveFlowJson(reply) {
      // 解析 JSON 并保存到项目 doc 目录
      var json = null;
      var m = reply.match(/\{[\s\S]*\}/);
      if (m) {
        try { json = JSON.parse(m[0]); } catch(e) {}
      }
      if (!json || !json.steps) {
        procAddSys("无法解析为结构化流程，已保存原始描述");
        procSaveRaw(reply);
        return;
      }
      procFlow = json;
      procExpanded = {};
      // 默认展开第一个有子流程的节点（递归第一层）
      for (var i = 0; i < json.steps.length; i++) {
        var kids = json.steps[i].children || [];
        if (kids.length) {
          procExpanded[String(i)] = true;
          break;
        }
      }
      procRenderFlow();
      procSave();
    }

    function procParseFlow(reply) {
      var json = null;
      var m = reply.match(/\{[\s\S]*\}/);
      if (m) {
        try { json = JSON.parse(m[0]); } catch(e) {}
      }
      if (!json || !json.steps) {
        procAddSys("无法解析为结构化流程，已保存原始描述到 doc 目录");
        procSaveRaw(reply);
        return;
      }
      procFlow = json;
      procExpanded = {};
      for (var i = 0; i < json.steps.length; i++) {
        if (json.steps[i].children && json.steps[i].children.length) {
          procExpanded[i] = true;
          break;
        }
      }
      procRenderFlow();
      procSave();
    }

    // ===== 节点增删操作 =====
    function procNewNode(name) {
      return { name: name || "新节点", children: [] };
    }

    function procAddBefore(path) {
      if (!procFlow) return;
      var loc = procLocate(procFlow, path);
      if (!loc) return;
      var node = procNewNode("新前置节点");
      loc.parent.splice(loc.index, 0, node);
      // 同级插入后，后续兄弟展开状态 +1，源节点展开迁移到新位置
      var isRoot = loc.parent === procFlow.steps;
      var prefix = isRoot ? "" : procPathOfParent(procFlow, loc);
      procShiftExpanded(prefix, loc.index, 1);
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已增加前置节点（" + path + " 前）");
    }

    function procAddAfter(path) {
      if (!procFlow) return;
      var loc = procLocate(procFlow, path);
      if (!loc) return;
      var node = procNewNode("新后置节点");
      loc.parent.splice(loc.index + 1, 0, node);
      var isRoot = loc.parent === procFlow.steps;
      var prefix = isRoot ? "" : procPathOfParent(procFlow, loc);
      procShiftExpanded(prefix, loc.index + 1, 1);
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已增加后置节点（" + path + " 后）");
    }

    function procAddChild(path) {
      if (!procFlow) return;
      var loc = procLocate(procFlow, path);
      if (!loc) return;
      var pnode = loc.parent[loc.index];
      if (!pnode.children) pnode.children = [];
      var node = procNewNode("新子节点");
      pnode.children.push(node);
      // 展开父节点让新子节点可见
      procExpanded[path] = true;
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已增加子节点（" + path + " 末尾）");
    }

    function procDeleteNode(path) {
      if (!procFlow) return;
      var loc = procLocate(procFlow, path);
      if (!loc) return;
      var node = loc.parent[loc.index];
      if (!window.confirm("确定删除节点「" + (node.name || path) + "」及其所有子节点？")) return;
      loc.parent.splice(loc.index, 1);
      // 删除后续兄弟展开状态 -1
      var isRoot = loc.parent === procFlow.steps;
      var prefix = isRoot ? "" : procPathOfParent(procFlow, loc);
      procShiftExpanded(prefix, loc.index, -1);
      // 删除该节点及其子树的展开状态
      Object.keys(procExpanded).forEach(function(k){
        if (k === path || k.indexOf(path + ".") === 0) delete procExpanded[k];
      });
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已删除节点：" + (node.name || path));
    }

    // 找父数组对应的路径前缀（用于兄弟迁移）；根 steps 返回 ""
    function procPathOfParent(root, loc) {
      if (loc.parent === root.steps) return "";
      var found = null;
      (function walk(nodes, prefix){
        nodes.forEach(function(n, i){
          if (n.children === loc.parent) { found = prefix + "." + i; return; }
          if (n.children) walk(n.children, prefix + "." + i);
        });
      })(root.steps, "");
      return found || "";
    }

    // 把 prefix 下 index >= fromIndex 的展开状态路径整体平移 delta
    function procShiftExpanded(prefix, fromIndex, delta) {
      var updates = [];
      Object.keys(procExpanded).forEach(function(k){
        var rest = prefix ? (k.indexOf(prefix + ".") === 0 ? k.slice(prefix.length + 1) : null) : k;
        if (rest === null) return;
        var parts = rest.split(".");
        var idx = parseInt(parts[0]);
        if (!isNaN(idx) && idx >= fromIndex) {
          parts[0] = String(idx + delta);
          updates.push([k, prefix ? prefix + "." + parts.join(".") : parts.join(".")]);
        }
      });
      updates.forEach(function(u){
        procExpanded[u[1]] = procExpanded[u[0]];
        delete procExpanded[u[0]];
      });
    }

    // 迁移展开状态：srcPath 及其子树 -> newPath 及其子树
    function procMigrateExpanded(srcPath, newPath) {
      var keys = Object.keys(procExpanded);
      keys.forEach(function(k){
        if (k === srcPath || k.indexOf(srcPath + ".") === 0) {
          var suffix = k === srcPath ? "" : k.slice(srcPath.length);
          procExpanded[newPath + suffix] = procExpanded[k];
          delete procExpanded[k];
        }
      });
    }

    function procRenderFlow() {
      var body = document.getElementById("procCanvasBody");
      var name = document.getElementById("procFlowName");
      if (!body || !procFlow) return;
      name.textContent = procFlow.flow_name || "业务流程图";
      var html = '<div class="proc-flow">';
      procFlow.steps.forEach(function(step, i) {
        html += procRenderNode(step, String(i), true);
        if (i < procFlow.steps.length - 1) {
          html += '<div class="proc-drop-slot" data-before="' + (i + 1) + '"><div class="proc-main-arrow">↓</div></div>';
        }
      });
      html += '</div>';
      body.innerHTML = html;
      // 事件委托：点击节点切换展开/收起
      Array.prototype.forEach.call(body.querySelectorAll(".proc-main-node, .proc-sub-node"), function(el){
        el.addEventListener("click", function(e){
          if (e.target.closest(".proc-node-flag")) return; // 点属性图标不展开
          var p = el.getAttribute("data-path");
          if (p) procToggle(p);
        });
      });
      // 属性图标点击：弹属性编辑窗口
      Array.prototype.forEach.call(body.querySelectorAll(".proc-node-flag"), function(el){
        el.addEventListener("click", function(e){
          e.stopPropagation();
          var p = el.getAttribute("data-prop");
          if (p) procEditProps(p);
        });
      });
      // 鼠标事件自定义拖拽（WebView2 中 HTML5 DnD 不可靠）
      var dragState = null;
      var procDragJustMoved = false;
      function clearDragHighlights(){
        var b2 = document.getElementById("procCanvasBody");
        if (!b2) return;
        b2.querySelectorAll(".drag-target").forEach(function(x){ x.classList.remove("drag-target"); });
        b2.querySelectorAll(".proc-drop-slot.drag-over").forEach(function(x){ x.classList.remove("drag-over"); });
      }
      Array.prototype.forEach.call(body.querySelectorAll(".proc-main-node, .proc-sub-node"), function(el){
        el.addEventListener("mousedown", function(e){
          if (e.button !== 0) return;
          if (e.target.closest(".proc-node-flag")) return; // 属性图标不拖拽
          var path = el.getAttribute("data-path");
          dragState = { srcPath: path, startX: e.clientX, startY: e.clientY, moved: false };
          el.style.opacity = "0.6";
          // 创建拖拽虚影（接近透明的节点副本，跟随鼠标）
          var ghost = el.cloneNode(true);
          ghost.id = "procDragGhost";
          ghost.style.position = "fixed";
          ghost.style.left = (e.clientX - 40) + "px";
          ghost.style.top = (e.clientY - 20) + "px";
          ghost.style.opacity = "0.55";
          ghost.style.pointerEvents = "none";
          ghost.style.zIndex = "999";
          ghost.style.boxShadow = "0 8px 24px rgba(16,42,67,.3)";
          // 虚影内按钮不显示
          var gops = ghost.querySelector(".proc-node-ops");
          if (gops) gops.style.opacity = "0";
          document.body.appendChild(ghost);
          dragState.ghost = ghost;
          e.preventDefault();
        });
      });
      document.addEventListener("mousemove", function(e){
        if (!dragState) return;
        if (!dragState.moved && Math.abs(e.clientX - dragState.startX) + Math.abs(e.clientY - dragState.startY) > 6) {
          dragState.moved = true;
        }
        if (!dragState.moved) return;
        // 虚影跟随鼠标
        if (dragState.ghost) {
          dragState.ghost.style.left = (e.clientX - 40) + "px";
          dragState.ghost.style.top = (e.clientY - 20) + "px";
        }
        var el = document.elementFromPoint(e.clientX, e.clientY);
        clearDragHighlights();
        if (!el) return;
        var nodeEl = el.closest(".proc-main-node, .proc-sub-node");
        var slotEl = el.closest(".proc-drop-slot");
        if (nodeEl) nodeEl.classList.add("drag-target");
        else if (slotEl) slotEl.classList.add("drag-over");
      });
      document.addEventListener("mouseup", function(e){
        if (!dragState) return;
        var src = dragState.srcPath;
        var moved = dragState.moved;
        var el = document.elementFromPoint(e.clientX, e.clientY);
        // 移除虚影
        if (dragState.ghost && dragState.ghost.parentNode) {
          dragState.ghost.parentNode.removeChild(dragState.ghost);
        }
        dragState = null;
        clearDragHighlights();
        var srcEl = document.querySelector('[data-path="' + src + '"]');
        if (srcEl) srcEl.style.opacity = "";
        if (!moved || !el) return;
        var nodeEl = el.closest(".proc-main-node, .proc-sub-node");
        var slotEl = el.closest(".proc-drop-slot");
        if (nodeEl) {
          var dst = nodeEl.getAttribute("data-path");
          if (src !== dst) {
            procDragJustMoved = true;
            procMoveNode(src, dst, "child");
          }
        } else if (slotEl) {
          var before = slotEl.getAttribute("data-before");
          procDragJustMoved = true;
          procMoveNode(src, before, "before");
        }
      });
      // 拖拽后不触发展开
      Array.prototype.forEach.call(body.querySelectorAll(".proc-main-node, .proc-sub-node"), function(el){
        el.addEventListener("click", function(e){
          if (procDragJustMoved) { procDragJustMoved = false; return; }
        });
      });
      // 节点操作按钮（前置/后置/子节点/删除）
      Array.prototype.forEach.call(body.querySelectorAll(".proc-op"), function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          var op = btn.getAttribute("data-op");
          var target = btn.getAttribute("data-opath");
          if (op === "before") procAddBefore(target);
          else if (op === "after") procAddAfter(target);
          else if (op === "child") procAddChild(target);
          else if (op === "delete") procDeleteNode(target);
        });
      });
    }

    // 递归渲染节点（支持无限层级）：path 如 "0" / "0.1" / "0.1.2"
    function procRenderNode(node, path, isMain) {
      var expanded = !!procExpanded[path];
      var kids = node.children || [];
      var hasKids = kids.length > 0;
      var numLabel = isMain ? (parseInt(path) + 1) : path.split(".").map(function(n){ return parseInt(n) + 1; }).join(".");
      var hasProps = node.props && (node.props.formName || node.props.indexField || node.props.input || node.props.logic || node.props.output);
      var html = '<div class="proc-row">';
      html += '<div class="proc-node-col' + (isMain ? ' main' : '') + '">';
      html += '<div class="' + (isMain ? 'proc-main-node' : 'proc-sub-node') + (expanded ? ' expanded' : '') + (hasProps ? ' has-props' : '') + '" draggable="true" data-path=' + String.fromCharCode(34) + path + String.fromCharCode(34) + '>' +
        '<div class="proc-node-num">' + numLabel + '</div>' +
        '<div class="proc-node-name">' + escHtml(node.name) + '</div>' +
        (hasKids ? '<div class="proc-node-more">' + (expanded ? "-" : "+") + '</div>' : '') +
        (hasProps ? '<div class="proc-node-flag" title="已配置属性" data-prop="' + path + '">●</div>' : '<div class="proc-node-flag" data-prop="' + path + '">○</div>') +
        '<div class="proc-node-ops">' +
          '<button class="proc-op" data-op="before" data-opath="' + path + '" title="增加前置节点（同级）">前+</button>' +
          '<button class="proc-op" data-op="after" data-opath="' + path + '" title="增加后置节点（同级）">后+</button>' +
          '<button class="proc-op" data-op="child" data-opath="' + path + '" title="增加子节点（下一级，追加末尾）">子+</button>' +
          '<button class="proc-op proc-op-del" data-op="delete" data-opath="' + path + '" title="删除该节点及所有子节点">✕</button>' +
        '</div>' +
        '</div>';
      html += '</div>';
      if (expanded && hasKids) {
        html += '<div class="proc-branch">';
        html += '<div class="proc-branch-link"></div>';
        html += '<div class="proc-branch-col">';
        kids.forEach(function(kid, j) {
          // 每个子节点前放插入槽位（拖到此 = 插入到该子节点之前）
          html += '<div class="proc-drop-slot proc-child-slot" data-before="' + path + "." + j + '"><div class="proc-child-arrow">↕</div></div>';
          // 兼容旧格式：字符串子节点转为对象
          if (typeof kid === "string") kid = { name: kid, children: [] };
          html += procRenderNode(kid, path + "." + j, false);
        });
        html += '</div>';
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function procToggle(path) {
      procExpanded[path] = !procExpanded[path];
      procRenderFlow();
    }

    // 展开全部：遍历树，所有有 children 的节点都展开
    function procExpandAll() {
      if (!procFlow) return;
      procExpanded = {};
      (function walk(nodes, prefix){
        nodes.forEach(function(n, i){
          var p = prefix ? (prefix + "." + i) : String(i);
          if (n.children && n.children.length) {
            procExpanded[p] = true;
            walk(n.children, p);
          }
        });
      })(procFlow.steps, "");
      procRenderFlow();
    }

    // 折叠全部
    function procCollapseAll() {
      procExpanded = {};
      procRenderFlow();
    }

    // ===== 载入备份弹窗 =====

    // ===== 节点拖拽移动 =====
    // 返回 {parent: 数组, index: 索引} 定位节点
    function procLocate(root, path) {
      var parts = path.split(".");
      var arr = root.steps;
      for (var i = 0; i < parts.length; i++) {
        var idx = parseInt(parts[i]);
        if (idx >= arr.length) return null;
        if (i === parts.length - 1) return { parent: arr, index: idx };
        var node = arr[idx];
        arr = node.children || [];
      }
      return null;
    }

    function procMoveNode(srcPath, dstKey, mode) {
      if (!procFlow) return;
      // 不能移动到自己内部
      if (dstKey === srcPath) return;
      if (dstKey.indexOf(srcPath + ".") === 0) return; // 目标在自己子树内，禁止
      var srcLoc = procLocate(procFlow, srcPath);
      if (!srcLoc) return;
      // 提取节点（含子树）
      var node = srcLoc.parent[srcLoc.index];
      srcLoc.parent.splice(srcLoc.index, 1);

      var ok = false;
      if (mode === "child") {
        // 拖到节点上：成为该节点子节点
        var dstLoc = procLocate(procFlow, dstKey);
        if (dstLoc) {
          var dnode = dstLoc.parent[dstLoc.index];
          if (!dnode.children) dnode.children = [];
          dnode.children.push(node);
          ok = true;
        }
      } else if (mode === "before") {
        // 拖到槽位：插入到指定节点之前（任意层级，路径定位）
        var dstLoc = procLocate(procFlow, dstKey);
        if (dstLoc) {
          dstLoc.parent.splice(dstLoc.index, 0, node);
          ok = true;
        }
      }
      if (!ok) {
        // 失败回退：放回原位置
        srcLoc.parent.splice(Math.min(srcLoc.index, srcLoc.parent.length), 0, node);
        return;
      }
      // 迁移被移动节点的展开状态到新路径（其他节点展开状态保持不变）
      var newPath = "";
      if (mode === "child") {
        var dl = procLocate(procFlow, dstKey);
        if (dl) newPath = dstKey + "." + (dl.parent[dl.index].children.length - 1);
        if (newPath) procMigrateExpanded(srcPath, newPath);
      } else {
        // before：目标节点及其后兄弟路径 +1，源迁移到目标位置
        var dstLoc2 = procLocate(procFlow, dstKey);
        if (dstLoc2) {
          var parentArr = dstLoc2.parent;
          var isRoot = parentArr === procFlow.steps;
          var prefix = isRoot ? "" : procPathOfParent(procFlow, dstLoc2);
          procShiftExpanded(prefix, dstLoc2.index, 1);
        }
        newPath = dstKey;
        procMigrateExpanded(srcPath, newPath);
      }
      // 重新编号（渲染按路径自动生成）+ 保存
      procRenderFlow();
      procSaveFlowDoc();
      procAddSys("已移动节点：" + (node.name || srcPath) + " → " + dstKey);
    }

    // ===== 流程节点属性编辑 =====
    var procFormList = [];   // 项目已有的表单名
    var procFieldList = [];  // 项目已有的索引字段

    function procFindNodeByPath(root, path) {
      var parts = path.split(".");
      var cur = root;
      for (var i = 0; i < parts.length; i++) {
        if (!cur) return null;
        var idx = parseInt(parts[i]);
        var kids = cur.children || [];
        if (i === 0) {
          if (idx >= cur.steps.length) return null;
          cur = cur.steps[idx];
        } else {
          if (idx >= kids.length) return null;
          cur = kids[idx];
        }
      }
      return cur;
    }

    function procCollectForms() {
      // 遍历流程所有节点收集表单名/索引字段
      procFormList = [];
      procFieldList = [];
      if (!procFlow) return;
      (function walk(nodes, isRoot) {
        var arr = isRoot ? nodes : (nodes.children || []);
        arr.forEach(function(n){
          if (n.props) {
            if (n.props.formName && procFormList.indexOf(n.props.formName) < 0) procFormList.push(n.props.formName);
            if (n.props.indexField && procFieldList.indexOf(n.props.indexField) < 0) procFieldList.push(n.props.indexField);
          }
          if (n.children) walk(n, false);
        });
      })(procFlow.steps, true);
    }

        });
