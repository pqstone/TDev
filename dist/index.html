<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TDev</title>
  <style>
    /* ===== tokens（承接 theme/tokens.json · 北极冰山·深邃蓝） ===== */
    :root {
      --p900:#072B4E; --p700:#0A4D8C; --p500:#1A6CB3; --p300:#5C9FD6; --p100:#C9E2F5; --p050:#E8F3FB;
      --ink900:#102A43; --ink700:#334E68; --ink500:#627D98; --ink300:#9FB3C8; --line300:#D2E0EC;
      --bg:#F4F8FC; --surface:#FFFFFF; --sunken:#EAF2FA;
      --success:#2E9E6B; --warning:#D9822B; --danger:#D64545;
      --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px;
      --sh-sm:0 1px 2px rgba(7,43,78,.08); --sh-md:0 2px 8px rgba(7,43,78,.10); --sh-lg:0 8px 24px rgba(7,43,78,.16);
      --ease:cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
      background:var(--bg); color:var(--ink900);
      display:flex; flex-direction:column; height:100vh; overflow:hidden;
    }
    /* ===== 顶部标题栏 ===== */
    .topbar {
      height:56px; flex:none; background:var(--surface); border-bottom:1px solid var(--line300);
      display:flex; align-items:center; padding:0 20px; gap:12px;
    }
    .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; color:var(--p700); }
    .brand .mark { width:14px; height:14px; border-radius:4px; background:linear-gradient(135deg,var(--p700),var(--p300)); }
    .topbar .right { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:13px; color:var(--ink500); }
    .lang-sel { height:26px; padding:0 6px; border:1px solid var(--line300); border-radius:var(--r-md); background:var(--surface); color:var(--ink700); font-size:12px; font-family:inherit; cursor:pointer; }
    .lang-sel:focus { outline:none; border-color:var(--p500); }
    /* ===== 中部主功能区 ===== */
    .main { flex:1; display:flex; min-height:0; }
    /* 左侧功能导航菜单栏 */
    .menu {
      width:240px; flex:none; background:var(--surface); border-right:1px solid var(--line300);
      padding:16px 12px; overflow-y:auto;
    }
    .menu .menu-title { font-size:12px; color:var(--ink500); letter-spacing:.5px; padding:0 8px 10px; }
    .menu .mi {
      display:flex; align-items:center; gap:10px; padding:12px 12px; border-radius:var(--r-md);
      font-size:14px; color:var(--ink700); cursor:pointer; transition:background .15s var(--ease),color .15s var(--ease);
      position:relative; user-select:none;
    }
    .menu .mi:hover { background:var(--p050); }
    .menu .mi.active { background:var(--p050); color:var(--p700); font-weight:600; }
    .menu .mi.active::before { content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:2px; background:var(--p700); }
    .menu .mi svg { width:20px; height:20px; flex:none; stroke-width:1.5; }
    .mi-dot { width:8px; height:8px; border-radius:50%; background:transparent; flex:none; margin-left:auto; transition:background .2s; }
    .mi-dot.on { background:#2e9e6b; box-shadow:0 0 4px rgba(46,158,107,.6); }
    /* 右侧功能展示、操作区 */
    .content { flex:1; overflow-y:auto; padding:24px; }
    /* 连接测试 + 记忆测试双面板同屏，外层允许滚动（矮屏不至于被裁掉下半页） */
    .content.chat-page { overflow-y:auto; padding-bottom:12px; }
    .content.theme-page { overflow:hidden; padding-bottom:12px; }
    .content.constr-page { overflow:hidden; padding-bottom:12px; }
    .content.process-page { overflow:hidden; padding-bottom:12px; }
    .page-title { font-size:24px; font-weight:600; margin-bottom:4px; }
    .page-sub { font-size:14px; color:var(--ink500); margin-bottom:24px; }
    .panel { background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); box-shadow:var(--sh-sm); padding:24px; }
    .panel h4 { font-size:20px; font-weight:600; margin-bottom:12px; }
    .panel p { font-size:14px; color:var(--ink700); line-height:1.6; margin-bottom:8px; }
    .ph { height:10px; border-radius:var(--r-sm); background:var(--p050); margin-bottom:8px; }
    .ph.short { width:70%; }
    .ph.xs { width:40%; }
    /* ===== 底部标题栏（状态栏） ===== */
    .bottombar {
      height:32px; flex:none; background:var(--surface); border-top:1px solid var(--line300);
      display:flex; align-items:center; padding:0 20px; gap:20px; font-size:12px; color:var(--ink500);
    }
    .bottombar .r { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--success); }
    /* ===== 项目下拉条 ===== */
    .proj-bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    .proj-sel {
      flex:1; height:32px; padding:0 10px; border:1px solid var(--line300); border-radius:var(--r-md);
      font-size:13px; font-family:inherit; color:var(--ink900); background:var(--surface);
    }
    .proj-sel:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.25); }
    .proj-add {
      width:32px; height:32px; flex:none; border:none; border-radius:var(--r-md); background:var(--p700); color:#fff;
      font-size:20px; line-height:1; cursor:pointer; transition:background .15s var(--ease);
    }
    .proj-add:hover { background:var(--p900); }
    /* ===== 模态框 ===== */
    .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(16,42,67,.45); z-index:50; }
    .modal.show { display:flex; }
    .modal-box { width:440px; background:var(--surface); border-radius:var(--r-xl); box-shadow:var(--sh-lg); padding:24px; }
    .modal-box h4 { font-size:20px; font-weight:600; margin-bottom:16px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:13px; color:var(--ink700); margin-bottom:6px; font-weight:600; }
    .field input, .field select, .field textarea {
      width:100%; padding:8px 10px; border:1px solid var(--line300); border-radius:var(--r-md);
      font-size:14px; font-family:inherit; color:var(--ink900); background:var(--surface);
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.25); }
    .field textarea { resize:vertical; min-height:64px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:12px; margin-top:20px; }
    .btn { border:none; border-radius:var(--r-md); font-size:14px; cursor:pointer; padding:0 16px; height:32px; transition:background .15s var(--ease); }
    .btn-primary { background:var(--p700); color:#fff; }
    .btn-primary:hover { background:var(--p900); }
    .btn-secondary { background:var(--surface); color:var(--ink900); border:1px solid var(--line300); }
    .btn-secondary:hover { border-color:var(--p500); color:var(--p500); }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-danger:hover { background:#b93a3a; }
    /* 基础信息面板 */
    .info-grid { display:flex; flex-direction:column; gap:0; border:1px solid var(--line300); border-radius:var(--r-lg); overflow:hidden; }
    .info-row { display:flex; padding:12px 16px; border-bottom:1px solid var(--line300); font-size:14px; }
    .info-row:last-child { border-bottom:none; }
    .info-row:nth-child(even) { background:var(--bg); }
    .info-label { width:140px; flex:none; color:var(--ink500); font-weight:600; }
    .info-value { flex:1; color:var(--ink900); }
    .info-value.mono { font-family:Consolas,monospace; font-size:13px; color:var(--p700); }
    .info-actions { display:flex; justify-content:flex-end; margin-top:20px; }
    /* 项目空间 */
    .ws-row { display:flex; gap:8px; align-items:center; }
    .ws-input { flex:1; height:32px; padding:0 10px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:14px; font-family:inherit; color:var(--ink900); background:var(--surface); }
    .ws-input:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.25); }
    /* 配置网格（模型 / Agent 表单） */
    .cfg-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
    .cfg-grid .field { margin-bottom:14px; }
    /* 已配置条目 */
    .cfg-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line300); border-radius:var(--r-md); margin-bottom:8px; background:var(--surface); }
    .cfg-item-main { flex:1; min-width:0; }
    .cfg-item-name { display:block; font-size:14px; font-weight:600; color:var(--ink900); }
    .cfg-item-sub { display:block; font-size:12px; color:var(--ink500); margin-top:2px; word-break:break-all; }
    .cfg-item-key { display:block; font-size:12px; color:var(--p700); margin-top:2px; font-family:Consolas,monospace; }
    /* ===== 部署发布：服务器 ===== */
    .dep-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .dep-head h4 { margin:0; }
    .dep-item { display:flex; align-items:flex-start; gap:16px; padding:14px 16px; border:1px solid var(--line300); border-radius:var(--r-md); margin-bottom:8px; background:var(--surface); }
    .dep-main { flex:1; min-width:0; }
    .dep-name { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--ink900); }
    .dep-meta { display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:4px; font-size:12px; color:var(--ink500); }
    .dep-actions { display:flex; gap:8px; flex:none; padding-top:2px; }
    .dep-test { font-size:12px; margin-top:4px; min-height:16px; }
    .dep-test.ok { color:var(--success); }
    .dep-test.fail { color:var(--danger); }
    .os-badge { font-size:11px; font-weight:400; padding:1px 8px; border-radius:10px; border:1px solid var(--line300); background:var(--bg); color:var(--ink700); }
    .os-badge.linux { color:var(--success); border-color:#BFE3D2; background:#EEF8F3; }
    .os-badge.windows { color:var(--p700); border-color:var(--p100); background:var(--p050); }
    .dep-empty { text-align:center; color:var(--ink500); font-size:13px; line-height:1.9; padding:32px 16px; }
    .dep-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
    .dep-note { font-size:12px; color:var(--ink500); margin-top:2px; }
    .dep-hint { font-size:12px; color:var(--ink500); }
    .dep-steps { display:flex; gap:8px; margin-bottom:12px; }
    .dep-step { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink500); padding:6px 12px; border:1px solid var(--line300); border-radius:12px; background:var(--bg); }
    .dep-dot { width:8px; height:8px; border-radius:50%; background:var(--line300); }
    .dep-step.active { color:var(--p700); border-color:var(--p300); background:var(--p050); }
    .dep-step.active .dep-dot { background:var(--p500); }
    .dep-step.done { color:var(--success); border-color:#BFE3D2; background:#EEF8F3; }
    .dep-step.done .dep-dot { background:var(--success); }
    .dep-step.fail { color:var(--danger); border-color:#F3C7C7; background:#FCEFEF; }
    .dep-step.fail .dep-dot { background:var(--danger); }
    .dep-log { background:#0F2233; color:#C9E2F5; font-family:Consolas,monospace; font-size:12px; line-height:1.7; border-radius:var(--r-md); padding:12px 14px; height:240px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
    .dep-rel { display:flex; align-items:center; gap:12px; padding:10px 14px; border:1px solid var(--line300); border-radius:var(--r-md); margin-bottom:8px; cursor:pointer; }
    .dep-rel:hover { background:var(--p050); }
    .dep-rel-main { flex:1; min-width:0; font-size:13px; color:var(--ink900); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dep-rel-meta { font-size:12px; color:var(--ink500); flex:none; }
    .dep-badge { font-size:11px; padding:1px 8px; border-radius:10px; flex:none; }
    .dep-badge.ok { color:var(--success); background:#EEF8F3; border:1px solid #BFE3D2; }
    .dep-badge.fail { color:var(--danger); background:#FCEFEF; border:1px solid #F3C7C7; }
    .dep-badge.run { color:var(--p700); background:var(--p050); border:1px solid var(--p100); }
    .dep-ai-msgs { margin-top:12px; display:flex; flex-direction:column; gap:10px; max-height:460px; overflow-y:auto; }
    .dep-ai-msgs:empty { display:none; }
    .dep-chat-panel { padding:0; overflow:hidden; }
    .dep-chat-panel .ui-chat { height:520px; border:none; border-radius:0; }
    .dep-chat-panel .ai-tool-body { max-height:180px; }
    .dep-srv-pick { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:400; color:var(--ink500); }
    .dep-srv-pick select { height:28px; padding:0 8px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:12px; background:var(--surface); color:var(--ink900); font-family:inherit; }
    .btn-sm { height:24px; padding:0 12px; font-size:12px; }
    /* 新增项目进度框 */
    .proj-progress {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      width:420px; background:var(--surface); border-radius:var(--r-xl);
      box-shadow:var(--sh-lg); border:1px solid var(--line300);
      padding:20px 24px; z-index:100; display:none;
    }
    .proj-progress.show { display:block; }
    .prog-title { font-size:15px; font-weight:600; color:var(--ink900); margin-bottom:14px; }
    .prog-list { display:flex; flex-direction:column; gap:8px; }
    .prog-step { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bg); border-radius:var(--r-md); font-size:13px; color:var(--ink700); }
    .prog-dot { width:18px; height:18px; flex:none; border-radius:50%; background:var(--p300); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; }
    .prog-step.ok .prog-dot { background:var(--success); }
    .prog-step.fail .prog-dot { background:var(--danger); }
    .prog-step.fail { color:var(--danger); }
    /* ===== 聊天界面（QQ 风格） ===== */
    .chat-panel { display:flex; flex-direction:column; height:calc(100vh - 225px); min-height:380px; background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); overflow:hidden; }
    .chat-head { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--line300); }
    .chat-agent-label { font-size:13px; color:var(--ink700); font-weight:600; }
    .chat-sel { height:28px; padding:0 8px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:12px; color:var(--ink900); background:var(--surface); min-width:160px; max-width:280px; }
    .chat-status { font-size:12px; padding:2px 10px; border-radius:10px; font-weight:600; }
    .chat-status.on { background:rgba(46,158,107,.15); color:#1e7a52; }
    .chat-status.off { background:rgba(214,69,69,.12); color:#b03a3a; }
    .chat-status.pending { background:rgba(217,130,43,.15); color:#a4651a; }
    .chat-msg-list { flex:1; overflow-y:auto; padding:16px; background:var(--bg); display:flex; flex-direction:column; gap:10px; }
    .chat-row { display:flex; }
    .chat-row.me { justify-content:flex-end; }
    .chat-row.agent { justify-content:flex-start; }
    .chat-bubble { max-width:70%; padding:9px 14px; border-radius:12px; font-size:14px; line-height:1.5; word-break:break-word; }
    .chat-row.me .chat-bubble { background:var(--p700); color:#fff; border-bottom-right-radius:4px; }
    .chat-row.agent .chat-bubble { background:var(--surface); color:var(--ink900); border:1px solid var(--line300); border-bottom-left-radius:4px; }
    .chat-bubble-wrap { max-width:78%; display:flex; flex-direction:column; gap:4px; }
    .chat-thinking-box { background:var(--bg); border:1px dashed var(--line300); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--ink500); max-height:160px; overflow-y:auto; }
    .chat-think-label { font-size:11px; color:var(--p500); font-weight:600; margin-bottom:4px; }
    .chat-think-text { white-space:pre-wrap; word-break:break-word; line-height:1.5; color:var(--ink600); }
    .chat-reply { white-space:pre-wrap; }
    .chat-sys { text-align:center; font-size:12px; color:var(--ink500); padding:4px 0; }
    .chat-msg { display:flex; }
    .chat-msg.me { justify-content:flex-end; }
    .chat-msg.bot { justify-content:flex-start; }
    .chat-msg .chat-bubble { background:var(--surface); color:var(--ink900); border:1px solid var(--line300); border-bottom-left-radius:4px; max-width:78%; }
    .chat-msg.me .chat-bubble { background:var(--p700); color:#fff; border:1px solid transparent; border-bottom-right-radius:4px; }
    .chat-input-row { display:flex; gap:10px; padding:12px 16px; background:var(--surface); border-top:1px solid var(--line300); }
    .chat-input { flex:1; min-height:36px; padding:0 14px; border:1px solid var(--line300); border-radius:var(--r-md); font-size:14px; font-family:inherit; color:var(--ink900); background:var(--surface); }
    textarea.chat-input { padding:8px 14px; line-height:1.5; resize:none; max-height:120px; overflow-y:auto; }
    .chat-input:focus { outline:none; border-color:var(--p500); box-shadow:0 0 0 2px rgba(26,108,179,.25); }
    /* ===== Agent 连接测试 / 记忆测试：同页双面板 ===== */
    .chat-panel.is-half { height:calc(50vh - 150px); min-height:300px; }
    .chat-panel.is-half + .chat-panel.is-half { margin-top:16px; }
    .mem-head-title { font-size:13px; font-weight:600; color:var(--ink900); }
    .mem-badge { font-size:11px; padding:2px 8px; border-radius:10px; background:rgba(26,108,179,.12); color:var(--p700); font-weight:600; }
    .mem-sid { font-size:11px; color:var(--ink500); font-family:Consolas,monospace; }
    .mem-note { font-size:11px; color:var(--ink500); line-height:1.5; padding:6px 16px; background:var(--surface); border-bottom:1px solid var(--line300); }
    /* ===== 主题风格页 ===== */
    .theme-panel { display:flex; flex-direction:column; gap:16px; max-width:1204px; height:calc(100vh - 190px); min-height:440px; background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); padding:24px; overflow:hidden; }
    .theme-row { display:flex; align-items:center; gap:12px; }
    .theme-row-preview { flex:1; min-height:0; align-items:stretch; }
    .theme-label { font-size:13px; color:var(--ink700); font-weight:600; min-width:70px; }
    .theme-result { flex:1; min-height:260px; max-height:420px; overflow:auto; background:var(--bg); border:1px solid var(--line300); border-radius:var(--r-md); padding:12px; font-family:"Cascadia Code",Consolas,monospace; font-size:12px; color:var(--ink900); white-space:pre-wrap; word-break:break-all; }
    .theme-color { width:44px; height:32px; border:1px solid var(--line300); border-radius:var(--r-md); padding:2px; background:var(--surface); cursor:pointer; }
    .theme-color-hint { font-size:12px; color:var(--ink500); }
    .theme-tpl-info { font-size:12px; color:var(--ink500); font-family:Consolas,monospace; }
    .theme-preview { flex:1; width:100%; height:100%; min-height:0; border:1px solid var(--line300); border-radius:var(--r-md); background:#fff; }
    .theme-panel .theme-row:last-child { margin-top:auto; }
    /* ===== 项目约束页 ===== */
    .constr-panel { display:flex; flex-direction:column; gap:20px; max-width:960px; background:var(--surface); border:1px solid var(--line300); border-radius:var(--r-lg); padding:24px; overflow-y:auto; max-height:calc(100vh - 190px); }
    .constr-loading, .constr-empty { color:var(--ink500); font-size:14px; padding:20px; text-align:center; }
    .constr-sec { font-size:16px; font-weight:600; color:var(--ink900); margin:8px 0 12px; padding-left:12px; border-left:3px solid var(--p700); }
    .constr-files { display:flex; gap:12px; flex-wrap:wrap; }
    .constr-card { display:flex; align-items:center; gap:12px; flex:1; min-width:240px; padding:14px 16px; background:var(--bg); border:1px solid var(--line300); border-radius:var(--r-lg); cursor:pointer; transition:all .15s; }
    .constr-card:hover { border-color:var(--p500); box-shadow:0 2px 8px rgba(26,108,179,.12); transform:translateY(-1px); }
    .cc-icon { width:40px; height:40px; border-radius:10px; background:var(--p700); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex:none; }
    .cc-body { flex:1; min-width:0; }
    .cc-name { font-size:14px; font-weight:600; color:var(--ink900); }
    .cc-desc { font-size:12px; color:var(--ink500); margin-top:2px; }
    .cc-arrow { font-size:20px; color:var(--ink400); }
    .constr-table { width:100%; border-collapse:collapse; font-size:13px; }
    .constr-table th { background:var(--bg); color:var(--ink700); font-weight:600; text-align:left; padding:10px 12px; border-bottom:2px solid var(--line300); }

    function depLoadList() {
      var box = document.getElementById("depList");
      if (!box) return;
      if (!window.__TAURI__ || !window.__TAURI__.core) {
        box.innerHTML = '<div class="dep-empty">Tauri 环境不可用，无法读取服务器。</div>';
        return;
      }
      window.__TAURI__.core.invoke("deploy_server_list", { prjGuid: currentProject.prjGUID })
        .then(function(list) {
          depServers = list || [];
          depRenderList();
          depFillServerSelect(depPreferredServerId);
        })
        .catch(function(e) {
          box.innerHTML = '<div class="dep-empty">读取服务器失败：' + escHtml(e) + '</div>';
        });
    }

    function depFillServerSelect(selected) {
      var sel = document.getElementById("depSrvSel");
      if (!sel) return;
      if (!depServers.length) {
        sel.innerHTML = '<option value="">（先添加服务器）</option>';
        return;
      }
      var cur = selected || depPreferredServerId || parseInt(sel.value, 10) || 0;
      sel.innerHTML = depServers.map(function(s) {
        return '<option value="' + s.id + '"' + (s.id === cur ? " selected" : "") + '>' +
          escHtml(s.name) + ' · ' + depOsLabel(s.os_type) + ' · ' + escHtml(s.host) + '</option>';
      }).join("");
      depPreferredServerId = parseInt(sel.value, 10) || 0;
    }

    function depRenderList() {
      var box = document.getElementById("depList");
      if (!box) return;
      if (!depServers.length) {
        box.innerHTML =
          '<div class="dep-empty">还没有服务器。<br>' +
          '点右上角「添加服务器」，填写操作系统类型、地址、用户名和密码即可。</div>';
        return;
      }
      box.innerHTML = depServers.map(function(s) {
        return '<div class="dep-item" data-id="' + s.id + '">' +
          '<div class="dep-main">' +
            '<div class="dep-name">' + escHtml(s.name) +
              '<span class="os-badge ' + escHtml(s.os_type) + '">' + depOsLabel(s.os_type) + '</span></div>' +
            '<div class="dep-meta"><span>' + escHtml(s.host) + ':' + s.port + '</span>' +
              '<span>用户：' + escHtml(s.username) + '</span>' +
              '<span>' + (s.has_password ? '密码已设置' : '未设置密码') + '</span>' +
              (s.remark ? '<span>' + escHtml(s.remark) + '</span>' : '') + '</div>' +
            '<div class="dep-test" id="depTest-' + s.id + '"></div>' +
          '</div>' +
          '<div class="dep-actions">' +
            '<button class="btn-xs" data-act="test" data-id="' + s.id + '">测试连接</button>' +
            '<button class="btn-xs" data-act="edit" data-id="' + s.id + '">编辑</button>' +
            '<button class="btn-xs" data-act="del" data-id="' + s.id + '">删除</button>' +
          '</div>' +
        '</div>';
      }).join("");
      box.querySelectorAll("button[data-act]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var id = +btn.dataset.id;
          if (btn.dataset.act === "test") depTest(id, btn);
          else if (btn.dataset.act === "edit") depOpenModal(id);
          else if (btn.dataset.act === "del") depDelete(id);
        });
      });
    }

    function depFind(id) {
      for (var i = 0; i < depServers.length; i++) if (depServers[i].id === id) return depServers[i];
      return null;
    }

    function depOpenModal(id) {
      var s = id ? depFind(id) : null;
      var old = document.getElementById("depModal");
      if (old) old.remove();
      var wrap = document.createElement("div");
      wrap.className = "modal show";
      wrap.id = "depModal";
      wrap.innerHTML =
        '<div class="modal-box" style="width:640px;max-width:94vw">' +
          '<h4>' + (s ? "编辑服务器" : "添加服务器") + '</h4>' +
          '<div class="dep-grid">' +
            '<div class="field"><label>服务器名称</label><input id="depName" placeholder="例如 生产-Tomcat01" value="' + (s ? escHtml(s.name) : "") + '" /></div>' +
            '<div class="field"><label>操作系统类型</label><select id="depOs">' +
              '<option value="linux"' + (s && s.os_type === "linux" ? " selected" : "") + '>Linux</option>' +
              '<option value="windows"' + (s && s.os_type === "windows" ? " selected" : "") + '>Windows</option>' +
            '</select></div>' +
            '<div class="field"><label>服务器地址</label><input id="depHost" placeholder="IP 或域名，例如 192.168.1.10" value="' + (s ? escHtml(s.host) : "") + '" /></div>' +
            '<div class="field"><label>端口</label><input id="depPort" type="number" min="1" max="65535" value="' + (s ? s.port : 22) + '" /></div>' +
            '<div class="field"><label>用户名</label><input id="depUser" placeholder="登录账号" value="' + (s ? escHtml(s.username) : "") + '" /></div>' +
            '<div class="field"><label>密码</label><input id="depPwd" type="password" placeholder="' + (s && s.has_password ? "留空表示不修改" : "登录密码") + '" /></div>' +
            '<div class="field" style="grid-column:1 / -1"><label>备注（可选）</label><input id="depRemark" placeholder="例如 测试环境 / 只跑 Tomcat" value="' + (s && s.remark ? escHtml(s.remark) : "") + '" /></div>' +
          '</div>' +
          '<div class="dep-note">密码会加密存储在本机，不会明文保存，也不会显示出来。</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" id="depCancel">取消</button>' +
            '<button class="btn btn-primary" id="depSave">保存</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(wrap);
      var osSel = document.getElementById("depOs");
      osSel.addEventListener("change", function() {
        var p = document.getElementById("depPort");
        if (!p.value || p.value === "22" || p.value === "445") p.value = osSel.value === "windows" ? 445 : 22;
      });
      document.getElementById("depCancel").addEventListener("click", function(){ wrap.remove(); });
      document.getElementById("depSave").addEventListener("click", function(){ depSave(s ? s.id : null, wrap); });
      wrap.addEventListener("click", function(e){ if (e.target === wrap) wrap.remove(); });
      document.getElementById("depName").focus();
    }

    function depSave(id, wrap) {
      var name = document.getElementById("depName").value.trim();
      var os = document.getElementById("depOs").value;
      var host = document.getElementById("depHost").value.trim();
      var port = parseInt(document.getElementById("depPort").value, 10);
      var user = document.getElementById("depUser").value.trim();
      var pwd = document.getElementById("depPwd").value;
      var remark = document.getElementById("depRemark").value.trim();
      if (!name || !host || !user) { alert("请填写服务器名称、地址和用户名"); return; }
      if (!port || port < 1 || port > 65535) { alert("端口需在 1-65535 之间"); return; }
      if (!id && !pwd) { alert("请填写登录密码"); return; }
      var btn = document.getElementById("depSave");
      btn.disabled = true; btn.textContent = "保存中…";
      window.__TAURI__.core.invoke("deploy_server_save", {
        id: id, prjGuid: currentProject.prjGUID, name: name, osType: os,
        host: host, port: port, username: user, password: pwd, remark: remark
      }).then(function() {
        wrap.remove();
        document.getElementById("statusText").textContent = (id ? "已更新服务器：" : "已添加服务器：") + name;
        depLoadList();
        modSet("deploy", true);
      }).catch(function(e) {
        btn.disabled = false; btn.textContent = "保存";
        alert("保存失败：" + e);
      });
    }

    function depDelete(id) {
      var s = depFind(id);
      if (!s) return;
      if (!window.confirm("确定删除服务器「" + s.name + "」？删除后需重新填写密码。")) return;
      window.__TAURI__.core.invoke("deploy_server_delete", { prjGuid: currentProject.prjGUID, id: id })
        .then(function(ok) {
          if (!ok) { alert("删除失败：未找到该服务器"); return; }
          document.getElementById("statusText").textContent = "已删除服务器：" + s.name;
          depLoadList();
          if (depServers.length <= 1) modSet("deploy", false);
        })
        .catch(function(e){ alert("删除失败：" + e); });
    }

    function depTest(id, btn) {
      var box = document.getElementById("depTest-" + id);
      var s = depFind(id);
      btn.disabled = true; btn.textContent = "测试中…";
      if (box) { box.className = "dep-test"; box.textContent = "正在连接 " + s.host + ":" + s.port + " …"; }
      window.__TAURI__.core.invoke("deploy_server_test", { prjGuid: currentProject.prjGUID, id: id })
        .then(function(r) {
          if (box) {
            box.textContent = (r.ok ? "✓ " : "✗ ") + r.msg + (r.ok ? "（" + r.latency_ms + " ms）" : "");
            box.className = "dep-test " + (r.ok ? "ok" : "fail");
          }
          document.getElementById("statusText").textContent = "连接测试：" + r.msg;
        })
        .catch(function(e) {
          if (box) { box.textContent = "✗ 测试失败：" + e; box.className = "dep-test fail"; }
        })
        .then(function() { btn.disabled = false; btn.textContent = "测试连接"; });
    }

    function depAddUserMsg(text) {
      var box = document.getElementById("depAiMsgs");
      if (!box) return;
      var empty = document.getElementById("depAiEmpty");
      if (empty) empty.remove();

    // ANSI 转义剥离
    function stripAnsi(s) {
      s = s.replace(/\x1b\][^]*/g, "");
      s = s.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "");
      s = s.replace(/\x1b\[[0-9;?']*[A-Za-z'{}]/g, "");
      s = s.replace(/\x1b\[[<>][0-9;?]*[A-Za-z]/g, "");
      s = s.replace(/\x1b[()=><][0-9A-Z?]*/g, "");
      s = s.replace(/\x1b\[[0-9;?<>]*/g, "");
      // 过滤 TUI 装饰边框线
      s = s.replace(/[─-╿]+/g, " ").replace(/[─-╿]/g, "");
      return s;
    }

    function escHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

function doConnect(baseUrl, token) {
      if (!baseUrl) { chatSetStatus("无地址", "off"); return; }
      // 从 baseUrl 解析 ws 地址
      // session_id = 当前项目 prjGUID（无则 default）；fresh=1 强制新会话避免串线
      var wsUrl = baseUrl.replace(/^http/, "ws").replace(/\/$/, "") +
        "/api/pty?token=" + encodeURIComponent(token || "") +
        "&fresh=1";
      try {
        chatWs = new WebSocket(wsUrl);
        chatSetStatus("连接中…", "pending");
        chatWs.onopen = function() {
          chatConnected = true;
          chatSetStatus("在线", "on");
          chatAddSystem("已连接 Agent（" + baseUrl + "）");
          // 发送初始命令触发欢迎输出
          chatWs.send("\r");
        };
        chatWs.onmessage = function(ev) {
          var text = "";
          if (ev.data instanceof Blob) {
            var reader = new FileReader();
            reader.onload = function(){ handleChatChunk(String(reader.result)); };
            reader.readAsText(ev.data);
            return;
          } else {
            text = String(ev.data);
          }
          handleChatChunk(text);
        };
        chatWs.onclose = function() {
          chatConnected = false;
          chatSetStatus("已断开", "off");
          chatAddSystem("连接已断开");
        };
        chatWs.onerror = function() {
          chatConnected = false;
          chatSetStatus("连接失败", "off");
          chatAddSystem("连接失败，请确认 Dashboard 已启动（dashboard.bat）");
        };
      } catch(e) {
        chatSetStatus("无法连接", "off");
        chatAddSystem("WebSocket 创建失败：" + e);
      }
    }

    var chatShownMsgs = [];  // 去重

    function handleChatChunk(chunk) {
      chatBuf += chunk;
      var lines2 = chatBuf.split(String.fromCharCode(10));
      chatBuf = lines2.pop();
      lines2.forEach(function(ln){
        var clean = stripAnsi(ln).replace(/\s+/g, " ").trim();
        if (!clean) return;
        // 过滤 TUI 装饰行
        if (isTuiDeco(clean)) return;
        // 去重
        if (chatShownMsgs.indexOf(clean) >= 0) return;
        chatShownMsgs.push(clean);
        // 用户输入回显（提示符后）判为用户消息，否则 Agent 回复
        var isUser = ln.indexOf("❯") >= 0;
        chatAddMsg(clean, isUser);
      });
      // 有内容时清除思考中状态
      var list = document.getElementById("chatMsgList");
      if (list && list.querySelectorAll(".chat-row").length > 0) {
        var think = document.getElementById("chatThinking");
        if (think) think.remove();
      }
    }

    function isTuiDeco(t) {
      var deco = ["HermesAgent","NousResearch","session","Session:","Available","skills","help","starting agent","ready","deepseek","E:\\","❯","ask me anything","summoning","resuming"];
      for (var i = 0; i < deco.length; i++) {
        if (t.indexOf(deco[i]) >= 0) return true;
      }
      return false;
    }

    // ① 切出页面后切回来，已输入未发送的内容不能丢：切换会 renderXxx() 重建 innerHTML，
    //    输入框连同内容一起被销毁 —— 所以按「场景 + 项目」存 localStorage，重建后自动填回。
    // ② 必须支持多行：单行 input 写不下稍长一点的修改描述。
    function draftKeyOf(scene) {
      var g = (currentProject && currentProject.prjGUID) ? currentProject.prjGUID : "noproject";
      return "draft_" + scene + "_" + g;
    }
    function draftSave(scene, el) {
      if (!el) return;
      try {
        var v = String(el.value || "");
        if (v) localStorage.setItem(draftKeyOf(scene), v);
        else localStorage.removeItem(draftKeyOf(scene));
      } catch (e) {}
    }
    function draftRestore(scene, el) {
      if (!el) return;
      try {
        var v = localStorage.getItem(draftKeyOf(scene));
        if (v) { el.value = v; taGrow(el); }
      } catch (e) {}

      // A+ 常驻：项目铁律（唯一来源 ARCHITECTURE.md 第10章）+ 规范文件路径指引
      if (currentProject && AGENT_CONST && AGENT_CONST.ironlaws) {
        L.push("");
        L.push("【项目铁律】");
        L.push(AGENT_CONST.ironlaws);
        L.push("");
        L.push("【完整规范位置（需要细则时自读文件，不要凭记忆猜）】");
        var P = AGENT_CONST.paths || {};
        if (P["ARCHITECTURE.md"]) {
          L.push("- 架构决策 " + P["ARCHITECTURE.md"] + "：分层边界(1-2章)、交付策略与YAGNI边界(7章)、四个接缝(8章)、认证预留(9章)、自检清单(11章)、后期改造地图(12章)");
        }
        if (P["CODING-STANDARDS.md"]) {
          L.push("- 代码写法 " + P["CODING-STANDARDS.md"] + "：Java命名、异常、SQL、Redis、前端、交付自检清单");
        }
        if (P["AGENTS.md"]) {
          L.push("- 协作流程 " + P["AGENTS.md"] + "：目录落位、技术栈、开工流程");
        }
        L.push("【硬性要求】涉及表结构、新增模块、认证/权限的改动，动手前必须先读上述文件对应章节。读这些文件用 execute_code 或 terminal cat，别用 read_file。");
      }
      // 数据结构是「业务流程 → 代码」之间的桥，必须常驻一条，否则 Agent 每步各写一套表
      if (currentProject) {
        L.push("");
        L.push("【数据结构唯一依据】项目目录下 doc/data-model.md。建表、写 DAO、加字段之前必须先读它；发现代码和它不一致，先改文档再改代码，不许两边各写一套。");
      }
      return L.join(String.fromCharCode(10));
    }

    // 场景流式气泡（统一 UI，复用聊天页 CSS）
    function agentAddBubble(sceneId) {
      var s = agentScene(sceneId);
      var box = s ? document.getElementById(s.listId) : null;
      var id = "agBubble_" + sceneId + "_" + Date.now();

      div.innerHTML = '<div class="chat-bubble-wrap">' +

    // 统一流式发送：气泡 + 事件监听 + 三区渲染（思考链 / 工具 / 打字机）
    // hooks: { beforeSend(text)->text, onStart(), onDone(text), onError(msg) }
    // ===== agent_stream 全局单监听器（2026-11-06 卢Sir 报「重复执行/重复输出」的根因）=====
    // 病根：原来每次 agentRun 都 event.listen 一个新的监听器，靠 cleanup 里的 unlisten 收尾。
    // 一旦这一轮被中断 / 页面重渲染 / 异常跳出，unlisten 就丢了，监听器永久残留。
    // 残留 N 个 → 同一条 SSE 事件被处理 N 遍 → 同一条回复弹出 N 个气泡、
    // 同一个工具调用在过程面板里写 N 行（时间戳和耗时一模一样，看着像「重复执行」）。
    // 现在只保留一个监听器，事件分发给「当前这一轮」的 handle。
    var AGENT_STREAM_UNLISTEN = null;
    var AGENT_CURRENT_HANDLE = null;
    function ensureAgentStreamListener() {
      if (AGENT_STREAM_UNLISTEN) return;
      if (!window.__TAURI__ || !window.__TAURI__.event) return;
      AGENT_STREAM_UNLISTEN = window.__TAURI__.event.listen("agent_stream", function (ev) {
        var fn = AGENT_CURRENT_HANDLE;
        if (fn) { try { fn(ev.payload); } catch (e) { console.warn("agent_stream 处理异常", e); } }
      });
    }

    // ===== 前端异常兜底：别让 JS 报错无声无息地把流程卡死 =====
    // 加这个的原因：单步执行点了以后界面停在「单步执行第 7 步」，请求没发出，
    // 说明中间某处抛了异常，而异常在 onclick 里被吞了 —— 界面上完全看不到。
    // 现在任何未捕获异常 / Promise 拒绝都会写进过程日志，肉眼可见。
    window.addEventListener("error", function (e) {
      try {
        var where = String(e.filename || "").split(/[\\/]/).pop();
        aiToolLog("err", "✗ 前端异常：" + (e.message || "未知错误") + "  @" + where + ":" + (e.lineno || "?"));
        aiToolState("前端报错，这一步没发出去：" + String(e.message || "").slice(0, 60), "bad");
      } catch (x) {}
    });
    window.addEventListener("unhandledrejection", function (e) {
      try {
        var r = e.reason || {};
        aiToolLog("err", "✗ 未处理的 Promise 拒绝：" + (r.message || String(r)).slice(0, 200));
      } catch (x) {}
    });

    // ===== 全局 Agent 互斥（前端第二道防线；后端 lib.rs 里还有一把硬锁）=====
    // 病根：每个场景都能自己发 run，前端防重入只管得住计划按钮，
    // 管不住 ASK 回答 / 「看看」/ 聊天提问这些旁路；多点几次就是多个 run 并发写同一个项目目录。
    var AGENT_BUSY = null;   // { scene, tag, t0 }
    function agentBusyCheck(where) {
      if (!AGENT_BUSY) return true;
      var secs = Math.round((Date.now() - AGENT_BUSY.t0) / 1000);
      aiAddMsg("另一个 Agent 正在执行（" + (AGENT_BUSY.tag || AGENT_BUSY.scene) + "，已 " + secs + " 秒）。同一时间只允许一个 Agent，等它结束再来。", false);
      return false;
    }
    function agentBusySet(sceneId, tag) { AGENT_BUSY = { scene: sceneId, tag: tag || "", t0: Date.now() }; }
    function agentBusyClear() { AGENT_BUSY = null; }
    function agentBusyInfo() {
      if (!AGENT_BUSY) return "";
      return (AGENT_BUSY.tag || AGENT_BUSY.scene) + " · 已 " + Math.round((Date.now() - AGENT_BUSY.t0) / 1000) + " 秒";
    }

    function agentRun(sceneId, text, hooks) {
      hooks = hooks || {};
      var s = agentScene(sceneId);
      if (!s) { console.warn("未知场景: " + sceneId); return Promise.reject("unknown scene"); }
      if (!window.__TAURI__ || !window.__TAURI__.core) return Promise.reject("Tauri 不可用");
      // 第二道锁：前端就不让同一时刻发第二个 run（后端还会再拦一次）
      if (!agentBusyCheck(sceneId)) return Promise.reject("busy");
      agentBusySet(sceneId, hooks.tag || (s.title || sceneId));
      var sid = agentSid(sceneId, hooks);
      var bubbleId = agentAddBubble(sceneId);
      var fullText = "";
      var finished = false;
      // 工具计时器：Hermes 一个工具跑几分钟是常态（装 Tomcat / 建库），
      // 期间没有任何事件，界面数字不跳用户就以为死了。
      var _toolName = "";
      var _toolT0 = 0;
      var _toolTimer = null;
      // 执行类护栏：工具调用次数就是 token 账单（每次调用 = 重新发一遍全部上下文）。
      // td 实测：单步中位 12 次、最大 146 次；超过 40 次的步骤都在烧钱，必须让用户看见。
      var _toolCount = 0;
      var _runT0 = Date.now();
      var _thinkRow = null;   // 当前这段思考在过程面板里的那一行
      var _toolRow = null;    // 当前这个工具调用在过程面板里的那一行
      function _stopToolTick() {
        if (_toolTimer) { clearInterval(_toolTimer); _toolTimer = null; }
      }
      // 一轮收尾时把「工具次数 + 耗时」写进过程日志：这一步到底贵不贵，用户当场能看见。
      function _toolStats() {
        if (!_toolCount) return;
        var mins = ((Date.now() - _runT0) / 60000).toFixed(1);
        aiToolLog("dim", "📊 本轮工具 " + _toolCount + " 次，耗时 " + mins + " 分钟" +
          (_toolCount > 40 ? "（偏大：建议把这步拆小）" : ""));
      }
      function cleanup() {
        agentBusyClear();   // 任何收尾路径都要放锁，否则后续所有 Agent 都被挡住
        // 只交出自己这一轮的 handle：全局监听器本身不销毁，避免 create/destroy 泄漏
        if (AGENT_CURRENT_HANDLE === handle) AGENT_CURRENT_HANDLE = null;
        // 一轮结束：状态条回到空闲。计划自动跑下一步时会立刻再覆盖成「正在做第 N 步」，
        // 所以这里不用判断，直接收尾；否则聊完天后状态条会一直停在「正在执行」骗人。
        if (!aiPlan || aiPlan.status !== "running") aiToolState("空闲", "");
        _thinkRow = null;
        if (_toolRow && _toolRow.parentNode) {
          _toolRow.className = "ai-tool-row dim";
          _toolRow.textContent += "  …这一轮结束了，没收到完成事件";
        }
        _toolRow = null;
      }
      function scrollBottom() {
        var box = document.getElementById(s.listId);
        if (box) box.scrollTop = box.scrollHeight;
      }
      function handle(d) {
        if (!d || !d.type) return;
        var wrap = document.getElementById(bubbleId);
        var replyEl = wrap ? wrap.querySelector(".chat-reply") : null;
        var thinkEl = wrap ? wrap.querySelector(".chat-thinking-box") : null;
        var _panel = !!document.getElementById("aiToolBody");
        window.__aiLastEvt = Date.now();   // 心跳：任何事件都算「还活着」
        if (d.type === "reasoning") {
          if (_panel) {
            if (!_thinkRow || !_thinkRow.parentNode) { _thinkRow = aiToolLog("dim", "💭 "); }
            _thinkRow.textContent += (d.text || "");
            var _bb = document.getElementById("aiToolBody");
            if (_bb) _bb.scrollTop = _bb.scrollHeight;
          } else if (thinkEl) {
            thinkEl.style.display = "block";
            var t = thinkEl.querySelector(".chat-think-text");
            if (!t) {
              thinkEl.innerHTML = '<div class="chat-think-label">🤔 思考中…</div><div class="chat-think-text"></div>';
              t = thinkEl.querySelector(".chat-think-text");
            }
            t.textContent += (d.text || "");
          }
        } else if (d.type === "tool") {
          // 不再每秒重绘读秒 —— 那玩意儿只会把有用的信息挤走。
          // 进行中的那一行末尾由 CSS 闪烁光标表示「还在跑」，跑完才落耗时。
          _stopToolTick();
          _thinkRow = null;
          _toolName = d.text || "执行工具";
          _toolT0 = Date.now();
          _toolCount++;
          // 40 / 60 次各提醒一次：不做硬中断（代码正写到一半，掐断更亏），
          // 只把「这步太大」这件事摆到台面上，让用户决定做完后拆不拆步。
          if (_toolCount === 40 || _toolCount === 60) {
            aiToolLog("err", "⚠ 本步工具调用已 " + _toolCount + " 次 —— 这步太大，token 会翻倍；做完建议把这一步拆小");
          }
          if (_panel) {
            _toolRow = aiToolLog("run", "🔧 " + _toolName + "  ·  第 " + _toolCount + " 次");
            aiToolState("正在执行：" + _toolName + "（本步第 " + _toolCount + " 次工具）", "on");
          } else if (thinkEl) {
            thinkEl.style.display = "block";
            var tl = thinkEl.querySelector(".chat-think-label");
            if (tl) tl.textContent = "🔧 " + _toolName;
          }
        } else if (d.type === "tool_done") {
          _stopToolTick();
          var secs2 = d.duration ? Number(d.duration).toFixed(1) : ((Date.now() - _toolT0) / 1000).toFixed(1);
          if (_panel) {
            if (_toolRow && _toolRow.parentNode) {
              _toolRow.className = "ai-tool-row " + (d.error ? "err" : "ok");
              _toolRow.textContent += "  " + (d.error ? "✗ 失败 " : "✓ ") + secs2 + "s";
            }
            _toolRow = null;
            aiToolState("工具已完成，Agent 处理中…", "on");
          } else if (thinkEl) {
            thinkEl.style.display = "block";
            var tl2 = thinkEl.querySelector(".chat-think-label");
            if (tl2) tl2.textContent = "🔧 工具执行记录";
            var tail = thinkEl.querySelector(".chat-think-done");
            if (!tail) {
              tail = document.createElement("div");
              tail.className = "chat-think-done";
              thinkEl.appendChild(tail);
            }
            tail.textContent += (d.error ? "❌ " : "✅ ") + (d.text || "工具") + " · " + secs2 + " 秒" + String.fromCharCode(10);
          }
        } else if (d.type === "delta") {
          fullText += d.text || "";
          if (replyEl) replyEl.textContent = fullText;
          if (hooks.onDelta) { try { hooks.onDelta(fullText); } catch (e) { console.warn(e); } }
        } else if (d.type === "done") {
          finished = true;
          _stopToolTick();
          _toolStats();
          cleanup();
          agentHistPush(sceneId, fullText, false);
          if (hooks.onDone) hooks.onDone(fullText);
        } else if (d.type === "error") {
          finished = true;
          _stopToolTick();
          _toolStats();
          cleanup();
          if (hooks.onError) hooks.onError(d.text || "");
        }
        scrollBottom();
      }
      ensureAgentStreamListener();   // 全局只 listen 一次
      AGENT_CURRENT_HANDLE = handle; // 这一轮接管事件
      var payload = text;
      if (hooks.beforeSend) { try { payload = hooks.beforeSend(text) || text; } catch (e) { console.warn(e); } }
      if (hooks.onStart) hooks.onStart();
      // 记忆测试（clean）：完全不下发常驻提示词，也不预热项目约束 ——
      // 发出去的只有输入框里的那句话本身。
      var instr = s.clean ? "" : agentInstructions(sceneId);
      // 给记忆测试留一份「对照组」数据：连接测试上一轮实际带了多少字的固定提示
      if (!s.clean) {
        try { localStorage.setItem("tdev_last_instr", JSON.stringify({ len: instr.length, ts: Date.now(), title: s.title || sceneId })); } catch (e) {}
      }
      var ready = s.clean ? Promise.resolve(null) : agentConstEnsure();
      return ready.then(function () {
        return window.__TAURI__.core.invoke("agent_ask_stream", {
          question: payload,
          sessionId: sid,
          instructions: instr,
          // 把工作目录钉在项目里：不传的话 Agent 跑在 Hermes 自己的目录（E:\HermesMinimal），
          // 相对路径会生成到那儿，终端 pwd 也是错的。记忆测试不传 cwd，保持请求干净。
          cwd: s.clean ? undefined : (aiProjectDir() || undefined),
          // 只有记忆测试把会话 ID 放进请求体（/v1/runs 不认请求头），其它场景维持原样
          sessionMemory: !!s.clean
        });
      }).then(function (reply) {
        if (!finished) {
          cleanup();
          var wrap = document.getElementById(bubbleId);
          var replyEl = wrap ? wrap.querySelector(".chat-reply") : null;
          if (replyEl) replyEl.textContent = (fullText || reply || "（无回复）");
          agentHistPush(sceneId, fullText || reply, false);
          if (hooks.onDone) hooks.onDone(fullText || reply || "");
        }
        return reply;
      }).catch(function (e) {
        cleanup();
        if (hooks.onError) hooks.onError(String(e));
        throw e;
      });
    }

      if (!currentProject) return;

      window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function(v){
        var ws = "";
        try { ws = JSON.parse(v || "{}").path || ""; } catch(e) {}
        if (!ws) return;

        window.__TAURI__.core.invoke("theme_read_project", {
          prjName: currentProject.prjName,

            try {

    // 提取 Markdown 表格（## 标题后的第一个 | 表格）
    function extractTable(md, sectionHint) {
      var rows = [];
      var lines = md.split(String.fromCharCode(10));
      var inTable = false;
      var started = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf("|") === 0) {
          var cells = line.split("|").slice(1, -1).map(function(c){ return c.trim(); });
          if (!started) { started = true; continue; }  // 跳过表头
          if (/^[\-: ]+$/.test(cells.join(""))) continue;  // 跳过分隔行
          if (cells.length >= 2) rows.push(cells);
          inTable = true;
        } else if (inTable) {
          break;
        }
      }
      return rows;
    }

    // 提取无序列表（## 标题后的 - 项）
    function extractList(md, sectionHint) {
      var items = [];
      var lines = md.split(String.fromCharCode(10));
      var capture = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var t = line.trim();
        if (/^## /.test(line)) {          // 只认二级标题，### 子标题不重置采集
          capture = line.indexOf(sectionHint) >= 0;
          continue;
        }
        if (!capture) continue;
        if (line.indexOf("- ") === 0) {
          items.push(line.slice(2).trim());
        } else if (/^[0-9]+\./.test(line)) {
          items.push(line.replace(/^[0-9]+\.\s*/, "").trim());
        } else if (t === "" || t.indexOf(">") === 0 || t === "---" || /^\*\*.+\*\*$/.test(t) || /^###/.test(line)) {
          continue;                       // 空行/引用/分隔线/加粗分组/子标题：跳过，不中断
        } else {
          break;                          // 正文段落：本节列表结束
        }
      }
      return items;
    }

    // ================= 业务流程：AI 梳理 + 交互流程图 =================
    var procFlow = null;
    var procExpanded = {};
    var procSid = "";

    // ===== 高保真UI页（空界面，参考业务流程布局）=====
    // AI 开发场景消息
    // ================= AI开发：开发计划状态机（none -> ready -> running -> done） =================
    var aiPlan = null;
    // 内存里的运行标记：只有本次页面生命周期内真正点过「开始吧」才会被赋值。
    // 刷新/重启后它必然是 null —— 用来识别 localStorage 里卡死的 running 僵尸状态。
    var aiPlanLiveId = null;
    var aiBeatTimer = null;
    var aiBeatIdx = 0;
    var AI_BEATS = ["正在处理…", "还在处理，稍等一下…", "快好了…"];

    function aiNL() { return String.fromCharCode(10); }

    function aiPlanKey() {
      var g = (currentProject && currentProject.prjGUID) ? currentProject.prjGUID : "tdev-ai";
      return "ai_plan_" + g;
    }
    function aiPlanSave() {
      try { localStorage.setItem(aiPlanKey(), JSON.stringify(aiPlan || null)); } catch (e) {}
    }
    function aiPlanId(p) {
      if (!p) return "";
      return String(p.prj || "") + "|" + String(p.ts || p.flowSig || "") + "|" + String((p.steps || []).length);
    }
    function aiPlanLoad() {
      // 僵尸复位唯一入口：进 AI开发页 / 切项目 / 刷新都会走到这里。
      // 判据是「状态说 running 但进程内没有活体句柄」，页面重绘期间不判，避免打死刚启动的计划。
      aiPlanHealRunning();
      // 🔒 内存里有正在跑的计划时，绝不用 localStorage 覆盖它。
      // 这是「第 6~9 步说完成了，突然又回到第 6 步执行中」的根因：
      // 并发 run 各自 save，切页面触发 aiPlanLoad 拿回更早的快照（6-9 还是 todo），
      // 下一个 run 又把它标成 doing → 一堆步骤同时「正在处理」。
      if (aiPlan && aiPlan.status === "running" && aiPlanLiveId && aiPlanLiveId === aiPlanId(aiPlan)) {
        return aiPlan;
      }
      var _prevSnap = aiPlan;
      try { aiPlan = JSON.parse(localStorage.getItem(aiPlanKey()) || "null"); } catch (e) { aiPlan = null; }
      // 兜底：计划是在「未选项目」状态下生成的，存在 ai_plan_tdev-ai 里；确认属于本项目就迁过来，
      // 否则用户会以为计划丢了（生成时不选项目、之后再选，是很容易踩的顺序）。
      if (!aiPlan && currentProject && currentProject.prjGUID) {
        try {
          var orphan = JSON.parse(localStorage.getItem("ai_plan_tdev-ai") || "null");
          if (orphan && orphan.prj === currentProject.prjGUID && orphan.steps && orphan.steps.length) {
            aiPlan = orphan;
            aiPlanSave();
            try { localStorage.removeItem("ai_plan_tdev-ai"); } catch (e2) {}
          }
        } catch (e3) {}
      }
      // 进度单调合并：done 只增不减。同一份计划的旧快照里已完成的步骤，
      // 绝不能因为读到更早的 localStorage 记录又变回没做 —— 那等于把干过的活抹掉。
      if (_prevSnap && aiPlan && aiPlan.steps && _prevSnap.steps && aiPlanId(_prevSnap) === aiPlanId(aiPlan)) {
        aiPlan.steps.forEach(function (s, i) {
          var old = _prevSnap.steps[i];
          if (old && old.state === "done" && s.state !== "done") {
            s.state = "done";
            s.note = old.note || "已完成";
          }
        });
      }
      // 自愈：多个「正在处理」只可能是并发写坏的（单步状态机同一时刻只该有一个）。
      // 只保留 cur 指向那一步，其余退回未开始。
      if (aiPlan && aiPlan.steps) {
        var _doing = aiPlan.steps.filter(function (s) { return s.state === "doing"; });
        if (_doing.length > 1) {
          var _keep = null;
          for (var _qi = 0; _qi < _doing.length; _qi++) {
            if (_doing[_qi].n === aiPlan.cur) { _keep = _doing[_qi]; break; }
          }
          if (!_keep) _keep = _doing[_doing.length - 1];
          _doing.forEach(function (s) { if (s !== _keep) s.state = "todo"; });
          console.log("[自愈] 收敛 " + _doing.length + " 个「正在处理」，只保留第 " + _keep.n + " 步");
        }
      }
      // 僵尸状态恢复：status=running 但本次页面没在跑它（关过程序 / 上次没跑完 / 执行途中崩了），
      // 否则按钮永远不出现，计划彻底锁死 —— 这是「计划末尾只剩一句正在推进」的根因。
      if (aiPlan && aiPlan.status === "running" && aiPlanLiveId !== aiPlanId(aiPlan)) {
        var _doneN = 0;
        (aiPlan.steps || []).forEach(function (s) { if (s.state === "done") _doneN++; });
        aiPlan.status = "ready";
        aiPlan.interrupted = 1;
        aiPlan.interruptedAt = _doneN;
        aiPlanSave();
      }
      return aiPlan;
    }
    function aiFlowSig(files) {
      if (!files || !files.length) return "";
      return files.map(function (x) { return String(x).split("|")[0]; }).join(",");
    }
    function aiStepIcon(st) {
      if (st === "done") return "✅";
      if (st === "doing") return "🔄";
      if (st === "error") return "⚠️";
      return "⏳";
    }
    function aiStepText(st) {
      if (st === "done") return "已完成";
      if (st === "doing") return "正在处理…";
      if (st === "error") return "出错了";
      return "待开始";
    }
    function aiSetCanvas(html) {
      var el = document.getElementById("uiCanvasBody");
      if (el) el.innerHTML = html;
    }

    // ---- 右侧面板渲染 ----
    // 僵尸 running 自愈：状态写着 running，但进程里根本没有活跃的 Agent。
    // 判定依据是内存里的 AGENT_CURRENT_HANDLE，不是 localStorage 里的 status。
    function aiPlanHealRunning() {
      if (!aiPlan || aiPlan.status !== "running") return false;
      if (typeof AGENT_CURRENT_HANDLE !== "undefined" && AGENT_CURRENT_HANDLE) return false;   // 真在跑，不动
      aiPlan.status = "paused";
      aiPlan.paused = 1;
      aiPlanLiveId = null;
      (aiPlan.steps || []).forEach(function (s) { if (s.state === "doing") s.state = "todo"; });
      try { aiPlanSave(); } catch (e) {}
      try { aiToolState("已自动复位：上一次执行没有正常结束（可以直接点「重新生成」或某一步的「执行」）", "warn"); } catch (e) {}
      return true;
    }

    function aiRenderPlan(diag) {
      // 僵尸复位已移到「入口」执行（aiPlanLoad：进页面 / 切项目 / 刷新各跑一次），
      // 这里绝不能再调：重绘是高频动作，会把「刚点执行、请求还没发出」的计划误判成僵尸打死。
      var el = document.getElementById("uiCanvasBody");
      if (!el) return;
      if (!aiPlan || !aiPlan.steps || !aiPlan.steps.length) { aiDetect(); return; }
      var done = 0;
      aiPlan.steps.forEach(function (s) { if (s.state === "done") done++; });
      var pct = Math.round(done / aiPlan.steps.length * 100);
      var L = [];
      L.push('<div class="ui-plan">');
      L.push('<div class="ui-plan-head"><div class="ui-plan-title">' + escHtml(aiPlan.title || "项目开发计划") + '</div>');
      L.push('<div class="ui-plan-progress"><span>' + done + '/' + aiPlan.steps.length + ' 完成</span>');
      L.push('<div class="ui-plan-bar"><div class="ui-plan-fill" style="width:' + pct + '%"></div></div></div></div>');
      if (diag) L.push(diag);
      L.push('<div class="ui-plan-steps" id="uiPlanSteps">');
      // 按业务阶段分组：用户先看到几个阶段的整体进度（客户询盘 1/3），再往下看每步。
      // 一层是 26 张卡片会淹没用户；分组后视觉上只有 7 组。
      var _groups = [], _gmap = {};
      aiPlan.steps.forEach(function (st) {
        var ph = st.phase || (st.base ? "准备" : "业务功能");
        if (!_gmap[ph]) { _gmap[ph] = { name: ph, items: [] }; _groups.push(_gmap[ph]); }
        _gmap[ph].items.push(st);
      });
      var _stepRunning = (aiPlan.status === "running");
      _groups.forEach(function (g) {

        var gall = (gd === g.items.length);
        L.push('<div class="ui-plan-group">');
        L.push('<div class="ui-plan-ghead' + (gall ? ' g-done' : '') + '"><span class="ui-plan-gname">' + escHtml(g.name) + '</span>');
        L.push('<span class="ui-plan-gcount">' + gd + '/' + g.items.length + (gall ? ' 完成' : '') + '</span></div>');
        g.items.forEach(function (st) {
          var state = st.state || "todo";
          L.push('<div class="ui-plan-step ui-step-' + state + '" data-n="' + st.n + '">');
          L.push('<span class="ui-step-state">' + aiStepIcon(state) + '</span>');
          L.push('<div class="ui-step-main"><div class="ui-step-name">' + escHtml(st.name || ("第 " + st.n + " 步")) + '</div>');
          if (st.desc) L.push('<div class="ui-step-desc">' + escHtml(st.desc) + '</div>');
          if (st.note) L.push('<div class="ui-step-note">产出：' + escHtml(st.note) + '</div>');
          L.push('</div>');
          L.push('<span class="ui-step-status" data-role="status">' + aiStepText(state) + '</span>');
          // 按钮下沉到每一步（卢Sir：开始/暂停/重试放步骤上，而不是只放在计划底部）
          // 正在跑别的步骤时，其他步骤的「执行」不显示，避免看得到点得动却必然被拒。
          if (state === "done") {
            // 卢Sir 2026-11-09：去掉「看看」按钮（执行完不再需要对每步单独查看），只留「重做」。
            if (!_stepRunning) L.push('<button class="ui-step-btn" data-run="' + st.n + '" title="重做这一步（会重跑一次）">重做</button>');
          } else if (state === "doing") {
            L.push('<button class="ui-step-btn ui-step-btn-warn" data-pause="1">暂停</button>');
          } else if (!_stepRunning) {
            var _runTxt = st.fix ? "重试" : "执行";
            L.push('<button class="ui-step-btn ui-step-btn-go" data-run="' + st.n + '" title="只做这一步，做完停住">' + _runTxt + '</button>');
            // 人工校正：磁盘上其实已经做完了、但状态被并发写坏成未完成的，点这个直接补回来
            L.push('<button class="ui-step-btn" data-finish="' + st.n + '" title="这一步其实已经做完了？手动标为已完成">✓</button>');

        });

      });
      L.push('</div>');
      var _dn = 0;
      (aiPlan.steps || []).forEach(function (s) { if (s.state === "done") _dn++; });
      var _tn = (aiPlan.steps || []).length;
      if (aiPlan.status === "running") {
        var _live = (aiPlanLiveId === aiPlanId(aiPlan));
        var _doing = aiPlan.cur || 0;
        L.push('<div class="ui-plan-actions">');

          // 真在跑：只留「暂停」，其余全部禁用。连点也不会开出第二份执行。

        }

        L.push('<div class="ui-plan-hint">' + (_live
          ? ('正在做第 ' + _doing + '/' + _tn + ' 步，已完成 ' + _dn + ' 步。程序会自动接着做下一步，不用再点。')
          : ('上次执行被中断（已完成 ' + _dn + '/' + _tn + ' 步）。点「继续执行」接着做，或点「重置状态」清掉这个标记。')) + '</div>');

        L.push('<div class="ui-plan-actions"><span class="ui-plan-hint">全部完成 🎉</span>');
        L.push('<button class="btn" id="aiPlanRegen">重新生成计划</button></div>');
      } else {
        var _goTxt = (_dn > 0 || aiPlan.paused || aiPlan.interrupted) ? "一键跑完剩下的" : "开始吧（一键跑完）";
        L.push('<div class="ui-plan-actions"><button class="btn btn-primary" id="aiPlanGo">' + _goTxt + '</button>');
        L.push('<button class="btn" id="aiPlanRegen">重新生成</button></div>');
        if (_dn > 0) {
          L.push('<div class="ui-plan-hint">已完成 ' + _dn + '/' + _tn + ' 步' + (aiPlan.paused ? '，上次是暂停的' : '') +
            '。点「继续执行」从下一未完成步骤接着做，做过的不会重做。</div>');
        }
      }
      // 数据结构文档入口：任何状态都能打开看/改（业务流程与代码之间的桥，要能随时查）
      L.push('<div class="ui-plan-actions" style="margin-top:10px">');
      L.push('<button class="btn btn-sm" id="aiPlanDataModel" title="打开「业务表单」模块（doc/forms.json → data-model.md）">📐 业务表单</button>');
      L.push('</div>');
      el.innerHTML = L.join("");
      var dmBtn = document.getElementById("aiPlanDataModel");
      if (dmBtn) dmBtn.onclick = function () { render(11); };
      var go = document.getElementById("aiPlanGo");
      if (go) go.onclick = aiPlanStart;
      var pz = document.getElementById("aiPlanPause");
      if (pz) pz.onclick = aiPlanPause;
      var rs = document.getElementById("aiPlanReset");
      if (rs) rs.onclick = function () {
        var dn = 0;
        if (aiPlan) {
          (aiPlan.steps || []).forEach(function (s) { if (s.state === "done") dn++; });
          aiPlan.status = "ready";
          aiPlan.interrupted = 1;
          aiPlan.interruptedAt = dn;
          aiPlanLiveId = null;
          aiPlanSave();
        }
        aiRenderPlan();
      };
      var rg = document.getElementById("aiPlanRegen");
      if (rg) rg.onclick = aiAskRegen;   // 有进度时先弹确认，讲清保留规则
      // 单步执行 / 单步暂停（按钮下沉后的入口）
      Array.prototype.forEach.call(el.querySelectorAll("[data-run]"), function (b) {
        b.onclick = function () { aiPlanRunStep(parseInt(b.getAttribute("data-run"), 10)); };
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-pause]"), function (b) {
        b.onclick = function () { aiPlanPause(); };
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-finish]"), function (b) {
        b.onclick = function () { aiPlanMarkDone(parseInt(b.getAttribute("data-finish"), 10)); };
      });
    }

    // ---- 进页面检测：只读本地，不调用模型 ----
    function aiDetect() {
      var el = document.getElementById("uiCanvasBody");
      if (!el) return;
      // 竞态防护：只认最近一次检测，旧项目的结果晚到直接丢弃
      var token = (currentProject && currentProject.prjGUID) || "";
      aiDetect.token = token;
      if (!currentProject) { aiSetCanvas('<div class="ui-plan-empty">请先在「基础信息」选择或新建项目</div>'); return; }
      if (!window.__TAURI__ || !window.__TAURI__.core) { aiSetCanvas('<div class="ui-plan-empty">Tauri 不可用</div>'); return; }
      aiSetCanvas('<div class="ui-plan-empty">正在检查项目状态…</div>');
      window.__TAURI__.core.invoke("cfg_load", { category: "workspace" }).then(function (v) {
        if (aiDetect.token !== token) return null;
        var ws = "";
        try { ws = JSON.parse(v || "{}").path || ""; } catch (e) {}
        if (!ws) { aiSetCanvas('<div class="ui-plan-empty">还没设置工作路径，请先到「项目空间」设置</div>'); return null; }
        aiDetect.ws = ws;
        var p1 = window.__TAURI__.core.invoke("process_list", { prjName: currentProject.prjName, workspace: ws });
        var p2 = window.__TAURI__.core.invoke("constr_context", { prjName: currentProject.prjName, workspace: ws });
        return Promise.all([p1, p2]).then(function (r) {
          if (aiDetect.token !== token) return;
          var files = r[0] || [];
          var ctx = r[1] || {};
          // 目录骨架先建好：公共运行时进 Public，项目内容全在项目目录里。Agent 只往里填，不自己找地方放。
          // 不阻塞渲染 —— 建空目录是毫秒级的事。
          try {
            window.__TAURI__.core.invoke("project_ensure_dirs", { prjName: currentProject.prjName, workspace: aiDetect.ws })
              .then(function (d) { aiDetect.dirs = d || null; })
              .catch(function () {});
          } catch (e) {}
          var sig = aiFlowSig(files);
          var hasFlow = !!(files && files.length);
          var okRules = !!(ctx.ironlaws && ctx.ironlaws.length > 50);
          aiPlanLoad();
          var changed = !!(aiPlan && aiPlan.flowSig && sig && aiPlan.flowSig !== sig);
          aiDetect.sig = sig;
          // 前置条件概览：计划在不在都显示，用户一眼知道流程 / 约定是否到位
          var diag = [];
          diag.push('<div class="ui-plan-note">');
          diag.push('项目：' + escHtml(currentProject.prjName) + '<br>');
          diag.push('业务流程：' + (hasFlow ? '已就绪（' + escHtml(String(files[0]).split("|")[0]) + '）' : '还没梳理，建议先到「业务流程」梳理一遍'));
          diag.push('<br>开发约定：' + (okRules ? '已就绪' : '未找到，将使用默认约定'));
          diag.push('</div>');
          if (changed) diag.push('<div class="ui-plan-warn">业务流程有更新，建议重新生成计划（已完成的步骤会按名称保留，名称变了的要重做）</div>');
          // 关键修复：有计划就直接按计划渲染。切项目 / 刷新 / 重进页面都必须能看见上次生成的计划，
          // 不能只画一个「开始吧」按钮把 26 步列表盖掉。
          if (aiPlan && aiPlan.steps && aiPlan.steps.length) {
            aiRenderPlan(diag.join(""));
            return;
          }
          var L = [];
          L.push('<div class="ui-plan">');
          L.push('<div class="ui-plan-head"><div class="ui-plan-title">项目开发计划</div>');
          L.push('<div class="ui-plan-progress"><span>尚未开始</span><div class="ui-plan-bar"><div class="ui-plan-fill" style="width:0%"></div></div></div></div>');
          L.push(diag.join(""));
          L.push('<div class="ui-plan-actions"><button class="btn btn-primary" id="aiPlanGen">生成开发计划</button></div>');
          L.push('</div>');
          el.innerHTML = L.join("");
          var g1 = document.getElementById("aiPlanGen");
          if (g1) g1.onclick = aiGenPlan;
        });
      }).catch(function (e) {

    // ---- 读取业务流程摘要 ----
    // ---- 读完整业务流程（生成计划专用：全局视野，不做摘要）----
    // 生成计划是低频操作（一个项目通常只做几次），整份流程连属性一起交给 AI 更划算：
    // 摘要只留骨架会丢细节，AI 只能按阶段猜，计划容易空泛、漏步骤。
    // 实测：单个项目 83 节点 / 含属性 ≈ 3900 字符 ≈ 1950 tokens，可接受。
    var AI_FLOW_LIMIT = 24000;  // 字符上限，防超大流程撑爆上下文
    function aiFlowFull(cb) {
      var ws = aiDetect.ws || "";
      var NL = aiNL();
      if (!ws || !currentProject) { cb(null); return; }
      window.__TAURI__.core.invoke("process_list", { prjName: currentProject.prjName, workspace: ws }).then(function (files) {
        if (!files || !files.length) { cb(null); return; }
        var names = [];
        for (var i = 0; i < files.length; i++) names.push(String(files[i]).split("|")[0]);
        var jobs = [];
        var mk = function (fn) {
          jobs.push(window.__TAURI__.core.invoke("process_load", { prjName: currentProject.prjName, workspace: ws, fileName: fn })
            .then(function (c) { return { fn: fn, raw: String(c || "") }; })
            .catch(function () { return null; }));
        };
        for (var k = 0; k < names.length; k++) mk(names[k]);
        return Promise.all(jobs).then(function (res) {
          var blocks = [], nodes = 0, mains = 0;
          for (var r = 0; r < res.length; r++) {
            var it = res[r];
            if (!it) continue;
            var a = it.raw.indexOf("{"), b = it.raw.lastIndexOf("}");
            if (a < 0 || b <= a) continue;
            var jj = null;
            try { jj = JSON.parse(it.raw.slice(a, b + 1)); } catch (e) { continue; }
            if (!jj || !jj.steps) continue;
            var lines = [];
            if (jj.flow_name) lines.push("流程名称：" + jj.flow_name);
            var walk = function (arr, depth) {
              if (!arr) return;
              for (var x = 0; x < arr.length; x++) {
                var nd = arr[x];
                var nm = (nd && nd.name) ? nd.name : String(nd || "");
                var pad = "";
                for (var q = 0; q < depth; q++) pad += "  ";
                lines.push(pad + "- " + nm);
                nodes++;
                if (depth === 0) mains++;
                var pr = (nd && nd.props) ? nd.props : {};
                var pf = [];
                if (pr.formName) pf.push("表单：" + pr.formName);
                if (pr.indexField) pf.push("索引字段：" + pr.indexField);
                if (pr.input) pf.push("输入：" + pr.input);
                if (pr.logic) pf.push("处理逻辑：" + pr.logic);
                if (pr.output) pf.push("产出：" + pr.output);
                if (pf.length) lines.push(pad + "  · " + pf.join("；"));
                walk(nd && nd.children, depth + 1);
              }
            };
            walk(jj.steps, 0);
            blocks.push((res.length > 1 ? "【文件：" + it.fn + "】" + NL : "") + lines.join(NL));
          }
          var text = blocks.join(NL + NL);
          var cut = false;
          if (text.length > AI_FLOW_LIMIT) { text = text.slice(0, AI_FLOW_LIMIT); cut = true; }
          cb({ text: text, nodes: nodes, mains: mains, cut: cut });
        });
      }).catch(function () { cb(null); });
    }

    // 计划前 6 步固定：地基 + 骨架。**不交给模型生成** —— 模型每次都会漏掉环境搭建，
    // 而装数据库/装服务恰恰最耗时，漏了用户在界面上看不到任何变化，会以为程序假死。
    //
    // **技术栈不写死**：文案由项目约束 AGENTS.md 第 2 章「技术栈（硬约束）」表格驱动
    // （Rust 侧 constr_context 解析成 stack 字段）。换成 .NET + MS SQL 模板时只改 AGENTS.md，
    // 这里自动变成装 SQL Server / IIS；取不到技术栈就退成通用说法，绝不硬编码某个产品。
    function aiShortStack(v, fallback) {
      if (!v) return fallback || "";
      var t = String(v).split(/[，,（(]/)[0].trim();
      if (t.length > 18) t = t.split(/\s+/).slice(0, 2).join(" ");
      return t || (fallback || "");
    }
    function aiBuildBaseSteps() {
      var st = (AGENT_CONST && AGENT_CONST.stack) || {};
      var db = aiShortStack(st.database, "");
      var srv = aiShortStack(st.server, "");
      var be = aiShortStack(st.backend, "");
      return [
        { name: "准备数据库", desc: "装好 " + (db || "数据库") + "，建好业务库和账号。这步要几分钟，做完后程序就能存数据了。" },
        { name: "准备运行环境", desc: "装好 " + (srv || "程序运行需要的服务") + "。这步也要几分钟，做完后程序就能启动。" },
        { name: "检查地基是否稳", desc: "确认数据库连得上、服务起得来、目录都齐了。地基不稳，后面全白做。" },
        { name: "搭好项目骨架", desc: "按 " + (be || "既定技术栈") + " 建好分层目录、启动入口和公共配置，程序先有个能跑起来的空架子。" },
        { name: "做用户注册和登录", desc: "建用户表，做完能注册、能登录，登录状态能一直保持。" },
        { name: "做权限校验", desc: "做完后不同角色能看到的菜单、能改的东西都不一样。" }
      ];
    }

    function aiGateBlock(miss) {
