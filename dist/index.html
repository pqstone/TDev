      // 保存
      document.getElementById("pmSaveBtn").addEventListener("click", function(){
        var formName = document.getElementById("pmForm").value.trim();
        var indexField = document.getElementById("pmField").value.trim();
        var input = document.getElementById("pmInput").value;
        var logic = document.getElementById("pmLogic").value;
        var output = document.getElementById("pmOutput").value;
        // 新表单/新字段自动加入列表（下次下拉可选）
        if (formName && procFormList.indexOf(formName) < 0) procFormList.push(formName);
        if (indexField && procFieldList.indexOf(indexField) < 0) procFieldList.push(indexField);
        var newName = document.getElementById("pmNodeName").value.trim();
        if (newName) node.name = newName;
        node.props = { formName: formName, indexField: indexField, input: input, logic: logic, output: output };
        // 移除弹窗 + 局部 DOM 更新（不重建流程图，保持展开状态，无刷新感）
        m.remove();
        var row = document.querySelector('[data-path="' + path + '"]');
        if (row) {
          var nameEl = row.querySelector(".proc-node-name");
          if (nameEl) nameEl.textContent = node.name;
          var hasProps2 = node.props && (node.props.formName || node.props.indexField || node.props.input || node.props.logic || node.props.output);
          row.classList.toggle("has-props", hasProps2);
          var flag = row.querySelector(".proc-node-flag");
          if (flag) {
            flag.textContent = hasProps2 ? "●" : "○";
            flag.title = hasProps2 ? "已配置属性" : "";
          }
        }
        procSaveFlowDoc();
        procAddSys("节点属性已保存：" + node.name);
      });
    }

              if (json && json.steps) {
                procFlow = json;
                procExpanded = {};
                for (var i = 0; i < json.steps.length; i++) {
                  if (json.steps[i].children && json.steps[i].children.length) {

      items.forEach(function(el){ el.classList.toggle("active", el.dataset.m == idx); });
    }

    // 初始化本地 SQLite：调用 Rust 命令 db_init（后端 rusqlite 建库 + 建表）
    async function initDb() {
      try {
        if (!window.__TAURI__ || !window.__TAURI__.core) { dbState.msg = "Tauri 不可用（未连接）"; render(current); return; }
        dbState.msg = await window.__TAURI__.core.invoke("db_init");
        dbState.ready = true;
      } catch(e) { dbState.msg = "数据库初始化失败：" + e; }
      render(current);
    }

    items.forEach(function(el){
      el.addEventListener("click", function(){
        var idx = +el.dataset.m;
        // 10 = 微调模式：不是页面，直接开浮窗，当前页面保持不变
        if (idx === 10) { openTuneMode(); return; }
        render(idx);
      });
    });

    // 微调浮窗在另一个窗口里写同一份聊天 / 执行日志 → 切回本窗口时重新投影一次。
    // 只在没跑 run 时重建，避免打断正在流的行。
    window.addEventListener("focus", function () {
      if (current !== 9) return;
      if (typeof AGENT_CURRENT_HANDLE !== "undefined" && AGENT_CURRENT_HANDLE) return;
      if (!document.getElementById("aiToolBody")) return;
      aiRestoreHist();
      aiLogRender();
    });

    // ===== 项目下拉框 + 新增项目 =====
    function loadProjects() {
      if (!window.__TAURI__ || !window.__TAURI__.core) return;
      window.__TAURI__.core.invoke("project_list").then(function(list){
        var sel = document.getElementById("projSel");
        sel.innerHTML = "";
        var opt0 = document.createElement("option");
        opt0.value = ""; opt0.textContent = "未选择项目";
        sel.appendChild(opt0);
        (list || []).forEach(function(p){
          var o = document.createElement("option");
          o.value = p.prjGUID;
          o.textContent = p.prjName + " · " + p.prjType;
          sel.appendChild(o);
        });
      }).catch(function(e){ console.error("loadProjects:", e); });
    }

    function showProjectModal(){ document.getElementById("projModal").classList.add("show"); }
    function hideProjectModal(){ document.getElementById("projModal").classList.remove("show"); }

    // ===== 新增项目：分步进度显示（不阻塞 UI） =====
    function showProgressBox(title) {
      var box = document.getElementById("projProgress");
      if (!box) {
        box = document.createElement("div");
        box.id = "projProgress";
        box.className = "proj-progress";
        document.body.appendChild(box);
      }
      box.innerHTML = '<div class="prog-title">' + title + '</div><div class="prog-list"></div>';
      box.classList.add("show");
      return box;
    }
    function addProgressStep(box, label) {
      var list = box.querySelector(".prog-list");
      var row = document.createElement("div");
      row.className = "prog-step";
      row.innerHTML = '<span class="prog-dot"></span><span class="prog-text">' + label + '</span>';
      list.appendChild(row);
      return row;
    }
    function setStepState(row, ok, msg) {
      row.className = "prog-step " + (ok ? "ok" : "fail");
      row.querySelector(".prog-text").textContent += (msg ? " — " + msg : "");
      if (ok) row.querySelector(".prog-dot").textContent = "✓";
      else row.querySelector(".prog-dot").textContent = "✗";
    }

    async function saveProject() {
      var name = document.getElementById("pjName").value.trim();
      var type = document.getElementById("pjType").value;
      var desc = document.getElementById("pjDesc").value.trim();
      if (!name) { alert("请输入项目名称"); return; }

      // 显示进度框（界面不假死：invoke 是异步 Promise）
      var box = showProgressBox("正在创建项目：<b>" + name + "</b>");
      var stepDb = addProgressStep(box, "写入数据库");
      var stepDir = addProgressStep(box, "创建项目目录");
      var stepTpl = addProgressStep(box, "复制开发模板");
      var stepDoc = addProgressStep(box, "生成项目说明");
      setStepState(stepDb, true, "开始");

      try {
        var res = await window.__TAURI__.core.invoke("project_create", {
          prjName: name, prjType: type, prjDescription: desc
        });
        // 根据返回的 steps 更新进度
        if (res && res.steps) {
          res.steps.forEach(function(s){
            if (s.step === "数据库") setStepState(stepDb, s.ok, s.msg);
            else if (s.step === "目录") setStepState(stepDir, s.ok, s.msg);
            else if (s.step === "模板") setStepState(stepTpl, s.ok, s.msg);
            else if (s.step === "说明") setStepState(stepDoc, s.ok, s.msg);
          });
        }
        if (res && res.error) {
          setTimeout(function(){ alert("部分步骤失败：" + res.error); }, 100);
        }
        var guid = res && res.guid ? res.guid : null;
        // 成功提示 + 关闭弹窗
        setTimeout(function(){
          box.classList.remove("show");
          hideProjectModal();
          loadProjects();
          if (guid) {
            var sel = document.getElementById("projSel");
            sel.value = guid;
            // 新项目需先更新 currentProject 再亮灯（后端 project_create 已初始化 module_state）
            window.__TAURI__.core.invoke("project_list").then(function(list){
              var found = null;
              (list || []).forEach(function(p){ if (p.prjGUID === guid) found = p; });
              currentProject = found; AGENT_CONST = null; AGENT_THEME = null;
              updateMenuDots();
            });
          }
          document.getElementById("statusText").textContent = "已保存项目：" + name;
        }, 1200);
      } catch(e) {
        setStepState(stepDb, false, String(e));
        setStepState(stepDir, false, "已跳过");
        setStepState(stepTpl, false, "已跳过");
        setStepState(stepDoc, false, "已跳过");
        setTimeout(function(){ box.classList.remove("show"); alert("保存失败：" + e); }, 100);
      }
    }

    document.getElementById("projAdd").addEventListener("click", showProjectModal);
    document.getElementById("pjCancel").addEventListener("click", hideProjectModal);
    document.getElementById("pjSave").addEventListener("click", saveProject);

    // IPC 状态
    if (window.__TAURI__ && window.__TAURI__.core) {
      document.getElementById("ipcState").textContent = "已连接 Tauri";
      document.getElementById("statusText").textContent = "IPC 就绪";
    }

    bindProjSel();
    // 多语言：先按上次选择渲染一遍，再开监听兜住后续动态渲染
    var _langSel = document.getElementById("langSel");
    if (_langSel) {
      _langSel.addEventListener("change", function() { i18nApply(_langSel.value); });
    }
    i18nApply(LANG);
    i18nWatch();
    render(0);
    initDb();
    loadProjects();
  </script>
</body>
</html>
